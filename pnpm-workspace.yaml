packages:
  - "apps/*"
  - "packages/*"
# Never let `pnpm run` / `pnpm exec` install on their own. pnpm 11's default is
# `install`: before every script it re-checks node_modules and, if it judges it
# stale, runs a full install first — and this is the ONLY file pnpm 11 reads
# the setting from (.npmrc carries auth/registry keys only, so the old
# `.npmrc` line was dead). In CI that implicit install ran inside the build
# and test steps on every run ("Packages: -103", ~7 s) and, on 2026-09-02/03,
# repeatedly never handed over to the script: 20–75 min of silence after
# "Done in 5.5s using pnpm" until the job timeout (runs 33664427747,
# 33687923179, 33684523571, 33734477552, 33734477584). The setup action's
# frozen-lockfile install is the one install; a stale tree is a warning to
# read, not a second install to wait on.
verifyDepsBeforeRun: warn
nodeLinker: hoisted
preferSymlinkedExecutables: false
minimumReleaseAge: 1440
blockExoticSubdeps: true
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  - react-native-svg
  - react-native
  - "@react-native/assets-registry"
  - "@react-native/babel-plugin-codegen"
  - "@react-native/babel-preset"
  - "@react-native/codegen"
  - "@react-native/community-cli-plugin"
  - "@react-native/debugger-frontend"
  - "@react-native/debugger-shell"
  - "@react-native/dev-middleware"
  - "@react-native/gradle-plugin"
  - "@react-native/js-polyfills"
  - "@react-native/metro-config"
  - "@react-native/normalize-colors"
  - "@react-native/virtualized-lists"
  - "@expo/config-types"
overrides:
  "expo": "~57.0.13"
  "@expo/dom-webview": "57.0.1"
  "lightningcss": "1.30.1"
  "uniwind": "1.10.1"
  "react": "19.2.3"
  "react-dom": "19.2.3"
  "react-native": "0.86.2"
  # Expo SDK 57 prescribes 4.5.1. Held at 4.5.5 (same 4.5 line, same worklets 0.10.x peer): 4.5.3
  # ships software-mansion/react-native-reanimated#9527, which stops a settled animation reverting
  # to a stale value after a JS-thread stall (#9965) - the drawer-reappears-at-open class (#1691,
  # #1797). 4.6.x needs worklets 0.12, outside expo-modules-core 57's peer range; do not float there.
  # Keep transitive auto-installed peers on the same native runtime.
  "react-native-reanimated": "4.5.5"
  # expo-router floats ^4.2.2; pin so the patch below has one target. 4.2.10 carries upstream's
  # useLayoutEffect toggle (react-navigation#13186) and the accessibility-hiding animated props.
  "react-native-drawer-layout": "4.2.10"
  "react-native-edge-to-edge": "^1.6.2"
  "react-native-gesture-handler": "~2.32.0"
  "react-native-safe-area-context": "~5.7.0"
  # react-native-calendars lists moment as an OPTIONAL dependency and requires it
  # inside a try/catch, which Metro treats as an optional require: absent, it is
  # skipped; present, it is bundled. The lock had never resolved it, and every
  # re-resolution would otherwise pull 4.7 MB of moment into the app graph for
  # an AgendaList we never render. Drop it so the shipped bundle cannot change.
  "react-native-calendars>moment": "-"
  "@electron/node-gyp": "10.2.0-electron.2"
  "tar": "^7.5.11"
  "react-native-nitro-modules": "0.35.9"
  # react-native-star-io10 1.13.0 ships a stario10.aar with minCompileSdk=37; Expo SDK 57
  # (AGP 8.12) tops out at compileSdk 36, so the Android build fails at :app:checkDebugAarMetadata.
  # Hold at 1.12.1 (aar minCompileSdk=1) until Expo ships an AGP that supports API 37.
  "react-native-star-io10": "1.12.1"
  # jest-expo 57 pulls jest-environment-* 29 (nested jest-mock 29 lacks clearMocksOnScope);
  # force them to 30 so the jest-30 workspace packages get a consistent test environment.
  "jest-environment-jsdom": "^30.4.1"
  "jest-environment-node": "^30.4.1"
  # concurrently@9.2.1 (apps/electron devDep) pins shell-quote 1.8.3 exactly — force the
  # patched release (GHSA-w7jw-789q-3m8p, critical, fixed 1.8.4). Floor then raised to
  # 1.9.0 for GHSA-395f-4hp3-45gv (high, quadratic-complexity DoS in parse(), fixed
  # 1.9.0 per OSV — there is no 1.8.5 release). ">=1.8.4" had gone stale: it resolved to
  # exactly the version the newer advisory names.
  "shell-quote": ">=1.9.0 <2"
  # external-editor@3.1.0 pins vulnerable tmp 0.0.33 — force the patched current release
  # (GHSA-ph9p-34f9-6g65, high).
  "external-editor@3.1.0>tmp": "0.2.7"
  # rxdb-premium -> eth-crypto -> eccrypto (unmaintained, archived) pins vulnerable
  # crypto deps exactly — force patched releases (elliptic GHSA-vjh7-7g9h-fjfh critical,
  # secp256k1 GHSA-584q-6j8j-r5pm high). elliptic 6.6.1 is the newest published release;
  # two low advisories targeting an unpublished 6.6.2 remain open upstream.
  "eccrypto>elliptic": ">=6.6.1"
  "eccrypto>secp256k1": ">=3.8.1 <4"
  # ethers 5.x (@ethersproject/providers, via rxdb-premium -> eth-crypto) pins
  # ws 8.18.0 exactly — force the patched line (GHSA-3h5v-q93c-6h6q high, DoS).
  "@ethersproject/providers>ws": ">=8.21.0 <9"
  # async-test-util (rxdb-premium) pins @babel/runtime 7.24.5 exactly
  # (GHSA-968p-4wvh-cqc8 moderate, ReDoS).
  "async-test-util>@babel/runtime": ">=7.26.10"
  # @novu/js -> socket.io-client pins socket.io-parser "~4.2.4"; the patched 4.2.7 is
  # inside that range but `pnpm update` will not move a transitive-only dependency, so
  # the lock sat on 4.2.6 (GHSA-2m8v-j782-fhvr high, zero-attachment memory exhaustion).
  # This one DOES reach the shipped client — @novu/js is a runtime import in
  # packages/core/src/services/novu/client.ts.
  "socket.io-client>socket.io-parser": ">=4.2.7 <5"
  # ajv 8.x pins fast-uri "^3.0.1" and the lock sat on 3.1.2, which left three high
  # host-confusion advisories open: GHSA-4c8g-83qw-93j6 (failed IDN canonicalization,
  # fixed 3.1.3), GHSA-v2hh-gcrm-f6hx (literal backslash authority delimiter, fixed
  # 3.1.4) and GHSA-7p8r-x3mc-p8w7 (backslash authority introducer, fixed 3.1.5).
  # 3.1.5 is the highest fix in the 3.x line per OSV, so that is the floor.
  # Audit hygiene only — ajv is test-surface here (sync-core write-contract fixtures) and
  # rxdb's ajv path is `rxdb/plugins/validate-ajv`, which this app never imports.
  "ajv>fast-uri": ">=3.1.5 <4"
  # @svgr/plugin-svgo pins svgo "^3.0.2" and the lock sat on 3.3.3 (GHSA-2p49-hgcm-8545
  # high — removeScripts leaves some executable scripts intact, fixed 3.3.4). Build-time
  # only, but this repo generates icon components from third-party SVG assets via @svgr/cli.
  "@svgr/plugin-svgo>svgo": ">=3.3.4 <4"
allowBuilds:
  "@firebase/util": false
  # sentry-cli's postinstall downloads the platform binary @sentry/webpack-plugin
  # (apps/electron sourcemap upload) shells out to; without it the strict install
  # fails outright (ERR_PNPM_IGNORED_BUILDS broke the 1.10.5 Publish Web Bundle run).
  "@sentry/cli": true
  "@serialport/bindings-cpp": true
  "@shopify/react-native-skia": true
  "@tailwindcss/oxide": true
  "@zowe/secrets-for-zowe-sdk": true
  "better-sqlite3": true
  "core-js": true
  "eccrypto": false
  "electron": true
  "electron-winstaller": false
  "esbuild": true
  "fs-xattr": true
  "keccak": true
  "macos-alias": true
  "msgpackr-extract": false
  "protobufjs": true
  "react-native-esc-pos-printer": true
  "rxdb": true
  "rxdb-premium": true
  "secp256k1": true
  "uniwind": true
  "unrs-resolver": true
  usb: true
patchedDependencies:
  # Backport of flash-list 2.2.2's guard in RVLayoutManager.modifyLayout: when the data
  # array shrinks, `layoutInfo` still carries the indices of ViewHolders measured before
  # the shrink, and the unguarded `this.layouts[index].width = ...` in processLayoutInfo
  # throws "Cannot set property 'width' of undefined" — the POS product grid dropping into
  # the error boundary mid-search (#1671). Expo SDK 57 prescribes exactly 2.0.2
  # (expo/bundledNativeModules.json), so we patch instead of upgrading; drop this patch
  # when the SDK moves flash-list to >= 2.2.2.
  #
  # Second hunk (2026-08-30): backport of Shopify/flash-list#2460 (open, fixes upstream
  # #2440 / #2291, still present in 2.3.2). The render stack can outlive a layout-table
  # shrink, and `ViewHolderCollection` read it through the throwing `getLayout(index)`
  # ("index out of bounds, not enough layouts") — the POS products grid fell into its
  # error boundary the moment the tablet's products column was dragged narrower (iPad,
  # flow 09) and on Android mid-search (run 33280466971). `tryGetLayout` returns undefined
  # for a dropped index; the render path skips that key and `validateItemSize` drops the
  # stale measurement, exactly as the upstream PR does. Drop with the upgrade above.
  "@shopify/flash-list@2.0.2": "patches/@shopify__flash-list@2.0.2.patch"
  # A closed drawer is only translated off-screen. Reanimated < 4.5.3 could revert that
  # transform to a stale value after a JS-thread stall (reanimated#9965, fixed by #9527 —
  # the drawer reappearing at the OPEN position over the routed screen, #1691/#1797), and the
  # dimming overlay is the panel's SIBLING reading the same animated progress. The app hides
  # the settled-closed panel with `drawerStyle.display: 'none'`; this patch (a) mirrors that
  # onto the overlay, which the library exposes no option to reach, and (b) returns 'none' from
  # the panel's own animated style once it has settled closed, so Reanimated's props registry
  # agrees with React's static prop. Kept as a guard after the Reanimated bump; drop it once
  # native flow 05 has stayed green on 4.5.5 for a while, or if upstream hides a closed panel.
  react-native-drawer-layout@4.2.10: patches/react-native-drawer-layout@4.2.10.patch
  "react-native-esc-pos-printer@4.5.0": "patches/react-native-esc-pos-printer@4.5.0.patch"
  rxdb@17.4.0: patches/rxdb@17.4.0.patch
  # NOTE: rxdb-premium cannot be patched here — its dist/ is produced by a
  # license-gated postinstall, so it is absent from the tarball pnpm patches.
  # The resurrection-index-leak fix for it lives in
  # scripts/patch-rxdb-premium-resurrection-leak.mjs (root postinstall).
