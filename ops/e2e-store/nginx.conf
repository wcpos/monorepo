# nginx in front of php-fpm. Reached only through 127.0.0.1 (compose `ports`),
# which `tailscale serve --https=8443` proxies to; TLS ends at tailscale.
server {
	listen 80 default_server;
	server_name _;
	root /var/www/html;
	index index.php;

	client_max_body_size 32m;

	# Pretty permalinks: REST (/wp-json/...) and the WCPOS /wcpos-auth, /wcpos-login
	# rewrite rules all route through index.php.
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param HTTPS on;
		fastcgi_read_timeout 120s;
		fastcgi_buffers 16 32k;
		fastcgi_buffer_size 64k;
	}

	location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
		expires 1h;
		access_log off;
		try_files $uri =404;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}
}
