; php-fpm pool for the E2E store. dev-next has about 6 workers and six CI shards
; saturated them (#2321); 24 serves the whole six-shard matrix. At roughly 80 MB
; per busy worker that is about 2 GB, inside the container's 2560m limit.
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_terminate_timeout = 120s
