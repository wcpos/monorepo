; php-fpm pool for the E2E store. dev-next has about 6 workers and six CI shards
; saturated them (#2321); 20 still serves the six-shard matrix at over three
; workers a shard. At roughly 80 MB per busy worker that is about 1.6 GB, inside
; the container's 2g limit, which keeps every cap inside the VM (compose.yaml).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_terminate_timeout = 120s
