; PHP settings for the E2E store's php-fpm container.
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 32M
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Plugins are swapped by fetch-plugins.sh without a restart; recheck every 60s.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
