<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Checkout tender flow (wcpos/roadmap#111)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* PROTOTYPE. Three variants of the checkout modal on one fake POS screen, switchable with the
   bottom bar or ←/→. One shared tender state machine (legs, balance, reader states) drives all
   three — only the layout differs. Throwaway. */
:root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; --accent:#0f766e; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
* { box-sizing:border-box; } html,body { margin:0; height:100%; font-family:Inter,system-ui,sans-serif; color:var(--ink); background:var(--bg); }
.money { font-variant-numeric:tabular-nums; }
button { font:inherit; cursor:pointer; }

/* fake POS */
#pos { position:fixed; inset:0; display:grid; grid-template-columns:1fr 380px; }
#products { padding:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; align-content:start; }
#products .p { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; height:110px; display:flex; flex-direction:column; justify-content:space-between; font-weight:600; }
#products .p span { color:var(--muted); font-weight:500; }
#cart { background:var(--card); border-left:1px solid var(--line); display:flex; flex-direction:column; }
#cart .h { padding:18px 20px; font-weight:700; border-bottom:1px solid var(--line); }
#cart .lines { flex:1; padding:12px 20px; }
#cart .line { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
#cart .tot { padding:16px 20px; border-top:2px solid var(--ink); display:flex; justify-content:space-between; font-size:24px; font-weight:800; }
#cart .go { margin:0 20px 20px; padding:18px; background:var(--accent); color:#fff; border:0; border-radius:12px; font-size:18px; font-weight:700; }

/* modal from the right */
#scrim { position:fixed; inset:0; background:rgba(15,23,42,.35); opacity:0; pointer-events:none; transition:opacity .25s; }
#modal { position:fixed; top:0; right:0; bottom:0; width:min(1040px,86vw); background:var(--card); box-shadow:-20px 0 60px rgba(0,0,0,.25); transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
body.open #scrim { opacity:1; pointer-events:auto; } body.open #modal { transform:none; }
.mh { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); }
.mh h2 { margin:0; font-size:18px; flex:1; }
.tabs { display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px; }
.tabs button { border:0; background:transparent; padding:8px 14px; border-radius:8px; font-weight:600; color:var(--muted); }
.tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.x { border:0; background:transparent; font-size:22px; color:var(--muted); }
.body { flex:1; overflow:auto; }

/* shared pieces */
.tile { position:relative; border:1px solid var(--line); background:#fff; border-radius:14px; padding:18px 16px; text-align:left; display:flex; flex-direction:column; gap:8px; min-height:104px; }
.tile:hover:not(:disabled) { border-color:var(--accent); }
.tile:disabled { opacity:.55; cursor:not-allowed; }
.tile .t { font-weight:700; font-size:17px; } .tile .k { font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.tile .why { font-size:12px; color:var(--warn); font-weight:600; }
.tile .off { position:absolute; top:12px; right:12px; font-size:11px; padding:2px 8px; border-radius:999px; background:#fef3c7; color:var(--warn); font-weight:700; }
.balance { display:flex; align-items:baseline; gap:12px; }
.balance .k { font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); } .balance .v { font-size:40px; font-weight:800; letter-spacing:-.02em; }
.legs { display:flex; flex-direction:column; gap:8px; }
.leg { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:#fff; }
.leg .n { flex:1; font-weight:600; } .leg .s { font-size:12px; padding:3px 9px; border-radius:999px; font-weight:700; }
.s.captured,.s.authorized { background:#dcfce7; color:var(--ok); } .s.pending,.s.collecting,.s.connecting { background:#e0f2fe; color:#075985; } .s.failed,.s.voided { background:#fee2e2; color:var(--bad); }
.leg .rm { border:0; background:transparent; color:var(--muted); font-size:18px; }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pad button { padding:18px; font-size:22px; font-weight:600; border:1px solid var(--line); background:#fff; border-radius:12px; }
.pad button.w { grid-column:span 3; background:var(--accent); color:#fff; border-color:var(--accent); }
.quick { display:flex; gap:8px; flex-wrap:wrap; } .quick button { padding:10px 14px; border:1px solid var(--line); background:#fff; border-radius:999px; font-weight:600; }
.amt { font-size:44px; font-weight:800; letter-spacing:-.02em; padding:8px 0 16px; }
.amt small { font-size:16px; color:var(--muted); font-weight:500; margin-left:8px; }
.reader { display:flex; flex-direction:column; align-items:center; gap:16px; padding:40px 20px; text-align:center; }
.ring { width:96px; height:96px; border-radius:50%; border:6px solid #cbd5e1; border-top-color:var(--accent); animation:spin 1.1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.big { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-size:48px; color:#fff; } .big.ok { background:var(--ok); } .big.bad { background:var(--bad); }
.sim { display:flex; gap:8px; margin-top:12px; } .sim button { padding:8px 12px; border:1px dashed var(--muted); background:transparent; border-radius:8px; font-size:12px; color:var(--muted); }
.btn { padding:14px 18px; border-radius:12px; border:1px solid var(--line); background:#fff; font-weight:700; } .btn.pri { background:var(--accent); color:#fff; border-color:var(--accent); } .btn.danger { color:var(--bad); }
.receipt { padding:40px; max-width:520px; margin:0 auto; text-align:center; }
.receipt .paper { background:#fff; border:1px solid var(--line); border-radius:8px; padding:24px; text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:13px; margin:20px 0; }
.receipt .paper div { display:flex; justify-content:space-between; padding:3px 0; }
.note { font-size:13px; color:var(--muted); }
.legacy { padding:24px; display:grid; gap:12px; }
.legacy .frame { border:2px dashed var(--line); border-radius:12px; padding:40px; text-align:center; color:var(--muted); }
.cancel { padding:24px; text-align:center; }
.cancel .list { text-align:left; margin:16px 0; }

/* Variant A — Tiles: balance header, tile grid, keypad slides under the tapped tile */
.A .body { padding:24px; display:grid; gap:20px; }
.A .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.A .entry { display:grid; grid-template-columns:1fr 320px; gap:24px; }
/* Variant B — Two-pane: ledger left like a receipt, tenders + keypad always visible right */
.B .body { display:grid; grid-template-columns:400px 1fr; }
.B .left { border-right:1px solid var(--line); padding:24px; display:flex; flex-direction:column; gap:16px; background:var(--bg); }
.B .right { padding:24px; display:grid; gap:20px; align-content:start; }
.B .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.B .tile { min-height:84px; padding:14px; } .B .tile.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
/* Variant C — Steps: a rail on the left, one step at a time */
.C .body { display:grid; grid-template-columns:260px 1fr; }
.C .rail { border-right:1px solid var(--line); padding:24px; background:var(--bg); display:flex; flex-direction:column; gap:20px; }
.C .step { display:flex; gap:12px; align-items:center; color:var(--muted); font-weight:600; } .C .step.on { color:var(--ink); } .C .step i { width:26px; height:26px; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center; font-style:normal; font-size:12px; }
.C .step.done i { background:var(--ok); border-color:var(--ok); color:#fff; }
.C .stage { padding:32px; display:grid; gap:20px; align-content:start; }
.C .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }

/* prototype chrome */
#bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:10px; background:#111; color:#fff; border-radius:999px; padding:8px 12px; box-shadow:0 10px 30px rgba(0,0,0,.45); font-size:13px; border:1px solid #333; }
#bar button { background:#222; color:#fff; border:1px solid #444; border-radius:999px; padding:7px 11px; } #bar button.on { background:#fff; color:#111; }
#bar .lbl { padding:0 6px; font-weight:600; min-width:220px; text-align:center; }
#note { position:fixed; top:14px; left:14px; z-index:50; background:rgba(17,17,17,.85); color:#ddd; font-size:12px; padding:8px 10px; border-radius:8px; max-width:440px; line-height:1.4; }
</style>
</head>
<body>
<div id="note"><b>PROTOTYPE</b> · Fake POS + three checkout modal layouts over one tender state machine. Press <b>Check out</b>. "Simulate" buttons stand in for the card reader. Not production.</div>
<div id="pos">
  <div id="products"></div>
  <div id="cart"><div class="h">Cart · Priya</div><div class="lines" id="cartlines"></div><div class="tot"><span>Total</span><span class="money" id="carttotal"></span></div><button class="go" id="go">Check out</button></div>
</div>
<div id="scrim"></div>
<div id="modal"></div>
<div id="bar"><button id="prev">←</button><span class="lbl" id="lbl"></span><button id="next">→</button><span style="width:1px;height:20px;background:#444"></span><button id="offline">Go offline</button><button id="reset">Reset</button></div>

<script>
// ------------------------------------------------------------- data (descriptor shapes from #104)
const ORDER = { lines: [ ['Miles Davis — Kind of Blue (LP)', 1, 49.95], ['Record cleaning kit', 2, 36.00], ['Tote bag', 1, 12.00] ], total: 92.95 };
const METHODS = [
  { id:'pos_cash', title:'Cash', kind:'cash', capture:{mode:'manual'}, change:true, offline:'record', partial:true },
  { id:'pos_card', title:'Card (manual)', kind:'card', capture:{mode:'manual'}, change:false, offline:'record', partial:true, hint:'Cashier records an external terminal' },
  { id:'stripe_terminal', title:'Stripe Terminal', kind:'card', capture:{mode:'device', provider:'stripe', transport:'bluetooth'}, change:false, offline:'queue', partial:true, hint:'Bluetooth reader' },
  { id:'pos_gift_card', title:'Gift card', kind:'stored_value', capture:{mode:'stored_value'}, change:false, offline:'none', partial:true, hint:'Applied first' },
  { id:'square_terminal', title:'Square Terminal', kind:'card', capture:{mode:'device', provider:'square'}, change:false, offline:'none', partial:true, undrivable:'Update the app to use Square Terminal' },
];
const LEGACY = [ { id:'paypal', title:'PayPal', hint:'Opens the order-pay page' }, { id:'sumup', title:'SumUp', hint:'Opens the order-pay page' } ];
const fmt = n => '$' + n.toFixed(2);

// ------------------------------------------------------------- shared tender state machine
let S; function reset() { S = { legs:[], view:'select', tab:'grid', current:null, entry:'', offline:false, receiptShown:false }; }
reset();
const paid = () => S.legs.filter(l => ['captured','authorized'].includes(l.status)).reduce((a,l)=>a+l.amount,0);
const balance = () => Math.max(0, +(ORDER.total - paid()).toFixed(2));
const hasLive = () => S.legs.some(l => ['captured','authorized','pending','collecting','connecting'].includes(l.status));
function pick(m) {
  if (m.undrivable) return;
  if (S.offline && m.offline === 'none') return;
  S.current = { method:m, amount:balance(), tendered:null };
  S.entry = balance().toFixed(2);
  S.view = m.capture.mode === 'stored_value' ? 'gift' : 'amount';
  render();
}
function key(k) {
  if (k === '⌫') S.entry = S.entry.slice(0,-1);
  else if (k === 'C') S.entry = '';
  else S.entry = (S.entry === '0.00' ? '' : S.entry) + k;
  render();
}
function confirmAmount() {
  const m = S.current.method; const v = parseFloat(S.entry) || 0; if (v <= 0) return;
  if (m.change) { // cash: tendered may exceed the balance; amount applied is capped at balance
    const applied = Math.min(v, balance());
    S.legs.push({ id:crypto.randomUUID().slice(0,8), method:m, amount:applied, tendered:v, change:+(v-applied).toFixed(2), status:'captured', offline:S.offline });
    finishOrNext(); return;
  }
  const applied = Math.min(v, balance());
  if (m.capture.mode === 'device') { S.current.amount = applied; S.view = 'reader'; S.readerState = 'connecting'; render(); setTimeout(()=>{ if (S.view==='reader'){ S.readerState='collecting'; render(); } }, 900); return; }
  S.legs.push({ id:crypto.randomUUID().slice(0,8), method:m, amount:applied, status:'captured', offline:S.offline });
  finishOrNext();
}
function readerResult(ok) {
  const m = S.current.method;
  S.legs.push({ id:crypto.randomUUID().slice(0,8), method:m, amount:S.current.amount, status: ok ? 'authorized' : 'failed', offline:S.offline });
  if (ok) finishOrNext(); else { S.view = 'select'; S.current = null; render(); }
}
function giftApply(v) { S.legs.push({ id:crypto.randomUUID().slice(0,8), method:S.current.method, amount:Math.min(v, balance()), status:'captured' }); finishOrNext(); }
function finishOrNext() { S.current = null; S.view = balance() === 0 ? 'receipt' : 'select'; render(); }
function cancelSplit() { S.view = 'cancel'; render(); }
function confirmCancel() { S.legs.forEach(l => { if (['captured','authorized'].includes(l.status)) l.status = 'voided'; }); reset(); close(); }
function open() { document.body.classList.add('open'); render(); }
function close() { document.body.classList.remove('open'); }

// ------------------------------------------------------------- shared fragments
const legsHtml = (opts={}) => S.legs.length ? `<div class="legs">${S.legs.map(l => `<div class="leg"><span class="n">${l.method.title}${l.tendered ? ` <span class="note">· tendered ${fmt(l.tendered)}, change ${fmt(l.change)}</span>` : ''}${l.offline ? ' <span class="note">· offline</span>' : ''}</span><span class="money">${fmt(l.amount)}</span><span class="s ${l.status}">${l.status}</span></div>`).join('')}</div>` : (opts.empty ? `<div class="note">${opts.empty}</div>` : '');
const balanceHtml = () => `<div class="balance"><span class="k">${paid() > 0 ? 'Remaining' : 'Total'}</span><span class="v money">${fmt(balance())}</span>${paid() > 0 ? `<span class="note">${fmt(paid())} of ${fmt(ORDER.total)} paid</span>` : ''}</div>`;
const tilesHtml = (cls='') => METHODS.map(m => {
  const offlineBlocked = S.offline && m.offline === 'none';
  const dis = m.undrivable || offlineBlocked;
  return `<button class="tile ${cls}" data-m="${m.id}" ${dis ? 'disabled' : ''}>
    ${m.offline === 'record' ? '<span class="off">works offline</span>' : ''}
    <span class="k">${m.kind.replace('_',' ')}</span><span class="t">${m.title}</span>
    ${m.undrivable ? `<span class="why">${m.undrivable}</span>` : offlineBlocked ? '<span class="why">Needs a connection</span>' : m.hint ? `<span class="note">${m.hint}</span>` : ''}
  </button>`; }).join('');
const padHtml = () => `<div class="amt money">${fmt(parseFloat(S.entry)||0)}${S.current.method.change ? '<small>tendered</small>' : ''}</div>
  ${S.current.method.change ? `<div class="quick">${[balance(), Math.ceil(balance()/5)*5, Math.ceil(balance()/10)*10, Math.ceil(balance()/50)*50].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button data-q="${v}">${fmt(v)}</button>`).join('')}</div>` : `<div class="quick"><button data-q="${balance()}">Full balance ${fmt(balance())}</button></div>`}
  <div class="pad">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button class="w" data-ok>${S.current.method.capture.mode==='device' ? 'Send to reader' : 'Take ' + fmt(Math.min(parseFloat(S.entry)||0, balance()))}</button></div>
  <button class="btn" data-back style="margin-top:8px">Back</button>`;
const readerHtml = () => S.readerState === 'connecting' ? `<div class="reader"><div class="ring"></div><div><b>Connecting to reader…</b><div class="note">Stripe Terminal · Bluetooth</div></div></div>`
  : `<div class="reader"><div class="ring"></div><div><b>Present card</b><div class="note">${fmt(S.current.amount)} on the reader</div></div><div class="sim"><button data-sim="1">Simulate: approved</button><button data-sim="0">Simulate: declined</button></div><button class="btn" data-back>Cancel</button></div>`;
const giftHtml = () => `<div style="max-width:420px"><div class="k note">Gift card</div><div class="amt money">Balance $30.00</div><div class="note">Applied before other tenders.</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" data-gift="30">Apply $30.00</button><button class="btn" data-back>Back</button></div></div>`;
const receiptHtml = () => `<div class="receipt"><div class="big ok" style="margin:0 auto">✓</div><h2 style="margin:16px 0 4px">Paid ${fmt(ORDER.total)}</h2><div class="note">${S.legs.some(l=>l.offline) ? 'Recorded offline — will sync when back online' : 'Synced'}</div>
  <div class="paper">${ORDER.lines.map(([n,q,t])=>`<div><span>${q} × ${n}</span><span>${fmt(t)}</span></div>`).join('')}<div style="border-top:1px dashed #999;margin-top:6px;padding-top:6px"><b>Total</b><b>${fmt(ORDER.total)}</b></div>${S.legs.filter(l=>['captured','authorized'].includes(l.status)).map(l=>`<div><span>${l.method.title}${l.tendered?` (tendered ${fmt(l.tendered)})`:''}</span><span>${fmt(l.amount)}</span></div>`).join('')}${S.legs.some(l=>l.change)?`<div><span>Change</span><span>${fmt(S.legs.reduce((a,l)=>a+(l.change||0),0))}</span></div>`:''}</div>
  <div style="display:flex;gap:8px;justify-content:center"><button class="btn pri" data-done>Print receipt</button><button class="btn" data-done>No receipt</button></div></div>`;
const cancelHtml = () => `<div class="cancel"><h2>Cancel this payment?</h2><div class="note">Money already taken has to go back:</div><div class="list">${S.legs.filter(l=>['captured','authorized'].includes(l.status)).map(l=>`<div class="leg"><span class="n">${l.method.kind==='cash' ? `Return ${fmt(l.amount)} cash to the customer` : `Void ${fmt(l.amount)} on ${l.method.title}`}</span></div>`).join('') || '<div class="note">Nothing taken yet.</div>'}</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn danger" data-confirmcancel>Yes, cancel and void</button><button class="btn" data-back>Keep going</button></div></div>`;
const legacyHtml = () => `<div class="legacy">${hasLive() ? `<div class="note" style="color:var(--warn)"><b>Legacy payments can't be combined with a split.</b> A legacy gateway charges the whole order — cancel the payments taken so far to use one.</div>` : ''}${LEGACY.map(g=>`<button class="tile" ${hasLive()?'disabled':''}><span class="k">legacy</span><span class="t">${g.title}</span><span class="note">${g.hint}</span></button>`).join('')}<div class="frame">The store's order-pay page would load here</div></div>`;
const headerHtml = (title) => `<div class="mh"><h2>${title}</h2><div class="tabs"><button data-tab="grid" class="${S.tab==='grid'?'on':''}">Payments</button><button data-tab="legacy" class="${S.tab==='legacy'?'on':''}">Legacy</button></div>${hasLive() && S.view!=='receipt' ? '<button class="btn danger" data-cancel>Cancel payment</button>' : ''}<button class="x" data-close>✕</button></div>`;

// ------------------------------------------------------------- variants
function A() { // Tiles
  let body;
  if (S.tab === 'legacy') body = legacyHtml();
  else if (S.view === 'receipt') body = receiptHtml();
  else if (S.view === 'cancel') body = cancelHtml();
  else if (S.view === 'select') body = `${balanceHtml()}${legsHtml()}<div class="grid">${tilesHtml()}</div>${S.legs.length ? '' : '<div class="note">Tap a payment type. Take part of the total to split.</div>'}`;
  else body = `${balanceHtml()}<div class="entry"><div><div class="k note" style="margin-bottom:8px">${S.current.method.title}</div>${S.view==='reader'?readerHtml():S.view==='gift'?giftHtml():padHtml()}</div><div>${legsHtml({empty:'No payments yet'})}</div></div>`;
  return `<div class="A" style="display:contents">${headerHtml('Checkout · Priya')}<div class="body">${body}</div></div>`;
}
A.title = 'Tiles — balance, grid, keypad under the tapped tile';

function B() { // Two-pane
  const right = S.tab === 'legacy' ? legacyHtml() : S.view === 'receipt' ? receiptHtml() : S.view === 'cancel' ? cancelHtml()
    : `<div class="grid">${tilesHtml(S.current ? '' : '')}</div>${S.current ? `<div>${S.view==='reader'?readerHtml():S.view==='gift'?giftHtml():padHtml()}</div>` : '<div class="note">Choose a payment type. Every payment you take is added to the list on the left until the balance is zero.</div>'}`;
  return `<div class="B" style="display:contents">${headerHtml('Checkout')}<div class="body"><div class="left"><div class="note">Priya · order #1187</div>${ORDER.lines.map(([n,q,t])=>`<div class="line" style="display:flex;justify-content:space-between;font-size:14px"><span>${q} × ${n}</span><span class="money">${fmt(t)}</span></div>`).join('')}<div style="display:flex;justify-content:space-between;font-weight:800;font-size:20px;border-top:2px solid var(--ink);padding-top:10px"><span>Total</span><span class="money">${fmt(ORDER.total)}</span></div>${legsHtml({empty:'No payments yet'})}<div style="margin-top:auto">${balanceHtml()}</div></div><div class="right">${right}</div></div></div>`;
}
B.title = 'Two-pane — ledger left, tenders + keypad right';

function C() { // Steps
  const step = S.tab==='legacy' ? 0 : S.view==='receipt' ? 3 : S.view==='select' ? 1 : 2;
  const rail = `<div class="rail">${balanceHtml()}${[['1','Choose payment'],['2','Amount & confirm'],['3','Receipt']].map(([n,t],i)=>`<div class="step ${step===i+1?'on':''} ${step>i+1?'done':''}"><i>${step>i+1?'✓':n}</i>${t}</div>`).join('')}<div style="margin-top:auto">${legsHtml()}</div></div>`;
  const stage = S.tab==='legacy' ? legacyHtml() : S.view==='receipt' ? receiptHtml() : S.view==='cancel' ? cancelHtml()
    : S.view==='select' ? `<h3 style="margin:0">${S.legs.length ? 'Choose the next payment' : 'How is the customer paying?'}</h3><div class="grid">${tilesHtml()}</div>`
    : `<h3 style="margin:0">${S.current.method.title}</h3><div style="max-width:420px">${S.view==='reader'?readerHtml():S.view==='gift'?giftHtml():padHtml()}</div>`;
  return `<div class="C" style="display:contents">${headerHtml('Checkout')}<div class="body">${rail}<div class="stage">${stage}</div></div></div>`;
}
C.title = 'Steps — one thing at a time, balance on the rail';

// ------------------------------------------------------------- chrome + wiring
const VARIANTS = { A, B, C }; const keys = Object.keys(VARIANTS);
let variant = keys.includes(location.hash.replace('#','')) ? location.hash.replace('#','') : 'A';
function render() {
  document.getElementById('modal').innerHTML = VARIANTS[variant]();
  document.getElementById('lbl').textContent = `${variant} — ${VARIANTS[variant].title}`;
  document.getElementById('offline').className = S.offline ? 'on' : ''; document.getElementById('offline').textContent = S.offline ? 'Offline' : 'Go offline';
  location.hash = variant;
}
document.getElementById('products').innerHTML = ['Kind of Blue (LP)','Cleaning kit','Tote bag','A Love Supreme (LP)','Slipmat','Headshell'].map(n=>`<div class="p">${n}<span>$12–$50</span></div>`).join('');
document.getElementById('cartlines').innerHTML = ORDER.lines.map(([n,q,t])=>`<div class="line"><span>${q} × ${n}</span><span class="money">${fmt(t)}</span></div>`).join('');
document.getElementById('carttotal').textContent = fmt(ORDER.total);
document.getElementById('go').onclick = open;
document.getElementById('scrim').onclick = () => { if (!hasLive()) close(); };
document.getElementById('modal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.m) return pick(METHODS.find(m=>m.id===b.dataset.m));
  if (b.dataset.k) return key(b.dataset.k);
  if (b.dataset.q) { S.entry = (+b.dataset.q).toFixed(2); return render(); }
  if ('ok' in b.dataset) return confirmAmount();
  if (b.dataset.sim) return readerResult(b.dataset.sim === '1');
  if (b.dataset.gift) return giftApply(+b.dataset.gift);
  if ('back' in b.dataset) { S.current = null; S.view = 'select'; return render(); }
  if (b.dataset.tab) { S.tab = b.dataset.tab; return render(); }
  if ('cancel' in b.dataset) return cancelSplit();
  if ('confirmcancel' in b.dataset) return confirmCancel();
  if ('close' in b.dataset) { if (hasLive() && S.view!=='receipt') return cancelSplit(); return close(); }
  if ('done' in b.dataset) { reset(); return close(); }
});
document.getElementById('prev').onclick = () => { variant = keys[(keys.indexOf(variant)+keys.length-1)%keys.length]; render(); };
document.getElementById('next').onclick = () => { variant = keys[(keys.indexOf(variant)+1)%keys.length]; render(); };
document.getElementById('offline').onclick = () => { S.offline = !S.offline; render(); };
document.getElementById('reset').onclick = () => { reset(); render(); };
window.addEventListener('keydown', e => { if (e.key==='ArrowLeft') document.getElementById('prev').click(); if (e.key==='ArrowRight') document.getElementById('next').click(); });
render();
</script>
