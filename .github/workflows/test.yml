name: Test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gallery: ${{ steps.plan.outputs.gallery }}
      lint: ${{ steps.plan.outputs.lint }}
      unit: ${{ steps.plan.outputs.unit }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-plan
        id: plan
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

  lint:
    name: "\U0001F9F9 Lint"
    runs-on: ubuntu-latest
    # turbo-driven; a healthy run is ~10 min (lint + typecheck + script tests + translations). On 2026-09-02 a wedged Lint held the Merge Gate for its whole 1h14 budget (PR #1787, run 33684523571).
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.lint == 'true' && (github.event.pull_request.draft == false || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: "\U0001F3D7 Setup repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: "\U0001F3D7 Setup monorepo"
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}
          skip-install-scripts: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}

      - name: "\U0001F9F9 Run ESLint"
        run: pnpm lint

      - name: "\U0001F50D Typecheck"
        run: pnpm typecheck

      - name: "\U0001F9EA Run script tests"
        run: pnpm test:scripts

      - name: "\U0001F310 Check translation source strings"
        run: pnpm translations:check

  unit-tests:
    name: "\U0001F9EA Unit Tests"
    runs-on: ubuntu-latest
    # Jest across the workspace; a healthy run is ~4 min. Same hang class as the lint job.
    timeout-minutes: 25
    needs: [changes, lint]
    if: needs.changes.outputs.unit != 'none'
    env:
      UNIT_PACKAGES: ${{ needs.changes.outputs.unit }}
      PLUGIN_BRANCH: ${{ (github.base_ref || github.ref_name) == 'next' && 'next' || 'main' }}
      # The plugin checkout needs the wcpos-bot app secrets, which GitHub withholds from
      # Dependabot and from fork PRs; those runs skip the Template Studio lane explicitly.
      PLUGIN_CHECKOUT: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      WCPOS_GALLERY_TEMPLATES_DIR: ${{ github.workspace }}/.plugin-checkout/woocommerce-pos/templates/gallery
      WCPOS_GALLERY_REGISTRY_PATH: ${{ github.workspace }}/.plugin-checkout/woocommerce-pos/includes/Templates/Gallery_Registry.php
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: "\U0001F3D7 Setup repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: "\U0001F3D7 Setup monorepo"
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}
          skip-install-scripts: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}

      - name: "\U0001F9EA Run tests for each package"
        run: |
          wants() { [ "$UNIT_PACKAGES" = all ] && return 0; case ",$UNIT_PACKAGES," in *",$1,"*) return 0;; esac; return 1; }
          rm -f "$RUNNER_TEMP/ci-unit-executed"
          find packages apps/main -name test-results.json -delete
          # Track failures but continue to generate coverage for all packages
          failed=0

          # Run tests for each package separately to get individual coverage
          for pkg in core components database hooks utils order-math resizable-panels; do
            wants "$pkg" || continue
            echo "::group::Testing @wcpos/$pkg"
            cd packages/$pkg
            if [ -f "jest.config.js" ]; then
              npx jest --ci --passWithNoTests --coverage --coverageReporters=json-summary --coverageReporters=text --json --outputFile=test-results.json || failed=1
            fi
            cd ../..
            echo "::endgroup::"
          done

          # Run query package separately (uses .cjs config)
          if wants query; then
            echo "::group::Testing @wcpos/query"
            cd packages/query
            npx jest --config jest.config.cjs --ci --coverage --coverageReporters=json-summary --coverageReporters=text --json --outputFile=test-results.json || failed=1
            cd ../..
            echo "::endgroup::"
          fi

          # Fail the step if any tests failed
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more package tests failed"
            exit 1
          fi

      - name: Generate plugin checkout token
        if: env.PLUGIN_CHECKOUT == 'true' && (needs.changes.outputs.unit == 'all' || contains(format(',{0},', needs.changes.outputs.unit), ',template-studio,'))
        id: plugin-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos
          permission-contents: read

      - name: Check out plugin gallery
        if: env.PLUGIN_CHECKOUT == 'true' && (needs.changes.outputs.unit == 'all' || contains(format(',{0},', needs.changes.outputs.unit), ',template-studio,'))
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wcpos/woocommerce-pos
          ref: ${{ env.PLUGIN_BRANCH }}
          token: ${{ steps.plugin-token.outputs.token }}
          path: .plugin-checkout/woocommerce-pos
          persist-credentials: false
          sparse-checkout: |
            templates/gallery
            includes/Templates/Gallery_Registry.php
          sparse-checkout-cone-mode: false

      - name: "\U0001F9EA Run vitest packages"
        run: |
          wants() { [ "$UNIT_PACKAGES" = all ] && return 0; case ",$UNIT_PACKAGES," in *",$1,"*) return 0;; esac; return 1; }
          # sync-core and sync-engine arrived from the sync lab on vitest and
          # stay on vitest (ADR: converting ~1000 proven tests to Jest during
          # the port risks semantic drift). printer and receipt-renderer are
          # vitest too. This workflow bypasses turbo, so every vitest package
          # must be listed explicitly here.
          failed=0

          # Coverage-ratcheted vitest packages — see coverage-baseline.json.
          # The ratchet reads packages/<pkg>/coverage/coverage-summary.json,
          # so these must emit the json-summary reporter.
          for pkg in sync-core sync-engine; do
            wants "$pkg" || continue
            touch "$RUNNER_TEMP/ci-unit-executed"
            echo "::group::Testing @wcpos/$pkg"
            pnpm --filter @wcpos/$pkg exec vitest run \
              --coverage \
              --coverage.provider=v8 \
              --coverage.include='src/**' \
              --coverage.reporter=json-summary \
              --coverage.reporter=text-summary || failed=1
            echo "::endgroup::"
          done

          # Vitest packages with no coverage floor yet. printer (43 suites) and
          # receipt-renderer (3 suites) previously never ran in CI at all;
          # scanner (7 suites / 63 tests) was found dark by the CI-matrix
          # tripwire and joined here (ruling R15).
          for pkg in printer receipt-renderer scanner template-studio; do
            wants "$pkg" || continue
            # No app secrets (Dependabot, fork PR): no plugin checkout, so no Studio lane.
            [ "$pkg" = template-studio ] && [ "$PLUGIN_CHECKOUT" != true ] && continue
            touch "$RUNNER_TEMP/ci-unit-executed"
            echo "::group::Testing @wcpos/$pkg"
            if [ "$pkg" = template-studio ]; then
              pnpm --filter @wcpos/template-studio exec vitest run --maxWorkers=2 || failed=1
            else
              pnpm --filter @wcpos/$pkg test || failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more vitest package suites failed"
            exit 1
          fi

      - name: "\U0001F9EA Run apps/main tests"
        run: |
          wants() { [ "$UNIT_PACKAGES" = all ] && return 0; case ",$UNIT_PACKAGES," in *",$1,"*) return 0;; esac; return 1; }
          wants main || exit 0
          touch "$RUNNER_TEMP/ci-unit-executed"
          # apps/main is on jest-expo 29 while packages are on jest 30, so it
          # cannot join the loop above. Its jest config ignores e2e/ (Playwright
          # specs, see #676), plugins/ and metro/ (node:test files, run separately).
          set -o pipefail
          failed=0

          echo "::group::Testing @wcpos/main (jest-expo)"
          pnpm --filter @wcpos/main exec jest --ci --passWithNoTests --json --outputFile=test-results.json || failed=1
          echo "::endgroup::"

          echo "::group::Testing @wcpos/main config plugins (node:test)"
          pnpm --filter @wcpos/main test:plugins 2>&1 | tee apps/main/plugin-test-results.tap || failed=1
          echo "::endgroup::"

          # Invoked directly rather than via a package.json script: package.json
          # scripts are part of the native fingerprint, so adding one there
          # would spend an EAS build (verified with @expo/fingerprint, 2026-08-30).
          echo "::group::Testing @wcpos/main Metro config (node:test)"
          pnpm --filter @wcpos/main exec node --test 'metro/*.test.mjs' 2>&1 | tee apps/main/metro-test-results.tap || failed=1
          echo "::endgroup::"

          if [ "$failed" -ne 0 ]; then
            echo "::error::apps/main tests failed"
            exit 1
          fi

      - name: "\U0001F9FE Prove narrowed unit tests ran"
        # A Studio-only run without the app secrets is deliberately skipped, not an empty test selection.
        if: always() && needs.changes.outputs.unit != 'all' && !(env.PLUGIN_CHECKOUT != 'true' && needs.changes.outputs.unit == 'template-studio')
        run: |
          ran=false; [ -f "$RUNNER_TEMP/ci-unit-executed" ] && ran=true
          for file in packages/*/test-results.json apps/main/test-results.json; do
            [ -f "$file" ] && node -e 'process.exit(require("./" + process.argv[1]).numTotalTests > 0 ? 0 : 1)' "$file" && ran=true
          done
          [ "$ran" = true ] || { echo "::error::narrowed unit run selected no tests"; exit 1; }

      - name: "\U0001F3C1 Run sync-engine performance contracts"
        run: |
          wants() { [ "$UNIT_PACKAGES" = all ] && return 0; case ",$UNIT_PACKAGES," in *",$1,"*) return 0;; esac; return 1; }
          wants sync-engine || exit 0
          # The perf lane (#949) runs ALONE via its own vitest config: those tests
          # hold 10k-50k live documents, and sharing the worker pool with the ~76
          # functional files starved them on 2-core runners. `--if-present` keeps
          # this step a no-op until the suite lands, so the two PRs can merge in
          # either order.
          pnpm --filter @wcpos/sync-engine run --if-present test:perf

      - name: "\U0001F4CA Generate test failure summary"
        if: always()
        run: |
          # Collect test failures from JSON results
          has_failures=false
          failure_md=""

          for pkg in core components database hooks utils order-math resizable-panels query main; do
            if [ "$pkg" = "main" ]; then
              file="apps/main/test-results.json"
            else
              file="packages/$pkg/test-results.json"
            fi
            if [ -f "$file" ]; then
              pkg_failures=$(node -e "
                const r = require('./$file');
                const failed = r.testResults.filter(t => t.status === 'failed');
                for (const f of failed) {
                  for (const a of (f.assertionResults || []).filter(a => a.status === 'failed')) {
                    const title = [...a.ancestorTitles, a.title].join(' > ');
                    const msg = (a.failureMessages || []).join('\n').substring(0, 500);
                    console.log('### \`@wcpos/$pkg\`: ' + title);
                    console.log('\`\`\`');
                    console.log(msg);
                    console.log('\`\`\`');
                    console.log('');
                  }
                }
              " 2>/dev/null || true)

              if [ -n "$pkg_failures" ]; then
                has_failures=true
                failure_md="$failure_md$pkg_failures"
              fi
            fi
          done

          for tap_entry in "plugins:apps/main/plugin-test-results.tap" "metro:apps/main/metro-test-results.tap"; do
            tap_label="${tap_entry%%:*}"; tap_file="${tap_entry#*:}"
            if [ -f "$tap_file" ] && grep -q '^not ok ' "$tap_file"; then
              tap_failures=$(printf '\n\n### `@wcpos/main %s`\n```text\n' "$tap_label"; sed -n '/^not ok /,$p' "$tap_file" | head -c 2000; printf '\n```\n')
              has_failures=true
              failure_md="$failure_md$tap_failures"
            fi
          done

          if [ "$has_failures" = true ]; then
            echo "## ❌ Test Failures" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$failure_md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Save for PR comment step
            mkdir -p /tmp/test-summary
            echo "$failure_md" > /tmp/test-summary/failures.md
          fi

      - name: "\U0001F512 Coverage ratchet check"
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const baseline = JSON.parse(fs.readFileSync('coverage-baseline.json', 'utf8'));
            const packages = Object.keys(baseline.packages);
            const selected = new Set(process.env.UNIT_PACKAGES.split(','));
            const metrics = ['statements', 'branches', 'functions', 'lines'];
            let failed = false;

            for (const pkg of packages) {
              if (!selected.has('all') && !selected.has(pkg)) continue;
              const summaryPath = 'packages/' + pkg + '/coverage/coverage-summary.json';
              if (!fs.existsSync(summaryPath)) {
                console.error('@wcpos/' + pkg + ': coverage summary missing at ' + summaryPath);
                failed = true;
                continue;
              }
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const current = summary.total;
              const base = baseline.packages[pkg];

              for (const metric of metrics) {
                const currentPct = current[metric]?.pct ?? 0;
                const basePct = base[metric] ?? 0;
                if (currentPct < basePct) {
                  console.error('@wcpos/' + pkg + ': ' + metric + ' dropped from ' + basePct + '% to ' + currentPct + '%');
                  failed = true;
                }
              }
            }

            if (failed) {
              console.error('');
              console.error('Coverage ratchet failed — coverage must not decrease.');
              console.error('If you removed code/tests intentionally, update coverage-baseline.json.');
              process.exit(1);
            } else {
              console.log('Coverage ratchet passed.');
            }
          "

      - name: "\U0001F4CA Generate coverage summary"
        if: always()
        run: |
          echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Statements | Branches | Functions | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY

          for pkg in core components database hooks utils order-math resizable-panels query sync-core sync-engine; do
            file="packages/$pkg/coverage/coverage-summary.json"
            if [ -f "$file" ]; then
              statements=$(jq -r '.total.statements.pct // 0' "$file")
              branches=$(jq -r '.total.branches.pct // 0' "$file")
              functions=$(jq -r '.total.functions.pct // 0' "$file")
              lines=$(jq -r '.total.lines.pct // 0' "$file")
              echo "| @wcpos/$pkg | ${statements}% | ${branches}% | ${functions}% | ${lines}% |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| @wcpos/$pkg | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: "\U0001F4E4 Upload coverage reports"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 7

      - name: "\U0001F4AC Comment coverage on PR"
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');

            const packages = ['core', 'components', 'database', 'hooks', 'utils', 'order-math', 'resizable-panels', 'query', 'sync-core', 'sync-engine'];
            let coverageRows = [];
            let totalStatements = 0;
            let totalBranches = 0;
            let totalFunctions = 0;
            let totalLines = 0;
            let packageCount = 0;

            const getEmoji = (pct) => {
              if (pct === null || pct === undefined || pct === '-') return '⚪';
              return pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
            };

            for (const pkg of packages) {
              const coveragePath = `packages/${pkg}/coverage/coverage-summary.json`;
              try {
                if (fs.existsSync(coveragePath)) {
                  const data = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                  const total = data.total || {};
                  const statements = total.statements?.pct ?? 0;
                  const branches = total.branches?.pct ?? 0;
                  const functions = total.functions?.pct ?? 0;
                  const lines = total.lines?.pct ?? 0;
                  
                  coverageRows.push([
                    '|',
                    `@wcpos/${pkg}`,
                    '|',
                    `${getEmoji(statements)} ${statements.toFixed(1)}%`,
                    '|',
                    `${getEmoji(branches)} ${branches.toFixed(1)}%`,
                    '|',
                    `${getEmoji(functions)} ${functions.toFixed(1)}%`,
                    '|',
                    `${getEmoji(lines)} ${lines.toFixed(1)}%`,
                    '|'
                  ].join(' '));
                  
                  totalStatements += statements;
                  totalBranches += branches;
                  totalFunctions += functions;
                  totalLines += lines;
                  packageCount++;
                } else {
                  coverageRows.push(`| @wcpos/${pkg} | ⚪ No tests | ⚪ - | ⚪ - | ⚪ - |`);
                }
              } catch (e) {
                console.log(`Error reading coverage for ${pkg}: ${e.message}`);
                coverageRows.push(`| @wcpos/${pkg} | ⚪ Error | ⚪ - | ⚪ - | ⚪ - |`);
              }
            }

            // Calculate averages
            let avgRow = '| **Average** | ⚪ - | ⚪ - | ⚪ - | ⚪ - |';
            if (packageCount > 0) {
              const avgStatements = (totalStatements / packageCount).toFixed(1);
              const avgBranches = (totalBranches / packageCount).toFixed(1);
              const avgFunctions = (totalFunctions / packageCount).toFixed(1);
              const avgLines = (totalLines / packageCount).toFixed(1);
              avgRow = [
                '|',
                '**Average**',
                '|',
                `${getEmoji(avgStatements)} **${avgStatements}%**`,
                '|',
                `${getEmoji(avgBranches)} **${avgBranches}%**`,
                '|',
                `${getEmoji(avgFunctions)} **${avgFunctions}%**`,
                '|',
                `${getEmoji(avgLines)} **${avgLines}%**`,
                '|'
              ].join(' ');
            }

            const tableHeader = '| Package | Statements | Branches | Functions | Lines |\n|---------|------------|----------|-----------|-------|';
            const legend = '<details>\n<summary>Coverage Legend</summary>\n\n- 🟢 Good (≥80%)\n- 🟡 Moderate (60-79%)\n- 🔴 Needs improvement (<60%)\n- ⚪ No coverage data\n\n</details>';

            // Read test failure summary if it exists
            let failureSection = '';
            const failurePath = '/tmp/test-summary/failures.md';
            try {
              if (fs.existsSync(failurePath)) {
                const failures = fs.readFileSync(failurePath, 'utf8').trim();
                if (failures) {
                  failureSection = '## ❌ Test Failures\n\n' + failures + '\n\n';
                }
              }
            } catch (e) {
              console.log(`Error reading failures: ${e.message}`);
            }

            const body = [
              failureSection,
              '## 📊 Test Coverage Report',
              '',
              tableHeader,
              coverageRows.join('\n'),
              avgRow,
              '',
              legend,
              '',
              '---',
              `<sub>🤖 Updated by GitHub Actions • [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>`
            ].filter(Boolean).join('\n');

            // Find and update existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Test Coverage Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: 🔒 Dependency guards (SDK alignment + duplicates + AAR compileSdk)
        # Local-only until 2026-08-18 — dependabot PR #1298 carried 15 Expo SDK
        # misalignments and a vulnerable transitive tree with green CI because
        # these never ran here.
        run: |
          node scripts/check-expo-alignment.mjs
          node scripts/check-dep-duplicates.mjs
          node scripts/check-android-aar-compile-sdk.mjs

  # The gallery shoot: ~3,800 cells (3,780 on 2026-10-22), one Playwright test per
  # component, split over 3 shards x 4 workers (playwright.gallery.config.ts). One
  # serial worker took 9.5 min for the whole set; a shard shoots a third of the
  # components four at a time. Each shard uploads its shot lists, and the orphan check
  # (roadmap#355) runs once over the union of all three.
  gallery-shoot:
    name: Gallery shoot (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.gallery == 'true' &&
      (github.event.pull_request.draft == false || github.event_name == 'push') &&
      !(contains(github.event.pull_request.labels.*.name, 'gallery:update-baselines') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - &gallery-checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The update job must shoot the PR head, whose baselines gallery-commit pushes
          # back to the branch. The read-only shoot takes the default merge ref, so a PR
          # opened before the gallery landed on its base is still shot with the gallery
          # (on 2026-09-18 #2176's head predated it and the compare step had no
          # config to run).
          ref: ${{ github.job == 'gallery-update' && github.event.pull_request.head.sha || '' }}
          submodules: false
      - &gallery-setup
        name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}
          skip-install-scripts: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
      - &gallery-chromium
        name: Install Chromium
        working-directory: apps/main
        run: npx playwright install --with-deps chromium
      - &gallery-build
        name: Build gallery
        working-directory: apps/main
        run: EXPO_PUBLIC_WCPOS_GALLERY=1 npx expo export --platform web --output-dir ./gallery-build
      - name: Compare baselines
        working-directory: apps/main
        run: npx playwright test -c playwright.gallery.config.ts --shard=${{ matrix.shard }}/3
      - name: Upload shot lists
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gallery-shots-${{ matrix.shard }}
          path: apps/main/gallery/.shots/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - &gallery-report
        name: Upload gallery report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gallery-report-${{ matrix.shard }}
          path: apps/main/playwright-report/
          retention-days: 7

  # A compare shard sees only its own components, so the orphan check runs here, over
  # every shard's shot list against the checked-out baselines (roadmap#355).
  gallery-orphans:
    name: Gallery orphans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gallery-shoot
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: apps/main/gallery
          submodules: false
      - name: Download shot lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gallery-shots-*
          path: apps/main/gallery/.shots
          merge-multiple: true
      - name: Check orphaned baselines
        run: node apps/main/gallery/check-orphans.mjs

  # Shoots the same 3 shards with --update-snapshots and uploads what each shot;
  # gallery-commit merges and pushes them. Read-only: no shard writes to the branch.
  gallery-update:
    name: Gallery update (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Shoots twice (update, then compare), so twice a shard's budget.
    timeout-minutes: 25
    needs: changes
    if: >-
      needs.changes.outputs.gallery == 'true' && github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'gallery:update-baselines') &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *gallery-checkout
      - *gallery-setup
      - *gallery-chromium
      - *gallery-build
      - name: Update baselines
        working-directory: apps/main
        run: npx playwright test -c playwright.gallery.config.ts --update-snapshots --shard=${{ matrix.shard }}/3
      - name: Compare the fresh baselines
        # Update mode's contract (roadmap#355): a second shoot must reproduce what the first
        # wrote, or the baselines are unstable and must not be committed.
        working-directory: apps/main
        run: npx playwright test -c playwright.gallery.config.ts --shard=${{ matrix.shard }}/3
      - name: Stage this shard's baselines
        # Only the PNGs this shard shot: every shard's checkout holds the whole set, so
        # uploading the directory would let one shard's untouched copies overwrite
        # another shard's updates when gallery-commit merges the three.
        working-directory: apps/main/gallery
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-baselines"
          jq -r '.[]' .shots/*.json | while IFS= read -r name; do
            cp -- "gallery.spec.ts-snapshots/$name" "$RUNNER_TEMP/gallery-baselines/"
          done
      - name: Upload baselines
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gallery-baselines-${{ matrix.shard }}
          path: ${{ runner.temp }}/gallery-baselines/
          if-no-files-found: error
          retention-days: 1
      - name: Upload shot lists
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gallery-shots-${{ matrix.shard }}
          path: apps/main/gallery/.shots/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - *gallery-report

  # Permissions cannot be conditional: only the label-selected commit job receives write.
  # Orphans fail it before anything is committed: the three shards shoot disjoint
  # components, so their union must cover every PNG on disk.
  gallery-commit:
    name: Gallery (commit baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, gallery-update]
    if: >-
      needs.changes.outputs.gallery == 'true' && github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'gallery:update-baselines') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - name: Download baselines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gallery-baselines-*
          path: apps/main/gallery/gallery.spec.ts-snapshots
          merge-multiple: true
      - name: Download shot lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gallery-shots-*
          path: apps/main/gallery/.shots
          merge-multiple: true
      - name: Check orphaned baselines
        run: node apps/main/gallery/check-orphans.mjs
      - name: Commit baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/main/gallery/*-snapshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "test: update gallery baselines (run $GITHUB_RUN_ID)"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

  # The one "Gallery" check aggregates the mutually exclusive lanes above (compare:
  # shoot + orphans; update: update + commit). Skipped when both lanes were skipped
  # (path filter or draft), which the gate counts as a pass. A cancelled (superseded)
  # run reports no Gallery check, so cannot leave stale red.
  gallery:
    name: Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gallery-shoot, gallery-orphans, gallery-update, gallery-commit]
    if: >-
      !cancelled() &&
      (needs.gallery-shoot.result != 'skipped' || needs.gallery-update.result != 'skipped')
    steps:
      - name: Aggregate
        env:
          SHOOT: ${{ needs.gallery-shoot.result }}
          ORPHANS: ${{ needs.gallery-orphans.result }}
          UPDATE: ${{ needs.gallery-update.result }}
          COMMIT: ${{ needs.gallery-commit.result }}
        run: |
          echo "shoot=$SHOOT orphans=$ORPHANS update=$UPDATE commit=$COMMIT"
          for r in "$SHOOT" "$ORPHANS" "$UPDATE" "$COMMIT"; do
            case "$r" in success|skipped) ;; *) echo "::error::gallery job result: $r"; exit 1;; esac
          done
          # A passed shoot is only done once its orphan check (or its commit) has run.
          if [ "$SHOOT" = success ] && [ "$ORPHANS" != success ]; then echo "::error::gallery orphan check did not run"; exit 1; fi
          if [ "$UPDATE" = success ] && [ "$COMMIT" != success ]; then echo "::error::gallery baseline commit did not run"; exit 1; fi
