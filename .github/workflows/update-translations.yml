name: Update Translation Version

on:
  repository_dispatch:
    types: [translation-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}

      - name: Update translation version
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # A release is a CalVer tag; refuse an empty or branch-ref payload rather than commit it.
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]] || { echo "Not a CalVer version: '$VERSION'"; exit 1; }
          echo "Updating translation version to $VERSION"
          FILE=packages/core/src/contexts/translations/translation-version.json
          jq --tab --arg v "$VERSION" '.version = $v' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

      - name: Create PR
        env:
          VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/contexts/translations/translation-version.json
          if ! git diff --staged --quiet; then
            BRANCH="chore/translation-version-${VERSION}"
            git checkout -b "$BRANCH"
            git commit -m "chore: update translation version to ${VERSION}"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: update translation version to ${VERSION}" \
              --body "Automated PR to update translation version to ${VERSION}." \
              --base main
          fi
