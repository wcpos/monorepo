name: Update Translation Version

on:
  repository_dispatch:
    types: [translation-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}

      - name: Update translation version
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          echo "Updating translation version to $VERSION"
          sed -i "s/TRANSLATION_VERSION = '.*'/TRANSLATION_VERSION = '${VERSION}'/" packages/core/src/contexts/translations/rxdb-backend.ts

      - name: Create PR
        env:
          VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/contexts/translations/rxdb-backend.ts
          if ! git diff --staged --quiet; then
            BRANCH="chore/translation-version-${VERSION}"
            git checkout -b "$BRANCH"
            git commit -m "chore: update translation version to ${VERSION}"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: update translation version to ${VERSION}" \
              --body "Automated PR to update translation version to ${VERSION}." \
              --base main
          fi
