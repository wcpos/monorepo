name: Merge Gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  merge-gate:
    name: '✅ Merge Gate'
    runs-on: ubuntu-latest
    steps:
      # Trusted-base pattern (mirrors wcpos/woocommerce-pos): check out the
      # DEFAULT branch's scripts, never the PR's — a PR must not be able to
      # edit the policy that judges it. Fix bots push to PR branches by
      # design, so the gate cannot live in a PR-editable workflow.
      - name: Checkout trusted base scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # "🎭 E2E Tests" is deploy.yml's `e2e-gate` aggregator job, not the
          # per-shard "🎭 E2E Tests (n/6)" checks — the gate script matches
          # check names exactly. deploy.yml always runs on pull_request now, so
          # this check is always reported (SKIPPED when the paths filter or the
          # draft guard legitimately skips the deploy).
          # "📱 Native E2E" (e2e-native.yml's aggregator) runs on every PR that
          # implicates native and is DELIBERATELY not required yet. The ruling
          # (#1644) is that it blocks; the bar before it does is five consecutive
          # green runs per platform, and today `main` itself is red on it
          # (#1661 tablet SIGSEGV; the phone's 60 s product-tile wait vs the
          # cold-emulator catalog sync). Add it here when the bar is met.
          MERGE_GATE_REQUIRED_CHECKS: 🧹 Lint|🧪 Unit Tests|🎭 E2E Tests
          # 140 × 30s ≈ 70 min: covers deploy (~7 min) plus the slower of a
          # web shard (~12 min) and a native run (~32 min), with one retry.
          MERGE_GATE_MAX_ATTEMPTS: '140'
        run: .github/scripts/merge-gate.sh
