name: Cancel native E2E runs of a closed PR

# Latest head wins (owner ruling 2026-09-01) has a corollary: a PR that has
# been merged or closed has no head left to test. Its in-flight e2e-native
# run still holds the FIFO device turnstile for the length of a suite —
# PR #1763 merged at 15:31Z on 2026-09-02 and its run kept both phone slots
# until 17:15Z while the next PR's jobs sat in "Wait for the device slot"
# against the 150-minute budget. The pull_request concurrency group cannot
# see a close (no new run is created), so this cancels explicitly.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel-native-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const prNumber = pull.number;
            const closedAt = Date.parse(pull.closed_at);
            // A run's `pull_requests` lists OPEN pull requests only, so a closed PR
            // never appears there (Codex review on #1770). Identify the PR's runs by
            // head branch + head SHA instead — the same identity e2e-native.yml ran.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'e2e-native.yml',
              event: 'pull_request',
              branch: pull.head.ref,
              per_page: 20,
            });
            // Closed-then-reopened before this job got a runner: the reopen has
            // started a fresh run that must live. Re-read the PR and skip everything
            // if it is open again; otherwise only touch runs created before the close.
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (current.state !== 'closed') {
              core.info(`PR #${prNumber} is ${current.state} again — leaving its runs alone`);
              return;
            }
            // Every active run of this PR's head branch from this PR's head repo, whatever
            // its SHA: e2e-native.yml gives attempt>1 reruns a run-specific concurrency
            // group, so a rerun of an EARLIER head can outlive later pushes and still hold
            // the device turnstile at close (Codex review on #1772).
            const headRepo = pull.head.repo && pull.head.repo.full_name;
            const active = data.workflow_runs.filter(
              (run) =>
                ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status) &&
                run.head_branch === pull.head.ref &&
                (!headRepo || !run.head_repository || run.head_repository.full_name === headRepo) &&
                Date.parse(run.created_at) <= closedAt
            );
            let cancelled = 0;
            for (const run of active) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled += 1;
                core.info(`cancelled e2e-native run ${run.id} (${run.head_sha.slice(0, 9)}) — PR #${prNumber} closed`);
              } catch (error) {
                // 409 only: the run reached a terminal state between the list and the
                // cancel. Anything else (403, 429, 5xx) leaves the run holding the
                // turnstile and must fail this job loudly, not shrink a count.
                if (error.status !== 409) throw error;
                core.info(`run ${run.id}: already finished — continuing`);
              }
            }
            core.info(`PR #${prNumber}: ${cancelled} of ${active.length} active e2e-native run(s) cancelled`);
