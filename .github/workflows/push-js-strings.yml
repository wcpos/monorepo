name: Push JS Strings to Translations

on:
  push:
    branches: [main, next]
    paths:
      - 'packages/core/src/contexts/translations/locales/en/core.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Push even if strings have not changed'
        required: false
        default: false
        type: boolean

jobs:
  push-and-dispatch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve lane
        id: lane
        run: |
          lane="$GITHUB_REF_NAME"
          case "$lane" in
            main) ref=translations-source ;;
            next) ref=translations-source-next ;;
            *) echo "::error::Translations are sent only from main or next (got $lane)"; exit 1 ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Push to translations-source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Collect the English locale file (electron has its own repo/workflow)
          mkdir -p /tmp/translations-out
          cp packages/core/src/contexts/translations/locales/en/core.json /tmp/translations-out/

          git checkout --orphan "${{ steps.lane.outputs.ref }}"
          git rm -rf .
          cp /tmp/translations-out/*.json .
          git add .
          git commit -m "translation source strings from ${{ github.sha }}"
          git push -f origin "${{ steps.lane.outputs.ref }}"

          # Restore original checkout so composite action post-cleanup can find action.yml
          git checkout ${{ github.sha }} -- .github

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: translations

      - name: Notify translations repo
        run: |
          gh api repos/wcpos/translations/dispatches \
            -f event_type=update-js-strings \
            -f "client_payload[repo_name]=monorepo" \
            -f "client_payload[ref]=${{ steps.lane.outputs.ref }}" \
            -f "client_payload[lane]=${{ steps.lane.outputs.lane }}" \
            -f "client_payload[force]=${{ inputs.force || 'false' }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
