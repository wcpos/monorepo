# Nightly native E2E (Maestro) — spec: wayfinder wcpos/monorepo#688.
# Runs the P0 suite on iOS simulators (macOS runners) and Android emulators
# (Linux/KVM runners) against SHA-keyed cached e2e-test EAS builds.
# Budget guardrail: $150/mo ceiling (~40 macOS-min + ~40 Linux-min per night).
#
# Tests `main`. It tested `next` until 2026-08-27 — a leftover from when the
# Maestro suite was next-lane — but everything ships from `main` (lanes
# converged 2026-08-15), so the nightly was exercising a branch nobody ships
# and could never catch regressions on shipping code (e.g. the iOS
# variation-popover crash fixed on main, #1574). Same flip as
# e2e-cold-start.yml on 2026-08-22.
name: E2E Native

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  EXPO_USE_FAST_RESOLVER: true
  E2E_STORE_URL: https://dev-pro.wcpos.com

permissions:
  contents: read

jobs:
  build:
    name: 📦 Resolve e2e-test builds
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      variable_product_id: ${{ steps.seed.outputs.variable_product_id }}
    steps:
      - name: 🏗 Setup repository (main lane)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          submodules: false

      # workflow_dispatch accepts an arbitrary ref, and the jobs below run the
      # checked-out seed script with write-capable store credentials. Refuse
      # anything that is not already on main.
      - name: 🔒 Validate trusted ref
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::ref must resolve to a commit on the main branch"
            exit 1
          fi

      # Pin the exact revision under test: the cache key and both test jobs
      # use this SHA, so build and tests always agree on one revision, and a
      # cached build is only reused when the code is truly identical (e2e
      # builds embed the JS bundle — keying on the native fingerprint alone
      # would test stale JS after JS-only changes). It also means the test
      # jobs check out the validated revision, never a mutable branch name.
      - name: 🔑 Resolve revision under test
        id: resolve
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Testing main @ $SHA"

      # Seed ONCE, before the matrix fans out: the four test jobs share one
      # store, and concurrent seeds could each miss the same variation and
      # create it twice — the popover then never resolves to exactly one
      # match. The workflow-level concurrency group serializes whole runs, so
      # this is the only writer. Exports the seeded variable product's id so
      # the flows can target it by its id-bearing testID.
      # The E2E_WC_CONSUMER_KEY/SECRET this step originally referenced were
      # never provisioned (verified 2026-08-27: `gh secret list` has no such
      # secrets), so the seed had silently run reachability-only since the
      # workflow landed. The product-writer identity IS provisioned — the same
      # standing shop_manager pair the web E2E uses.
      - name: 🌱 Seed test store
        id: seed
        env:
          E2E_PRODUCT_WRITER_USER: ${{ secrets.E2E_PRODUCT_WRITER_USER }}
          E2E_PRODUCT_WRITER_PASS: ${{ secrets.E2E_PRODUCT_WRITER_PASS }}
        run: node scripts/e2e-native-seed.mjs

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      # EAS artifacts expire after ~2 weeks (observed in #696), so finished
      # builds are cached on the GHA side. Nights where main hasn't moved hit
      # the cache and cost no EAS build.
      - name: ♻️ Restore cached builds
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: e2e-builds
          key: e2e-native-build-${{ steps.resolve.outputs.sha }}

      - name: 🛠 Build e2e-test profile on EAS (revision changed)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/main
        run: |
          mkdir -p ../../e2e-builds
          eas build --profile e2e-test --platform all --non-interactive --wait --json > /tmp/builds.json
          IOS_URL=$(jq -r '.[] | select(.platform=="IOS") | .artifacts.buildUrl' /tmp/builds.json)
          ANDROID_URL=$(jq -r '.[] | select(.platform=="ANDROID") | .artifacts.buildUrl' /tmp/builds.json)
          curl -fsSL "$IOS_URL" -o ../../e2e-builds/wcpos-e2e-ios.tar.gz
          curl -fsSL "$ANDROID_URL" -o ../../e2e-builds/wcpos-e2e-android.apk

      - name: ⬆️ Share builds with test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-builds
          path: e2e-builds
          retention-days: 3

  android:
    name: 🤖 Android (${{ matrix.device.name }})
    needs: build
    runs-on: ubuntu-latest
    # 100, not 60: the app's ONE-TIME initial catalog sync (~40 min on these
    # 2-vCPU swiftshader emulators) slows every interaction in whichever flow
    # it overlaps — a roving 20-40 min flow that still PASSES (run 33120985474:
    # flow 06 41m; run 33131212326: flows 04+05 52m together, then cancelled at
    # 60:00 with every completed flow green). Once the sync finishes, flows
    # take ~1 min. Budget = worst observed sync window + full suite + headroom.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, profile: pixel_6 }
          - { name: tablet, profile: pixel_tablet }
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.sha }}
          submodules: false

      - name: ⬇️ Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-builds
          path: e2e-builds

      - name: 🧰 Install Maestro
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b

      - name: 🔓 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📱 Run Maestro suite on emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          # google_apis images boot reliably on GH runners where the default
          # (aosp_atd at this API level) intermittently dies during GPU init —
          # every nightly since the 2026-08-06 promotion failed with
          # "Unable to connect to adb daemon on port: 5037" and
          # "Failed to find ColorBuffer" before Maestro ever ran.
          target: google_apis
          profile: ${{ matrix.device.profile }}
          arch: x86_64
          disable-animations: true
          # swiftshader_indirect sidesteps the host-GPU ColorBuffer failures;
          # no-snapshot avoids stale snapshot restores on ephemeral runners.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            # Cold first-boot emulators on busy runners throw system-process ANR
            # dialogs ("Pixel Launcher isn't responding", googlesdksetup — both
            # Android jobs in run 33127572216 died at flow 01 behind one). The
            # dialog window sits above the app, so every assert times out.
            # hide_error_dialogs suppresses ANR/crash dialogs system-wide.
            adb shell settings put global hide_error_dialogs 1
            adb install e2e-builds/wcpos-e2e-android.apk
            maestro test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" apps/main/.maestro
        env:
          # The Maestro Android driver installs its two APKs and waits for the
          # instrumentation channel; first-boot emulators on shared runners
          # regularly exceed the 15s default.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
          # Pins flow 07 to the seeded product's id-bearing testID; the `.*`
          # fallback (also the flow's own default) matches any variable tile.
          VARIABLE_PRODUCT_ID: ${{ needs.build.outputs.variable_product_id }}

      - name: ⬆️ Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-${{ matrix.device.name }}
          path: ~/.maestro/tests
          retention-days: 7

  ios:
    name: 🍎 iOS (${{ matrix.device.name }})
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, simulator: iPhone 16 Pro }
          - { name: tablet, simulator: iPad Pro 11-inch (M4) }
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.sha }}
          submodules: false

      - name: ⬇️ Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-builds
          path: e2e-builds

      - name: 🧰 Install Maestro
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b

      - name: 📱 Boot simulator and install app
        run: |
          # Diagnostic: which iOS runtimes this runner image offers — kept in
          # the log so the runtime pin below can be revisited from evidence.
          xcrun simctl list runtimes
          # PINNED to iOS 18.6: on the image-default iOS 26.2 runtime the
          # Maestro 2.6.1 XCUITest driver dies mid-flow after ~4 minutes with
          # no recovery (runs 33074068139 and 33081118544 both lost the driver
          # port mid-run; maestro#3318 tracks the 26.x instability). The
          # nightly's job is catching app regressions, not OS-compat testing —
          # revisit the pin when Maestro's 26.x driver stabilizes.
          UDID=$(xcrun simctl create "e2e-${{ matrix.device.name }}" "${{ matrix.device.simulator }}" com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p /tmp/e2e-app && tar -xzf e2e-builds/wcpos-e2e-ios.tar.gz -C /tmp/e2e-app
          APP_PATH=$(find /tmp/e2e-app -maxdepth 2 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "MAESTRO_UDID=$UDID" >> "$GITHUB_ENV"

      # One `maestro test` per flow, NOT batch mode: on iOS 26.x the XCUITest
      # driver socket can die mid-suite with no recovery (maestro#3318; both
      # simulators in run 33074068139 lost the driver ~4 min in). Per-flow
      # invocation is the issue's confirmed workaround — each flow gets a
      # fresh driver, and the app's on-device state still carries across
      # invocations, which is all the stateful suite needs. Filename order
      # (01…08) matches config.yaml's flowsOrder; the first failure aborts,
      # matching continueOnFailure: false.
      - name: 📱 Run Maestro suite on simulator
        run: |
          # Retry ONLY the "iOS driver not ready in time" startup flake
          # (monorepo#1614 defect 3: one iPad first-boot occurrence on 18.6).
          # That failure happens before the flow executes a single command, so
          # a retry cannot double-apply state; any other failure is a real
          # test failure and must not run twice.
          run_flow() {
            local flow="$1" log
            log=$(mktemp)
            if maestro --udid "$MAESTRO_UDID" test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" "$flow" 2>&1 | tee "$log"; then
              return 0
            fi
            if grep -q "driver not ready in time" "$log"; then
              echo "↻ driver startup flake — retrying ${flow} once"
              maestro --udid "$MAESTRO_UDID" test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" "$flow"
              return
            fi
            return 1
          }
          for flow in apps/main/.maestro/flows/*.yml; do
            echo "▶ ${flow}"
            run_flow "$flow" || exit 1
          done
        env:
          # Maestro's XCUITest driver compiles and installs its runner on
          # first launch; macOS runners routinely exceed the 15s default —
          # every nightly since the 2026-08-06 promotion died here with
          # "iOS driver not ready in time" before running a single flow.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          # Pins flow 07 to the seeded product's id-bearing testID; the `.*`
          # fallback (also the flow's own default) matches any variable tile.
          VARIABLE_PRODUCT_ID: ${{ needs.build.outputs.variable_product_id }}

      - name: ⬆️ Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-${{ matrix.device.name }}
          path: ~/.maestro/tests
          retention-days: 7
