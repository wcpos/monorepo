# Native E2E (Maestro) on every merge to main — spec: wayfinder wcpos/monorepo#688.
# Runs the P0 suite on iOS simulators (macOS runners) and Android emulators
# (Linux/KVM runners).
#
# ARCHITECTURE (owner ruling 2026-08-28: "the dev client might not change for
# the entire month — build once, update the JavaScript"): the suite drives the
# `development`-profile DEV CLIENT — the same build developers use — and the
# JS under test is served to it by Metro running on the test runner
# (`expo start --no-dev --minify`), bundling the checked-out revision. The
# native shell is built on EAS only when `npx @expo/fingerprint` moves, i.e.
# when native deps / config / native code actually change (historically once
# or twice a month), and is cached on the GHA side keyed by that fingerprint.
# JS-only merges — almost every merge — build nothing and cost $0.
#
# Costs, for the rare build: $2 per iOS, $1 per Android on Starter usage rates;
# the monthly allowance (15 + 15 builds — the Free plan's hard limit, and
# exactly what Starter's $45 credit buys) is shared with RELEASE builds
# (`build.yml`), which is why this workflow spends only on fingerprint change
# and why a dispatch never spends without saying so (`build` input below).
#
# Tests `main`. It tested `next` until 2026-08-27 — a leftover from when the
# Maestro suite was next-lane — but everything ships from `main` (lanes
# converged 2026-08-15), so the nightly was exercising a branch nobody ships
# and could never catch regressions on shipping code (e.g. the iOS
# variation-popover crash fixed on main, #1574). Same flip as
# e2e-cold-start.yml on 2026-08-22.
name: E2E Native

on:
  # Every merge to main, not a nightly (owner ruling 2026-08-28: tests run
  # after every PR; the 03:00 cron is gone). Merged code is validated code,
  # so the write-capable seed credentials are legitimate here — the reason
  # this suite must never run per-PR on unmerged branches. Runs are $0 under
  # the fingerprint cache except when native genuinely changed. Merge bursts
  # self-collapse: the concurrency group below holds one running + one
  # pending run, and a newer push evicts the older pending one, so a busy
  # day converges on testing the tip.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        type: string
        default: main
      # A dispatch that finds no cached dev client for the current native
      # fingerprint refuses to spend rather than silently billing an EAS
      # build (the nine ad-hoc dispatches of 2026-08-27/28 bought nine build
      # pairs in sixteen hours; under this architecture all nine would have
      # been cache hits, but the guard stays for the day a fingerprint change
      # and a debugging session coincide). Trunk (push) runs are exempt: buying the
      # rare fingerprint-change build is their job.
      build:
        description: 'Spend an EAS build if no dev client is cached for this fingerprint (iOS $2, Android $1)'
        type: boolean
        default: false
      # A fingerprint change rarely lands for both platforms' sakes; verifying
      # an Android-only native change should cost $1, not $3. The cache key
      # carries the selection so a single-platform build can never satisfy a
      # later `all` run from cache.
      platform:
        description: Platform(s) to build and test
        type: choice
        default: all
        options:
          - all
          - ios
          - android

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  EXPO_USE_FAST_RESOLVER: true
  E2E_STORE_URL: https://dev-pro.wcpos.com

permissions:
  contents: read

jobs:
  build:
    name: 📦 Resolve dev-client build
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      platform: ${{ steps.resolve.outputs.platform }}
      variable_product_id: ${{ steps.seed.outputs.variable_product_id }}
    steps:
      - name: 🏗 Setup repository (main lane)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          submodules: false

      # workflow_dispatch accepts an arbitrary ref, and the jobs below run the
      # checked-out seed script with write-capable store credentials. Refuse
      # anything that is not already on main.
      - name: 🔒 Validate trusted ref
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::ref must resolve to a commit on the main branch"
            exit 1
          fi

      # Pin the exact revision under test: both test jobs check out this SHA
      # — never a mutable branch name — and Metro on each test runner bundles
      # THAT checkout, so the JS under test is the tested revision by
      # construction. The dev-client binary is deliberately NOT pinned to the
      # SHA: it carries no JS, so it is keyed on the native fingerprint below.
      - name: 🔑 Resolve revision under test
        id: resolve
        env:
          # Through env, never inline `${{ }}` in the script: an API dispatch
          # is not bound to the choice options the UI shows, and inline
          # interpolation of an attacker-influenced value into a run script is
          # the classic Actions injection. The allowlist below is the gate.
          RAW_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          case "$RAW_PLATFORM" in
            all|ios|android) PLATFORM="$RAW_PLATFORM" ;;
            *) echo "::error::platform must be all, ios or android (got: $RAW_PLATFORM)"; exit 1 ;;
          esac
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "Testing main @ $SHA (platform: $PLATFORM)"

      # The fingerprint resolves the app config (TypeScript, with imports), so
      # dependencies must be installed first — which is why setup runs before
      # the cache probe. A refused dispatch therefore costs a few minutes of
      # runner time; acceptable, because refusals are rare and the fingerprint
      # is what makes almost every run bill nothing at all.
      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      # `@expo/fingerprint` is Expo's own answer to "does this need a new
      # native build?": it hashes the installed native modules, config
      # plugins, app config and EAS profile — and deliberately ignores app
      # JS/TS. Verified locally (2026-08-28): deterministic across runs; a
      # core-screen edit does not move it; editing an installed native
      # module's content does. JS changes ride in via Metro, so a stale-JS
      # cache hit is impossible by construction.
      - name: 🔬 Compute native fingerprint
        id: fingerprint
        working-directory: apps/main
        env:
          # The fingerprint MUST resolve the SAME app config the build it
          # gates will resolve. app.config.ts gates plugins on
          # EAS_BUILD_PROFILE (unset → 'production'), so an unset profile made
          # profile-conditional plugins invisible to the hash: the
          # with-user-ca-trust cleartext fix changed the dev client's native
          # config, the fingerprint did not move, run 33162907004 cache-hit
          # the OLD binary, and Android failed on the very bug the merge had
          # fixed. Any profile-conditional native input has this blind spot
          # without the env pin.
          EAS_BUILD_PROFILE: development
        run: |
          FP=$(npx @expo/fingerprint . | jq -r '.hash')
          [ -n "$FP" ] && [ "$FP" != "null" ] || { echo "::error::fingerprint computation failed"; exit 1; }
          # The key also carries the platform selection so a single-platform
          # build can never satisfy a later `all` run from cache.
          PLATFORM="${{ steps.resolve.outputs.platform }}"
          if [ "$PLATFORM" = "all" ]; then
            echo "cache_key=e2e-native-devclient-$FP" >> "$GITHUB_OUTPUT"
          else
            echo "cache_key=e2e-native-devclient-$FP-$PLATFORM" >> "$GITHUB_OUTPUT"
          fi
          echo "Native fingerprint: $FP"

      # EAS artifacts expire after ~2 weeks (observed in #696), so finished
      # builds are cached on the GHA side. GHA evicts caches unused for 7
      # days, but every merge touches this key, keeping it warm
      # for as long as the fingerprint holds.
      - name: ♻️ Restore cached builds
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: e2e-builds
          key: ${{ steps.fingerprint.outputs.cache_key }}

      # A dispatch does not get to spend money by accident. Reaching here on a
      # cache miss means no dev client exists for this native fingerprint and
      # platform selection, so continuing would bill an EAS build; a dispatch
      # that did not ask for one stops instead. Trunk (push) runs are exempt — buying
      # the rare fingerprint-change build is its job.
      - name: 💸 Refuse an unrequested EAS build
        if: >-
          steps.cache.outputs.cache-hit != 'true'
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.build != 'true'
        env:
          PLATFORM: ${{ steps.resolve.outputs.platform }}
          CACHE_KEY: ${{ steps.fingerprint.outputs.cache_key }}
        run: |
          echo "::error::No cached dev client for $CACHE_KEY ($PLATFORM). JS-only changes never need a build — Metro serves the checked-out JS — so a miss means the NATIVE fingerprint moved. Dispatch again with build=true (and platform=ios|android if only one is affected) to authorise the spend (iOS \$2, Android \$1)."
          exit 1

      # Seed ONCE, before the matrix fans out: the four test jobs share one
      # store, and concurrent seeds could each miss the same variation and
      # create it twice — the popover then never resolves to exactly one
      # match. The workflow-level concurrency group serializes whole runs, so
      # this is the only writer. Exports the seeded variable product's id so
      # the flows can target it by its id-bearing testID.
      # The E2E_WC_CONSUMER_KEY/SECRET this step originally referenced were
      # never provisioned (verified 2026-08-27: `gh secret list` has no such
      # secrets), so the seed had silently run reachability-only since the
      # workflow landed. The product-writer identity IS provisioned — the same
      # standing shop_manager pair the web E2E uses.
      - name: 🌱 Seed test store
        id: seed
        env:
          E2E_PRODUCT_WRITER_USER: ${{ secrets.E2E_PRODUCT_WRITER_USER }}
          E2E_PRODUCT_WRITER_PASS: ${{ secrets.E2E_PRODUCT_WRITER_PASS }}
        run: node scripts/e2e-native-seed.mjs

      # The `development` profile — the SAME dev client developers build and
      # use by hand. One artifact serves both audiences, which is the point:
      # it contains no JS, so it only needs rebuilding when the native
      # fingerprint moves.
      - name: 🛠 Build dev client on EAS (native fingerprint changed)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/main
        env:
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          mkdir -p ../../e2e-builds
          eas build --profile development --platform "$PLATFORM" --non-interactive --wait --json > /tmp/builds.json
          IOS_URL=$(jq -r '.[] | select(.platform=="IOS") | .artifacts.buildUrl' /tmp/builds.json)
          ANDROID_URL=$(jq -r '.[] | select(.platform=="ANDROID") | .artifacts.buildUrl' /tmp/builds.json)
          # A single-platform build yields one artifact; the other URL is empty
          # and its test job is skipped, so there is nothing to download. Empty
          # AND unexpectedly-missing look alike here, so assert the artifact the
          # selection promised rather than letting a silent miss reach the test
          # job as a confusing "file not found".
          if [ "$PLATFORM" != "android" ]; then
            [ -n "$IOS_URL" ] || { echo "::error::iOS build produced no artifact URL"; exit 1; }
            curl -fsSL "$IOS_URL" -o ../../e2e-builds/wcpos-e2e-ios.tar.gz
          fi
          if [ "$PLATFORM" != "ios" ]; then
            [ -n "$ANDROID_URL" ] || { echo "::error::Android build produced no artifact URL"; exit 1; }
            curl -fsSL "$ANDROID_URL" -o ../../e2e-builds/wcpos-e2e-android.apk
          fi

      - name: ⬆️ Share builds with test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-builds
          path: e2e-builds
          retention-days: 3

  android:
    name: 🤖 Android (${{ matrix.device.name }})
    needs: build
    if: needs.build.outputs.platform != 'ios'
    runs-on: ubuntu-latest
    # 100, not 60: the app's ONE-TIME initial catalog sync (~40 min on these
    # 2-vCPU swiftshader emulators) slows every interaction in whichever flow
    # it overlaps — a roving 20-40 min flow that still PASSES (run 33120985474:
    # flow 06 41m; run 33131212326: flows 04+05 52m together, then cancelled at
    # 60:00 with every completed flow green). Once the sync finishes, flows
    # take ~1 min. Budget = worst observed sync window + full suite + headroom.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, profile: pixel_6 }
          - { name: tablet, profile: pixel_tablet }
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.sha }}
          submodules: false

      - name: ⬇️ Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-builds
          path: e2e-builds

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      # Metro serves the checked-out revision's JS to the dev client. The
      # bundle is compiled here, under this step's own generous timeout, so
      # the app's first fetch is a Metro cache hit and flow 01's 60s UI wait
      # is never spent inside the compiler. `--no-dev --minify` serves
      # production-mode JS — same mode the old embedded-bundle builds shipped,
      # and it keeps dev-mode LogBox overlays from sitting above the app where
      # they would swallow Maestro taps. `--offline` skips Expo API calls the
      # server does not need.
      - name: 📦 Start Metro and pre-compile the bundle
        working-directory: apps/main
        run: |
          nohup npx expo start --no-dev --minify --offline --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/status >/dev/null && break
            if [ "$i" -eq 60 ]; then
              echo "::error::Metro did not come up within 120s"
              tail -50 /tmp/metro.log
              exit 1
            fi
            sleep 2
          done
          # Pre-warm via the MANIFEST, exactly as the dev client will: the
          # bundle path is entry-dependent (`/node_modules/expo-router/
          # entry.bundle`, not `/index.bundle` — a hand-built path 404s), and
          # the manifest's launchAsset URL carries the transform options
          # (hermes bytecode, react-compiler, routerRoot) that key Metro's
          # cache — a guessed URL would compile a variant the client never
          # requests. Verified locally 2026-08-28 against this exact tree.
          BUNDLE_URL=$(curl -sf -H "expo-platform: android" http://localhost:8081/ | jq -r '.launchAsset.url')
          [ -n "$BUNDLE_URL" ] && [ "$BUNDLE_URL" != "null" ] || { echo "::error::manifest had no launchAsset URL"; tail -50 /tmp/metro.log; exit 1; }
          curl -sf --max-time 900 -o /dev/null "$BUNDLE_URL" \
            || { echo "::error::Android bundle pre-compile failed"; tail -80 /tmp/metro.log; exit 1; }
          echo "Metro up; Android bundle compiled."

      - name: 🧰 Install Maestro
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b

      - name: 🔓 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # STEP timeout 10 min under the job's: `always()` cannot buy execution
      # time past the JOB deadline — GitHub cancels the whole job there, and
      # the streamed log would still be lost in the exact rover-hang scenario
      # this instrumentation exists for (review #1654). A step timeout kills
      # only the step; the job survives with headroom to upload the log.
      - name: 📱 Run Maestro suite on emulator
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          # google_apis images boot reliably on GH runners where the default
          # (aosp_atd at this API level) intermittently dies during GPU init —
          # every nightly since the 2026-08-06 promotion failed with
          # "Unable to connect to adb daemon on port: 5037" and
          # "Failed to find ColorBuffer" before Maestro ever ran.
          target: google_apis
          profile: ${{ matrix.device.profile }}
          arch: x86_64
          disable-animations: true
          # swiftshader_indirect sidesteps the host-GPU ColorBuffer failures;
          # no-snapshot avoids stale snapshot restores on ephemeral runners.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # All 4 of the runner's vCPUs, not the action's default 2:
          # swiftshader renders the GPU on these same guest cores, so the app
          # and its renderer were sharing two virtual CPUs — the
          # roving-starvation runs (single taps at 480-514s, run 33182224622)
          # happened under that budget. The host-side processes (QEMU
          # plumbing, adb, maestro, Metro) are IO-bound waiters during flows,
          # so full oversubscription is the better bet than reserving a core
          # — and the flow-timing triage below measures exactly this, so if 4
          # thrashes worse than 3 the table will say so and this is a
          # one-line revert.
          cores: 4
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            # Cold first-boot emulators on busy runners throw system-process ANR
            # dialogs ("Pixel Launcher isn't responding", googlesdksetup — both
            # Android jobs in run 33127572216 died at flow 01 behind one). The
            # dialog window sits above the app, so every assert times out.
            # hide_error_dialogs suppresses ANR/crash dialogs system-wide.
            adb shell settings put global hide_error_dialogs 1
            # The flows launch the dev client into http://localhost:8081 (the
            # DEV_CLIENT_URL default in flows 01/02); adb reverse makes the
            # emulator's localhost:8081 reach Metro on this host, so the same
            # URL works on both platforms and in local runs.
            adb reverse tcp:8081 tcp:8081
            adb install e2e-builds/wcpos-e2e-android.apk
            # STREAM logcat from before the suite, not dump-on-failure: the
            # "roving slow flow" (run 33183xxxx phone: flows 01-05 in ~9 min,
            # then 40+ min creeping inside flow 06 without failing any single
            # wait) never triggers a failure-only dump — it either passes
            # eventually or dies to the job timeout, which kills the script
            # mid-line so a fallback dump never runs either. A background
            # stream captures the device story for pass, fail, AND
            # timeout-kill alike. Buffer bumped so a long suite does not wrap.
            # ONE line per command: the emulator-runner action executes this
            # script LINE BY LINE, each as its own `sh -c` — a trailing `\`
            # becomes a literal maestro argument (run 33153806439).
            adb logcat -G 16M
            mkdir -p ~/.maestro/tests && nohup adb logcat -v threadtime > ~/.maestro/tests/logcat.txt 2>&1 &
            # Output tees into the artifact for the timing-triage step. The
            # runner's sh is dash (no pipefail), and each script line is its
            # own shell — so maestro's real exit code crosses lines via a
            # file, and the tee'd pipeline's own exit stays 0 on purpose.
            { maestro test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" -e DEVICE_CLASS="${DEVICE_CLASS}" apps/main/.maestro; echo $? > ~/.maestro/tests/exit_code; } 2>&1 | tee ~/.maestro/tests/suite.log
            exit "$(cat ~/.maestro/tests/exit_code)"
        env:
          # The Maestro Android driver installs its two APKs and waits for the
          # instrumentation channel; first-boot emulators on shared runners
          # regularly exceed the 15s default.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
          # Pins flow 07 to the seeded product's id-bearing testID; the `.*`
          # fallback (also the flow's own default) matches any variable tile.
          VARIABLE_PRODUCT_ID: ${{ needs.build.outputs.variable_product_id }}
          # Tells flow 09 whether the resize handle is required (tablet) or optional (phone).
          DEVICE_CLASS: ${{ matrix.device.name }}

      # Makes a red (or slow-green) check self-explaining at a glance: the
      # job summary carries every flow's duration, and any flow past the
      # STARVED threshold gets a ::warning:: naming it — so "red because the
      # device starved" and "red because an assertion failed" stop looking
      # identical (owner complaint, 2026-08-28). Labeling only: nothing here
      # passes or fails the job.
      - name: 🕒 Flow timing triage
        if: always()
        run: |
          LOG="$HOME/.maestro/tests/suite.log"
          [ -f "$LOG" ] || { echo "no suite.log — the job died before Maestro ran" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # 600s: an order of magnitude over a healthy flow (1-2.5 min), far
          # under the rover (27-30 min) — misclassification needs a 10x swing.
          # POSIX awk only (runners ship mawk — no gawk 3-arg match): the
          # duration is normalised by stripping punctuation and reading the
          # trailing "<mins> m <secs> s" / "<secs> s" tokens.
          grep -aoE '\[(Passed|Failed)\] [0-9a-z-]+ \(([0-9]+m )?[0-9]+s\)' "$LOG" \
            | tr '()[]' ' ' \
            | awk -v threshold=600 -v summary="$GITHUB_STEP_SUMMARY" '
              BEGIN { printf "### Maestro flow timings (${{ matrix.device.name }})\n| Flow | Verdict | Duration |\n|---|---|---|\n" >> summary }
              {
                verdict=$1; flow=$2; total=0
                for (i=3; i<=NF; i++) {
                  v=$i
                  if (v ~ /m$/) { sub(/m$/,"",v); total += v*60 }
                  else if (v ~ /s$/) { sub(/s$/,"",v); total += v+0 }
                }
                printf "| %s | %s | %dm %02ds |\n", flow, verdict, total/60, total%60 >> summary
                if (total > threshold)
                  printf "::warning title=starvation-shaped::%s took %dm %02ds (threshold %ds) — device starvation, not necessarily an app failure\n", flow, total/60, total%60, threshold
              }'

      # always(), not failure(): the roving-slow-flow evidence lives in runs
      # that PASS late or die to the job timeout — failure-only upload threw
      # that evidence away every time. always() also survives timeout-kill
      # (cancelled in-progress steps still reach post steps with always()).
      - name: ⬆️ Upload device artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-${{ matrix.device.name }}
          path: ~/.maestro/tests
          retention-days: 7

  ios:
    name: 🍎 iOS (${{ matrix.device.name }})
    needs: build
    if: needs.build.outputs.platform != 'android'
    runs-on: macos-15
    # 60, was 45: the dev-client architecture adds pnpm install (~3-5 min) and
    # Metro's one-time bundle compile (~3-6 min) to the front of the job.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, simulator: iPhone 16 Pro }
          - { name: tablet, simulator: iPad Pro 11-inch (M4) }
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.sha }}
          submodules: false

      - name: ⬇️ Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-builds
          path: e2e-builds

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      # Metro serves the checked-out revision's JS to the dev client — see the
      # Android job's twin step for the full rationale. The simulator shares
      # the host loopback, so the flows' localhost:8081 URL needs no port
      # plumbing here.
      - name: 📦 Start Metro and pre-compile the bundle
        working-directory: apps/main
        run: |
          nohup npx expo start --no-dev --minify --offline --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/status >/dev/null && break
            if [ "$i" -eq 60 ]; then
              echo "::error::Metro did not come up within 120s"
              tail -50 /tmp/metro.log
              exit 1
            fi
            sleep 2
          done
          # Manifest-driven pre-warm — see the Android job's twin step for why
          # a hand-built bundle URL is wrong twice over.
          BUNDLE_URL=$(curl -sf -H "expo-platform: ios" http://localhost:8081/ | jq -r '.launchAsset.url')
          [ -n "$BUNDLE_URL" ] && [ "$BUNDLE_URL" != "null" ] || { echo "::error::manifest had no launchAsset URL"; tail -50 /tmp/metro.log; exit 1; }
          curl -sf --max-time 900 -o /dev/null "$BUNDLE_URL" \
            || { echo "::error::iOS bundle pre-compile failed"; tail -80 /tmp/metro.log; exit 1; }
          echo "Metro up; iOS bundle compiled."

      - name: 🧰 Install Maestro
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b

      - name: 📱 Boot simulator and install app
        run: |
          # Diagnostic: which iOS runtimes this runner image offers — kept in
          # the log so the runtime pin below can be revisited from evidence.
          xcrun simctl list runtimes
          # PINNED to iOS 18.6: on the image-default iOS 26.2 runtime the
          # Maestro 2.6.1 XCUITest driver dies mid-flow after ~4 minutes with
          # no recovery (runs 33074068139 and 33081118544 both lost the driver
          # port mid-run; maestro#3318 tracks the 26.x instability). The
          # nightly's job is catching app regressions, not OS-compat testing —
          # revisit the pin when Maestro's 26.x driver stabilizes.
          UDID=$(xcrun simctl create "e2e-${{ matrix.device.name }}" "${{ matrix.device.simulator }}" com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p /tmp/e2e-app && tar -xzf e2e-builds/wcpos-e2e-ios.tar.gz -C /tmp/e2e-app
          APP_PATH=$(find /tmp/e2e-app -maxdepth 2 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "MAESTRO_UDID=$UDID" >> "$GITHUB_ENV"

      # One `maestro test` per flow, NOT batch mode: on iOS 26.x the XCUITest
      # driver socket can die mid-suite with no recovery (maestro#3318; both
      # simulators in run 33074068139 lost the driver ~4 min in). Per-flow
      # invocation is the issue's confirmed workaround — each flow gets a
      # fresh driver, and the app's on-device state still carries across
      # invocations, which is all the stateful suite needs. Filename order
      # (01…08) matches config.yaml's flowsOrder; the first failure aborts,
      # matching continueOnFailure: false.
      - name: 📱 Run Maestro suite on simulator
        run: |
          # Retry ONLY the "iOS driver not ready in time" startup flake
          # (monorepo#1614 defect 3: one iPad first-boot occurrence on 18.6).
          # That failure happens before the flow executes a single command, so
          # a retry cannot double-apply state; any other failure is a real
          # test failure and must not run twice.
          run_flow() {
            local flow="$1" log
            log=$(mktemp)
            if maestro --udid "$MAESTRO_UDID" test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" -e DEVICE_CLASS="${DEVICE_CLASS}" "$flow" 2>&1 | tee "$log"; then
              return 0
            fi
            if grep -q "driver not ready in time" "$log"; then
              echo "↻ driver startup flake — retrying ${flow} once"
              maestro --udid "$MAESTRO_UDID" test -e VARIABLE_PRODUCT_ID="${VARIABLE_PRODUCT_ID:-.*}" -e DEVICE_CLASS="${DEVICE_CLASS}" "$flow"
              return
            fi
            return 1
          }
          for flow in apps/main/.maestro/flows/*.yml; do
            echo "▶ ${flow}"
            run_flow "$flow" || exit 1
          done
        env:
          # Maestro's XCUITest driver compiles and installs its runner on
          # first launch; macOS runners routinely exceed the 15s default —
          # every nightly since the 2026-08-06 promotion died here with
          # "iOS driver not ready in time" before running a single flow.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          # Pins flow 07 to the seeded product's id-bearing testID; the `.*`
          # fallback (also the flow's own default) matches any variable tile.
          VARIABLE_PRODUCT_ID: ${{ needs.build.outputs.variable_product_id }}
          # Tells flow 09 whether the resize handle is required (tablet) or optional (phone).
          DEVICE_CLASS: ${{ matrix.device.name }}

      - name: ⬆️ Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-${{ matrix.device.name }}
          path: ~/.maestro/tests
          retention-days: 7
