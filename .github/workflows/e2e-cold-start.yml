name: E2E Cold Start

# Nightly thin-local-DB E2E profile (#991 / PR #996). Scheduled workflows only
# fire from the default branch, so this file lives on main — but the profile
# and specs live on the next lane, so the job checks out `next` (or the
# dispatch input) and runs the opt-in `pro-cold-start` Playwright project.
# Without BASE_URL the Playwright config builds and serves the web app itself.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        type: string
        default: next
      lane:
        description: Store lane containing the selected ref
        type: choice
        required: true
        default: next
        options:
          - main
          - next

permissions:
  contents: read

env:
  EXPO_USE_FAST_RESOLVER: true

jobs:
  cold-start:
    name: 🥶 Cold-start E2E (thin local catalogue)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🏗 Setup repository (next lane)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || 'next' }}
          fetch-depth: 0
          submodules: false

      - name: 🔒 Validate trusted ref
        env:
          E2E_LANE: ${{ github.event.inputs.lane || 'next' }}
        run: |
          git fetch origin "$E2E_LANE"
          if ! git merge-base --is-ancestor HEAD "origin/$E2E_LANE"; then
            echo "::error::ref must resolve to a commit on the selected $E2E_LANE lane"
            exit 1
          fi

      # No uniwind-auth-token here, deliberately: this job checks out `next`, so
      # it runs *next's* copy of the composite action, and next dropped the
      # uniwind-pro auth plumbing in 0e9d5b761 (pro's download quota was
      # exhausted; the override is free uniwind@1.10.0, which installs with no
      # token). Passing it would be an undeclared input — a warning and a no-op.
      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🎭 Install Playwright browsers
        # No --with-deps: runner images carry Chrome's system libs (see deploy.yml).
        run: cd apps/main && npx playwright install chromium --only-shell

      - name: 🥶 Run cold-start E2E
        run: cd apps/main && npx playwright test --project=pro-cold-start
        env:
          E2E_COLD_START: '1'
          CI: true
          # Scheduled runs default to next. Manual runs bind arbitrary refs to
          # an explicit validated lane, so a main-lane tag or SHA cannot be
          # silently routed to dev-next. This selects `pro-cold-start` alone,
          # so no free store is needed or bootstrapped.
          E2E_STORE_URL_PRO: ${{ github.event.inputs.lane == 'main' && 'https://dev-pro.wcpos.com' || 'https://dev-next.wcpos.com' }}

      - name: 📸 Upload results on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cold-start-results-${{ github.run_id }}
          path: |
            apps/main/test-results/
            apps/main/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
