name: E2E Cold Start

# Nightly thin-local-DB E2E profile (#991 / PR #996): the only gate that boots
# the app against an EMPTY database, so it is what catches a schema or startup
# fault that every warm profile survives. Runs the opt-in `pro-cold-start`
# Playwright project; without BASE_URL the config builds and serves the web app
# itself.
#
# Tests `main`. It tested `next` until 2026-08-22 — a leftover from when the
# profile and specs were next-only — but the lanes converged on 2026-08-15 and
# `next` has not moved since 2026-08-18, so the nightly was reporting green on a
# branch nobody ships. `next` stays available as a dispatch option.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        type: string
        default: main
      lane:
        description: Store lane containing the selected ref
        type: choice
        required: true
        default: main
        options:
          - main
          - next

permissions:
  contents: read

env:
  EXPO_USE_FAST_RESOLVER: true

jobs:
  cold-start:
    name: 🥶 Cold-start E2E (thin local catalogue)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          submodules: false

      - name: 🔒 Validate trusted ref
        env:
          E2E_LANE: ${{ github.event.inputs.lane || 'main' }}
        run: |
          git fetch origin "$E2E_LANE"
          if ! git merge-base --is-ancestor HEAD "origin/$E2E_LANE"; then
            echo "::error::ref must resolve to a commit on the selected $E2E_LANE lane"
            exit 1
          fi

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🎭 Install Playwright browsers
        # No --with-deps: runner images carry Chrome's system libs (see deploy.yml).
        run: cd apps/main && npx playwright install chromium --only-shell

      - name: 🥶 Run cold-start E2E
        run: cd apps/main && npx playwright test --project=pro-cold-start
        env:
          E2E_COLD_START: '1'
          CI: true
          # The store follows the lane (ruled: an E2E store always matches the
          # lane under test), and the lane is validated above, so a main-lane ref
          # cannot be silently routed at dev-next or vice versa. Selects
          # `pro-cold-start` alone, so no free store is needed or bootstrapped.
          E2E_STORE_URL_PRO: ${{ (github.event.inputs.lane || 'main') == 'next' && 'https://dev-next.wcpos.com' || 'https://dev-pro.wcpos.com' }}

      - name: 📸 Upload results on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cold-start-results-${{ github.run_id }}
          path: |
            apps/main/test-results/
            apps/main/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
