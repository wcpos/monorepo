name: Publish Web Bundle

# Builds the web bundle from a monorepo ref and publishes it to a web-bundle
# branch for jsDelivr.
#
# ONE jsDelivr REF PER LANE, NAMED AFTER THE LANE (owner ruling, 2026-09-04):
#
#   monorepo `next`  →  https://cdn.jsdelivr.net/gh/wcpos/web-bundle@next
#                       The `next` BRANCH of web-bundle IS the dev lane's tag.
#                       There is no versioned / prerelease tag for `next`; this
#                       workflow, run with bundle_branch=next, is the whole deploy
#                       of the PAGE. dev-next.wcpos.com reads it
#                       (WCPOS_WEB_BUNDLE_REF=next). The storage WORKER is not in
#                       it: the plugin serves that, so a bundle whose rxdb moved
#                       also needs the free plugin's `next` to re-vendor
#                       sqlite.worker.js and Pro's dev deploy to pick it up — the
#                       last step of this workflow checks dev-next for exactly that.
#
# This lane publishes to web-bundle `1.11.x`; `@1.11` on jsDelivr is what
# 1.11 plugins load. The tag `v1.11.N` is still cut from that commit by
# scripts/release/tag-web-bundle.sh on monorepo `main` (--allow-frozen-lane).
#
# WORKER / LANE GATE (released lanes only, 2026-10-14): a field plugin keeps
# the OPFS worker it vendors but loads the newest tag on its @major.minor lane,
# and rxdb's remote storage refuses any RXDB_VERSION mismatch (RM1). So the build
# is refused when its worker's RXDB_VERSION differs from the lane's highest tag
# (that change needs a new minor), when a higher lane already has tags (this
# lane is frozen; the allow_frozen_lane input overrides that part only), or when
# the worker is not the rxdb the bundle was built with. The lane is
# apps/main/package.json's major.minor at the built SHA; the gate script comes
# from THIS workflow revision, like the release gate. On
# 2026-10-14 a 17.6.0 worker tagged v1.10.41 on the 17.4.0 lane broke every web
# POS on an older plugin. See scripts/release/check-worker-rxdb-lane.sh.
#
# Manual only — run it when you want to refresh the dev bundle. The release gate
# (require-green-main) can never pass for a `next` SHA, so pass the override
# phrase; and pass `monorepo_ref` as a SHA when the branch name contains a `/`
# (the resolve step puts the ref in a REST path). The workflow FILE runs at the
# dispatch ref.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: Monorepo branch/ref to build the bundle from (use a SHA for branch names containing "/")
        required: true
        default: next
      bundle_branch:
        description: web-bundle branch to publish to — `next` IS the next lane's jsDelivr ref (@next); released lanes publish to `main` (the trunk lane) or `<major>.<minor>.x` (a stable lane) and load the major.minor tag cut at release
        required: true
        default: 1.11.x
      override_release_gate:
        description: Type "I accept a red main" to override the release gate
        type: string
        default: ''
      allow_frozen_lane:
        description: released lanes only (bundle_branch=main or <major>.<minor>.x) — build for a lane a higher lane has frozen (a deliberate patch to old plugins; the RXDB_VERSION check still applies)
        type: boolean
        default: false

concurrency:
  group: publish-web-bundle-${{ github.event.inputs.bundle_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  publish:
    name: 🌐 Build & publish web bundle
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: |
            monorepo
            web-bundle

      # The release gate runs from THIS workflow revision's checkout, before
      # `monorepo_ref` replaces the tree — an older ref would not contain the
      # local action and the gate (override included) could never run.
      - name: 📥 Check out the workflow revision (for the release gate)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1

      - name: 📌 Stage the worker/lane gate from the workflow revision
        if: ${{ github.event.inputs.bundle_branch != 'next' }}
        run: cp scripts/release/check-worker-rxdb-lane.sh "$RUNNER_TEMP/check-worker-rxdb-lane.sh"

      - name: 📌 Stage CDN verification from the workflow revision
        run: cp scripts/release/cdn-verify.sh "$RUNNER_TEMP/cdn-verify.sh"

      - name: 🔎 Resolve the requested monorepo SHA
        id: monorepo-sha
        env:
          GH_TOKEN: ${{ github.token }}
          MONOREPO_REF: ${{ github.event.inputs.monorepo_ref }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MONOREPO_REF}" --jq .sha)
          [ -n "$sha" ] || { echo "::error::could not resolve monorepo_ref '$MONOREPO_REF'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The web build is not byte-reproducible: publishing the same SHA twice yields a new
      # hashed entry and, until the retention below, deleted the old one while edges still
      # served the old manifest (dev-next, 2026-10-05 16:22: "Failed to load script …
      # entry-fb8973…"). So a SHA the branch already carries is not built or published
      # again; the run still ends with the dev-next worker check.
      - name: 🔎 Is this SHA already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.inputs.bundle_branch }}
          SHA: ${{ steps.monorepo-sha.outputs.sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/wcpos/web-bundle/commits/${BRANCH}" --jq .commit.message 2>/dev/null || echo "")
          if printf '%s' "$head" | grep -q "from monorepo ${SHA}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::web-bundle@${BRANCH} was built from ${SHA:0:12} already; not building or publishing again. The dev-next worker check still runs."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🟢 Require green main verification
        if: ${{ steps.published.outputs.already != 'true' }}
        uses: ./.github/actions/require-green-main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          sha: ${{ steps.monorepo-sha.outputs.sha }}
          override: ${{ github.event.inputs.override_release_gate }}

      - name: 📥 Check out monorepo
        if: ${{ steps.published.outputs.already != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The SHA the release gate checked, not the ref: a branch that moves
          # between the two steps would otherwise build an ungated commit.
          ref: ${{ steps.monorepo-sha.outputs.sha }}
          # submodules: false — we init the submodules by name in the next step
          # instead, so this workflow controls exactly when they are populated.
          submodules: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Init submodules
        if: ${{ steps.published.outputs.already != 'true' }}
        # Populate apps/web BEFORE `pnpm install` scans the `apps/*` workspace glob
        # — otherwise apps/web is an empty dir, `@wcpos/web-bundle` isn't a
        # workspace project, and `pnpm web build` no-ops (leaving no build output).
        # The repo preinstall hook's own `git submodule update --init` runs too
        # late (after workspace discovery), so it can't be relied on here.
        #
        # apps/web is the only submodule and must be populated before the workspace scan.
        run: git submodule update --init apps/web

      - name: 🏗 Setup monorepo
        if: ${{ steps.published.outputs.already != 'true' }}
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: 🔨 Build web bundle
        if: ${{ steps.published.outputs.already != 'true' }}
        run: pnpm web build

      # The build copies apps/main/public/opfs.worker.js (the drift-locked
      # source) into build/; gate the file that is about to be published.
      - name: 🧬 Gate the worker's RXDB_VERSION against its bundle lane
        if: ${{ steps.published.outputs.already != 'true' && github.event.inputs.bundle_branch != 'next' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FROZEN_LANE: ${{ github.event.inputs.allow_frozen_lane }}
        run: |
          set -euo pipefail
          APP_VERSION=$(jq -er .version apps/main/package.json)
          BUNDLE_RXDB=$(jq -er .version node_modules/rxdb/package.json)
          args=(--bundle-rxdb "$BUNDLE_RXDB")
          if [ "$ALLOW_FROZEN_LANE" = true ]; then args+=(--allow-frozen-lane); fi
          bash "$RUNNER_TEMP/check-worker-rxdb-lane.sh" apps/web/build/opfs.worker.js "$APP_VERSION" "${args[@]}"

      # The secrets context is not available in a step `if`, and a job-level env
      # would hand the token to every step — including the caller-supplied
      # monorepo_ref's own setup and lifecycle scripts. So a preflight step reads
      # the secret in its own env only and exports a boolean; the upload step is
      # the only other step that sees the token.
      - name: 🔎 Is Sentry configured?
        if: ${{ steps.published.outputs.already != 'true' }}
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN is not set; skipping source map upload."
          fi

      - name: 🗺️ Upload source maps to Sentry
        if: ${{ steps.sentry.outputs.configured == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./apps/main/package.json').version")
          MAPS_DIR="$GITHUB_WORKSPACE/apps/web/web-build-maps/_expo/static/js/web"
          JS_DIR="$GITHUB_WORKSPACE/apps/web/build/_expo/static/js/web"
          # Latest 2.x: 2.58.4, checked 2026-09-12 against getsentry/sentry-cli CHANGELOG.md.
          # Injection pairs adjacent files; stage JS with private maps, never maps in build/.
          cp "$JS_DIR"/*.js "$MAPS_DIR/"
          npx --yes @sentry/cli@2.58.4 sourcemaps inject "$MAPS_DIR"
          # shellcheck disable=SC2088 # Sentry's literal host-agnostic prefix, not a home directory.
          npx --yes @sentry/cli@2.58.4 sourcemaps upload --org wcpos --project woocommerce-pos \
            --release "wcpos-app@${APP_VERSION}" --url-prefix '~/_expo/static/js/web' "$MAPS_DIR"
          cp "$MAPS_DIR"/*.js "$JS_DIR/"

      - name: 🚀 Publish to web-bundle@${{ github.event.inputs.bundle_branch }}
        if: ${{ steps.published.outputs.already != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.inputs.bundle_branch }}
          MONOREPO_REF: ${{ github.event.inputs.monorepo_ref }}
          MONOREPO_SHA: ${{ steps.monorepo-sha.outputs.sha }}
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/apps/web/build"
          test -f "$BUILD_DIR/metadata.json" || { echo "::error::build output missing ($BUILD_DIR/metadata.json)"; exit 1; }

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Publish via a fresh clone of web-bundle on the target branch, decoupled
          # from the apps/web submodule (so a deps re-check during the build can't
          # reset the submodule out from under us). Full history without blobs, not
          # --depth 1: the no-inventory fallback below asks `git log -1 -- <path>` when each
          # file was last published, and a shallow clone answers "the tip" for every
          # file, so nothing ever aged out while publishes were under a day apart
          # (web-bundle@next carried chunks from 2026-10-13 on 2026-10-15). Blobless
          # history for this repo is ~6 MB and ~5 s; checkout fetches HEAD's files.
          WB="$RUNNER_TEMP/web-bundle"
          rm -rf "$WB"
          git clone --filter=blob:none --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/wcpos/web-bundle.git" "$WB"

          # Lay the fresh build over build/, retaining exactly the previous build's
          # hashed files for edges still serving its metadata.json: the ones its
          # build/publish-inventory.txt lists. That bounds the tree to two builds (a
          # day's builds can exceed jsDelivr's 50 MB package limit, which refuses every
          # file). Asking which commit last touched a file was wrong: a chunk unchanged
          # from build A to B was last touched by A, so build C dropped it while edges
          # serving B's metadata.json still named it. Unhashed files (metadata.json,
          # index.html, the workers) are simply overwritten.
          mkdir -p "$WB/build"
          cp -R "$BUILD_DIR/." "$WB/build/"
          cd "$WB"
          INVENTORY=build/publish-inventory.txt
          if previous_inventory=$(git show "HEAD:$INVENTORY" 2>/dev/null); then
            previous_build=""
          else
            previous_inventory=""
            previous_build=$(git log -1 --format=%H --grep='^chore(release): build web bundle' HEAD)
            echo "no previous $INVENTORY; keeping the hashed files the most recent build commit last touched"
          fi
          git ls-files build | while read -r path; do
            [ -e "$BUILD_DIR/${path#build/}" ] && continue
            # Only hashed files under _expo/ get retained: a stale metadata.json
            # names those and nothing else. This lane publishes to web-bundle `1.11.x`;
            # drop root files absent from the new build rather than carry stale workers.
            # The previous build's own publish-inventory.txt is one; it is rewritten below.
            case "${path#build/}" in
              */*) ;;
              *) echo "dropping $path (a root file this build does not carry)"; git rm -q "$path"; continue ;;
            esac
            if [ -n "$previous_build" ]; then
              keep=$([ "$(git log -1 --format=%H -- "$path")" = "$previous_build" ] && echo yes || echo no)
            else
              keep=$(grep -Fxq -- "${path#build/}" <<< "$previous_inventory" && echo yes || echo no)
            fi
            if [ "$keep" = yes ]; then
              echo "keeping $path (from the previous build; an edge may still name it)"
            else
              git rm -q "$path"
            fi
          done
          # This build's own _expo/ files, for the next publish's retention. Written
          # here, never into $BUILD_DIR, which the CDN job uploads.
          (cd "$BUILD_DIR" && find _expo -type f | LC_ALL=C sort) > "$INVENTORY"

          # 45 MiB, under jsDelivr's 50 MB limit whichever unit they mean, and under it
          # with one retained previous build.
          WEB_BUNDLE_TREE_LIMIT_BYTES=47185920
          # Include new, untracked files too: git add -A below will publish them.
          sizes=$(git ls-files --cached --others --exclude-standard -z build | while IFS= read -r -d '' path; do
            size=$(wc -c < "$path" | tr -d ' ')
            printf '%s %s\n' "$size" "$path"
          done)
          total=$(awk '{ n += $1 } END { printf "%.0f", n }' <<< "$sizes")
          mib=$(awk -v n="$total" 'BEGIN { printf "%.2f", n / 1048576 }')
          echo "tree $BRANCH: $total bytes ($mib MiB)"
          if ((total > WEB_BUNDLE_TREE_LIMIT_BYTES)); then
            sort -nr <<< "$sizes" | sed -n '1,10p'
            echo "::error::web-bundle@$BRANCH would be $mib MiB; jsDelivr refuses every file of a version over 50 MB. Drop the retained files listed above or publish to a lane branch."
            exit 1
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "No bundle changes to publish."
            exit 0
          fi
          # The SHA is what "already published" above matches on; keep it in the message.
          git commit -m "chore(release): build web bundle (@${BRANCH} from monorepo ${MONOREPO_SHA}, ref ${MONOREPO_REF})"
          git push origin "$BRANCH"

      # Runs even when nothing was pushed or built, so a later run that finds the SHA
      # already published still purges and verifies the lane; after a failure, wait
      # for the throttle reset the error names before running again. With no build
      # output, the branch tree on GitHub is the expectation instead.
      - name: 🧹 Purge and verify jsDelivr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.inputs.bundle_branch }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cdn-verify.sh"
          BUILD_DIR="$GITHUB_WORKSPACE/apps/web/build"
          purge_cdn_root "$BRANCH"
          if [ -f "$BUILD_DIR/metadata.json" ]; then
            expected=$(expected_from_dir "$BUILD_DIR")
          else
            expected=$(expected_from_tree "$BRANCH")
          fi
          hashed=""; unhashed=""; n=0; m=0
          while read -r sha path; do
            if is_unhashed_path "$path"; then
              unhashed+="$sha $path"$'\n'; m=$((m + 1))
            else
              hashed+="$sha $path"$'\n'; n=$((n + 1))
            fi
          done <<< "$expected"
          if ! printf '%s' "$hashed" | verify_cdn_paths "$BRANCH" "$CDN_HASHED_DEADLINE_SECONDS"; then
            echo "::error::jsDelivr does not serve the bytes of the published hashed files on @${BRANCH}; metadata.json was not purged, so stores still load the previous build. $(cdn_refresh_advice "on the @${BRANCH} branch")"
            exit 1
          fi
          while read -r sha path; do
            [[ -z "$path" ]] || purge_cdn_path "$BRANCH" "$path"
          done <<< "$unhashed"
          if ! printf '%s' "$unhashed" | verify_cdn_paths "$BRANCH" "$CDN_UNHASHED_DEADLINE_SECONDS"; then
            echo "::error::jsDelivr does not serve the published metadata.json/index.html/workers on @${BRANCH} after the purge. $(cdn_refresh_advice "on the @${BRANCH} branch")"
            exit 1
          fi
          echo "Bundle ref: https://cdn.jsdelivr.net/gh/wcpos/web-bundle@${BRANCH}/build/metadata.json"
          echo "Verified by content: ${n} hashed files and ${m} unhashed files"

      # The page is the bundle; the storage worker is NOT. The plugin serves it
      # (Frontend.php hands the app `opfsWorker`), and on dev-next that plugin is
      # woocommerce-pos-pro's vendored copy of the free plugin. A bundle whose rxdb
      # moved boots against a worker the plugins have not re-vendored yet and every
      # tab fails with RxDB RM1 ("Failed to create user database") — this workflow
      # was green while dev-next was down (2026-10-05). So the publish ends by
      # reading the worker dev-next actually serves and comparing it with the one
      # just published. A mismatch fails the run and names the two deploys to make.
      - name: 🧵 dev-next serves the worker this bundle was built with
        if: ${{ github.event.inputs.bundle_branch == 'next' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MONOREPO_SHA: ${{ steps.monorepo-sha.outputs.sha }}
          # dev-next's active plugin is Pro; the free plugin dir there is inactive,
          # so its own deploy changes nothing the page loads.
          SERVED_WORKER: https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/js/sqlite.worker.js
        run: |
          set -euo pipefail
          # The worker the bundle carries: the built copy, or — when this SHA was already
          # published and nothing was built — the one the branch holds (the build copies
          # it from apps/main/public unchanged; fetched by the resolved SHA, raw).
          published="$GITHUB_WORKSPACE/apps/web/build/sqlite.worker.js"
          if [ ! -f "$published" ]; then
            published="$RUNNER_TEMP/published.sqlite.worker.js"
            gh api "repos/${GITHUB_REPOSITORY}/contents/apps/main/public/sqlite.worker.js?ref=${MONOREPO_SHA}" \
              -H "Accept: application/vnd.github.raw" > "$published" \
              || { echo "::error::could not read apps/main/public/sqlite.worker.js at ${MONOREPO_SHA}"; exit 1; }
          fi
          test -s "$published" || { echo "::error::the bundle has no sqlite.worker.js"; exit 1; }
          served="$RUNNER_TEMP/served.sqlite.worker.js"
          curl -fsSL --retry 3 "$SERVED_WORKER" -o "$served" \
            || { echo "::error::could not fetch the worker dev-next serves ($SERVED_WORKER)"; exit 1; }
          want=$(sha256sum "$published" | cut -d' ' -f1)
          have=$(sha256sum "$served" | cut -d' ' -f1)
          # Informational: the rxdb version strings the worker carries (RM1 names them too).
          versions() { grep -oE '\b1[0-9]\.[0-9]+\.[0-9]+\b' "$1" | sort -u | tr '\n' ' '; }
          if [ "$want" = "$have" ]; then
            echo "✅ dev-next serves the published worker (sha256 ${want:0:12})"
            exit 0
          fi
          echo "::error::dev-next serves a different sqlite.worker.js than this bundle was built with (published ${want:0:12} [$(versions "$published")], served ${have:0:12} [$(versions "$served")]). The page will fail with RxDB RM1 until the plugins catch up: (1) re-vendor assets/js/sqlite.worker.js from web-bundle@next in wcpos/woocommerce-pos and merge to next; (2) gh workflow run deploy-dev.yml --repo wcpos/woocommerce-pos-pro --ref next (Pro vendors free at build time; the free plugin's own deploy does not reach dev-next's page)."
          exit 1
