name: Publish Web Bundle

# Builds the web bundle from a monorepo ref and publishes it to a web-bundle
# branch for jsDelivr.
#
# ONE jsDelivr REF PER LANE, NAMED AFTER THE LANE (owner ruling, 2026-09-04):
#
#   monorepo `next`  →  https://cdn.jsdelivr.net/gh/wcpos/web-bundle@next
#                       The `next` BRANCH of web-bundle IS the dev lane's tag.
#                       There is no versioned / prerelease tag for `next`; this
#                       workflow, run with bundle_branch=next, is the whole deploy
#                       of the PAGE. dev-next.wcpos.com reads it
#                       (WCPOS_WEB_BUNDLE_REF=next). The storage WORKER is not in
#                       it: the plugin serves that, so a bundle whose rxdb moved
#                       also needs the free plugin's `next` to re-vendor
#                       sqlite.worker.js and Pro's dev deploy to pick it up — the
#                       last step of this workflow checks dev-next for exactly that.
#
#   monorepo `main`  →  https://cdn.jsdelivr.net/gh/wcpos/web-bundle@<major.minor>
#                       (e.g. @1.10, then @1.11 once `next` becomes `main`). The
#                       plugin derives that ref from its own version, and the tag
#                       is cut by the release train, not by this workflow.
#
# Publishing to the `main` BRANCH of web-bundle is a staging convenience only —
# it moves nothing a released plugin loads.
#
# Manual only — run it when you want to refresh the dev bundle. The release gate
# (require-green-main) can never pass for a `next` SHA, so pass the override
# phrase; and pass `monorepo_ref` as a SHA when the branch name contains a `/`
# (the resolve step puts the ref in a REST path). Dispatch with `--ref next`:
# the workflow FILE runs at the dispatch ref, and the dev-next worker check at
# the end of this file is on `next` before it is on `main`.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: Monorepo branch/ref to build the bundle from (use a SHA for branch names containing "/")
        required: true
        default: next
      bundle_branch:
        description: web-bundle branch to publish to — `next` IS the next lane's jsDelivr ref (@next); released lanes use the major.minor tag cut at release
        required: true
        default: next
      override_release_gate:
        description: Type "I accept a red main" to override the release gate
        type: string
        default: ''

concurrency:
  group: publish-web-bundle-${{ github.event.inputs.bundle_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  publish:
    name: 🌐 Build & publish web bundle
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: |
            monorepo
            web-bundle

      # The release gate runs from THIS workflow revision's checkout, before
      # `monorepo_ref` replaces the tree — an older ref would not contain the
      # local action and the gate (override included) could never run.
      - name: 📥 Check out the workflow revision (for the release gate)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1

      - name: 🔎 Resolve the requested monorepo SHA
        id: monorepo-sha
        env:
          GH_TOKEN: ${{ github.token }}
          MONOREPO_REF: ${{ github.event.inputs.monorepo_ref }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MONOREPO_REF}" --jq .sha)
          [ -n "$sha" ] || { echo "::error::could not resolve monorepo_ref '$MONOREPO_REF'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 🟢 Require green main verification
        uses: ./.github/actions/require-green-main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          sha: ${{ steps.monorepo-sha.outputs.sha }}
          override: ${{ github.event.inputs.override_release_gate }}

      - name: 📥 Check out monorepo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.monorepo_ref }}
          # submodules: false — we init the submodules by name in the next step
          # instead, so this workflow controls exactly when they are populated.
          submodules: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Init submodules
        # Populate apps/web BEFORE `pnpm install` scans the `apps/*` workspace glob
        # — otherwise apps/web is an empty dir, `@wcpos/web-bundle` isn't a
        # workspace project, and `pnpm web build` no-ops (leaving no build output).
        # The repo preinstall hook's own `git submodule update --init` runs too
        # late (after workspace discovery), so it can't be relied on here.
        #
        # apps/web is the only submodule and must be populated before the workspace scan.
        run: git submodule update --init apps/web

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: 🔨 Build web bundle
        run: pnpm web build

      # The secrets context is not available in a step `if`, and a job-level env
      # would hand the token to every step — including the caller-supplied
      # monorepo_ref's own setup and lifecycle scripts. So a preflight step reads
      # the secret in its own env only and exports a boolean; the upload step is
      # the only other step that sees the token.
      - name: 🔎 Is Sentry configured?
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN is not set; skipping source map upload."
          fi

      - name: 🗺️ Upload source maps to Sentry
        if: ${{ steps.sentry.outputs.configured == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./apps/main/package.json').version")
          MAPS_DIR="$GITHUB_WORKSPACE/apps/web/web-build-maps/_expo/static/js/web"
          JS_DIR="$GITHUB_WORKSPACE/apps/web/build/_expo/static/js/web"
          # Latest 2.x: 2.58.4, checked 2026-09-12 against getsentry/sentry-cli CHANGELOG.md.
          # Injection pairs adjacent files; stage JS with private maps, never maps in build/.
          cp "$JS_DIR"/*.js "$MAPS_DIR/"
          npx --yes @sentry/cli@2.58.4 sourcemaps inject "$MAPS_DIR"
          # shellcheck disable=SC2088 # Sentry's literal host-agnostic prefix, not a home directory.
          npx --yes @sentry/cli@2.58.4 sourcemaps upload --org wcpos --project woocommerce-pos \
            --release "wcpos-app@${APP_VERSION}" --url-prefix '~/_expo/static/js/web' "$MAPS_DIR"
          cp "$MAPS_DIR"/*.js "$JS_DIR/"

      - name: 🚀 Publish to web-bundle@${{ github.event.inputs.bundle_branch }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.inputs.bundle_branch }}
          MONOREPO_REF: ${{ github.event.inputs.monorepo_ref }}
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/apps/web/build"
          test -f "$BUILD_DIR/metadata.json" || { echo "::error::build output missing ($BUILD_DIR/metadata.json)"; exit 1; }

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Publish via a fresh clone of web-bundle on the target branch, decoupled
          # from the apps/web submodule (so a deps re-check during the build can't
          # reset the submodule out from under us).
          WB="$RUNNER_TEMP/web-bundle"
          rm -rf "$WB"
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/wcpos/web-bundle.git" "$WB"

          # Mirror the freshly built bundle into build/ (replace contents so removed
          # / renamed hashed chunks are dropped).
          rm -rf "$WB/build"
          mkdir -p "$WB/build"
          cp -R "$BUILD_DIR/." "$WB/build/"

          cd "$WB"
          git add -A
          if git diff --staged --quiet; then
            echo "No bundle changes to publish."
            exit 0
          fi
          git commit -m "chore(release): build web bundle (@${BRANCH} from monorepo ${MONOREPO_REF})"
          git push origin "$BRANCH"

      - name: 🧹 Purge jsDelivr
        env:
          BRANCH: ${{ github.event.inputs.bundle_branch }}
        run: |
          set -e
          for f in metadata.json index.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/wcpos/web-bundle@${BRANCH}/build/${f}" || echo "000")
            echo "purge @${BRANCH}/build/${f} -> HTTP ${code}"
          done
          echo "Bundle ref: https://cdn.jsdelivr.net/gh/wcpos/web-bundle@${BRANCH}/build/metadata.json"

      # The page is the bundle; the storage worker is NOT. The plugin serves it
      # (Frontend.php hands the app `opfsWorker`), and on dev-next that plugin is
      # woocommerce-pos-pro's vendored copy of the free plugin. A bundle whose rxdb
      # moved boots against a worker the plugins have not re-vendored yet and every
      # tab fails with RxDB RM1 ("Failed to create user database") — this workflow
      # was green while dev-next was down (2026-10-05). So the publish ends by
      # reading the worker dev-next actually serves and comparing it with the one
      # just published. A mismatch fails the run and names the two deploys to make.
      - name: 🧵 dev-next serves the worker this bundle was built with
        if: ${{ github.event.inputs.bundle_branch == 'next' }}
        env:
          # dev-next's active plugin is Pro; the free plugin dir there is inactive,
          # so its own deploy changes nothing the page loads.
          SERVED_WORKER: https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/js/sqlite.worker.js
        run: |
          set -euo pipefail
          published="$GITHUB_WORKSPACE/apps/web/build/sqlite.worker.js"
          test -f "$published" || { echo "::error::the built bundle has no sqlite.worker.js"; exit 1; }
          served="$RUNNER_TEMP/served.sqlite.worker.js"
          curl -fsSL --retry 3 "$SERVED_WORKER" -o "$served" \
            || { echo "::error::could not fetch the worker dev-next serves ($SERVED_WORKER)"; exit 1; }
          want=$(sha256sum "$published" | cut -d' ' -f1)
          have=$(sha256sum "$served" | cut -d' ' -f1)
          # Informational: the rxdb version strings the worker carries (RM1 names them too).
          versions() { grep -oE '\b1[0-9]\.[0-9]+\.[0-9]+\b' "$1" | sort -u | tr '\n' ' '; }
          if [ "$want" = "$have" ]; then
            echo "✅ dev-next serves the published worker (sha256 ${want:0:12})"
            exit 0
          fi
          echo "::error::dev-next serves a different sqlite.worker.js than this bundle was built with (published ${want:0:12} [$(versions "$published")], served ${have:0:12} [$(versions "$served")]). The page will fail with RxDB RM1 until the plugins catch up: (1) re-vendor assets/js/sqlite.worker.js from web-bundle@next in wcpos/woocommerce-pos and merge to next; (2) gh workflow run deploy-dev.yml --repo wcpos/woocommerce-pos-pro --ref next (Pro vendors free at build time; the free plugin's own deploy does not reach dev-next's page)."
          exit 1
