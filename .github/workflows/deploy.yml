name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy as preview or production
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      skip_e2e:
        description: Skip E2E tests
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # NOTE: deliberately no workflow-level `paths:` filter. "🎭 E2E Tests"
    # (the e2e-gate job) is a REQUIRED merge-gate check, and a check that is
    # never reported blocks the gate until it times out. The path filtering
    # moved into the `changes` job below, so the workflow always runs and the
    # gate always gets an answer — the same pattern test.yml uses for Lint /
    # Unit Tests.

# PR-event runs all hit the ONE shared dev store; concurrent E2E runs contend
# on the same pinned SKU / checkout flows and fail specs that pass solo
# (verified 2026-08-07: 5 simultaneous runs → checkout/variations failures;
# solo reruns green). Serialization used to be a single shared concurrency
# group ('e2e-shared-store'), but GitHub keeps at most ONE pending run per
# group: with 3+ PRs active, each new run evicted (cancelled) another PR's
# queued run, and the evicted PR's required "🎭 E2E Tests" gate never
# reported at all (observed 2026-08-11: a dozen cross-PR cancellations in one
# evening). First-attempt groups are therefore per-PR — a new push can only
# supersede ITS OWN PR's older run. Re-run attempts use their original run id
# so a stale re-run cannot cancel a newer SHA. Cross-run store serialization
# moved to the ⏳ Shared-store queue job below, which waits instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}-{1}', github.event.pull_request.number, github.run_attempt != '1' && github.run_id || 'current') || format('deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EXPO_USE_FAST_RESOLVER: true

permissions:
  contents: read

jobs:
  changes:
    name: 🔍 Detect Deploy Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              # Deploy + E2E only matter for changes that can affect apps/main.
              # The template-studio is an internal designer tool that ships
              # nothing to the deployed app, so its changes shouldn't trigger a
              # full E2E run.
              - 'apps/**'
              - '!apps/template-studio/**'
              - 'packages/**'
              - '.github/workflows/deploy.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: changes
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || needs.changes.outputs.src == 'true') && (github.event.pull_request.draft == false || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    outputs:
      deployment_url: ${{ steps.get-url.outputs.url }}
      is_production: ${{ steps.get-url.outputs.is_production }}
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: ✅ Build apps/main
        run: pnpm run -w build:main

      - name: 🌐 Export apps/main for web
        working-directory: apps/main
        run: pnpm expo export --platform web --output-dir ./build

      - name: 🚀 Deploy preview
        id: deploy-preview
        if: github.event_name == 'pull_request' || github.event.inputs.target == 'preview'
        working-directory: apps/main
        run: |
          # Deploy and capture output
          set +e
          OUTPUT=$(eas deploy --export-dir ./build --non-interactive --json 2>&1)
          EXIT_CODE=$?
          set -e

          echo "EAS output: $OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::EAS deploy exited with code $EXIT_CODE"
          fi

          # Extract URL from JSON output
          URL=$(echo "$OUTPUT" | grep -E '^\{' -A 100 | jq -r '.url // empty' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            URL=$(echo "$OUTPUT" | grep -oE 'https://wcpos[a-zA-Z0-9._-]+\.expo\.app' | head -1 | tr -d '"' || echo "")
          fi

          # Fail if deployment failed AND no URL was extracted
          if [ $EXIT_CODE -ne 0 ] && [ -z "$URL" ]; then
            echo "::error::Deployment failed and no URL was extracted"
            exit 1
          fi

          echo "Deployment URL: $URL"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy production
        id: deploy-production
        if: (github.event_name == 'push' && github.ref_name == 'main') || github.event.inputs.target == 'production'
        working-directory: apps/main
        run: |
          eas deploy --export-dir ./build --production
          echo "production_url=https://wcpos.expo.app" >> $GITHUB_OUTPUT

      - name: 📝 Get deployment URL
        id: get-url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event.inputs.target }}" = "preview" ]; then
            echo "url=${{ steps.deploy-preview.outputs.preview_url }}" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
          else
            echo "url=https://wcpos.expo.app" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
          fi

  # Serializes E2E across all runs of this workflow THAT TARGET THE SAME
  # STORE, without ever cancelling another run: the E2E store is keyed to the
  # run's lane (owner ruling 2026-08-17: `next`-lane work tests against
  # dev-next; everything else — main PRs, pushes to main — tests against
  # dev-pro, the released-profile store). The target store rides in this job's
  # NAME so other runs can read it from the jobs API; runs queued for a
  # different store never contend. It
  # polls the Actions API and proceeds only when (a) no other run is executing
  # or about to execute its E2E shards and (b) no other run entered this queue
  # earlier (FIFO by this job's started_at, run id as tie-break — both sides
  # evaluate the same total order, so two waiters can't deadlock or both
  # proceed). Lock-free on purpose: a branch/mutex lock leaks when its holder
  # is cancelled, but a cancelled run's shard jobs read as completed here, so
  # the store frees itself. A few seconds of overlap remain possible between
  # one run's queue passing and its shards appearing — the failure mode is a
  # rare concurrent run (today's flake), never a blocked or cancelled gate.
  queue:
    # Lane→store map, duplicated in the e2e job's E2E_STORE_URL_PRO and the
    # STORE env below — keep all three in step. Computed from pure event
    # context (never a needs output) so the name is rendered the moment the
    # run is created and other queue waiters can always read it.
    name: ⏳ Shared-store queue (${{ (github.base_ref == 'next' || github.ref_name == 'next') && 'dev-next' || 'dev-pro' }})
    needs: deploy
    if: needs.deploy.outputs.deployment_url != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true') && (github.event.pull_request.draft == false || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Generous: each run ahead of us holds the store for its full E2E phase
    # (~15–25 min), and agent-driven evenings queue several PRs deep. A
    # timeout fails the e2e-gate with an explicit message — re-run the
    # workflow — rather than silently passing.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - name: ⏳ Wait for the shared dev store to be free
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          STORE: ${{ (github.base_ref == 'next' || github.ref_name == 'next') && 'dev-next' || 'dev-pro' }}
        run: |
          set -euo pipefail
          QUEUE_PREFIX='⏳ Shared-store queue'
          QUEUE_JOB="$QUEUE_PREFIX ($STORE)"
          SHARD_PREFIX='🎭 E2E Tests ('

          # A transient GitHub API failure (5xx, truncated body — observed
          # 2026-08-12 as "unexpected end of JSON input" failing this REQUIRED
          # gate two seconds in) must not fail the gate. Retry each read; the
          # poll loop below additionally treats a read that stays broken as
          # "store busy" and just waits out the next cycle. Missing startup
          # timestamps and the job-level timeout remain hard failures.
          api() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(gh api "$@" 2>/dev/null); then
                printf '%s\n' "$out"
                return 0
              fi
              echo "::warning::gh api $1 failed (attempt $attempt/3)" >&2
              if (( attempt < 3 )); then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }

          # Our queue-arrival timestamp is the FIFO ordering key.
          my_started=$(api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"$QUEUE_JOB\") | .started_at" | head -n 1 || true)
          if [ -z "$my_started" ]; then
            echo "::error::Could not read this run's queue job start time"
            exit 1
          fi
          echo "Queue slot: $my_started (run $RUN_ID)"

          while :; do
            busy=""
            # A queued run normally starts within minutes; one stuck queued for
            # longer is a zombie (observed 2026-08-12: run 31123458025 had sat
            # "queued" for SIX DAYS) and counting it as a rollout-era blocker
            # would hold the store hostage until every waiter's 150-minute
            # timeout. Two hours is comfortably past real runner wait times.
            queued_cutoff=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
              || date -u -v-2H '+%Y-%m-%dT%H:%M:%SZ')
            if ! active_runs=$(
              api "repos/$REPO/actions/workflows/deploy.yml/runs?status=in_progress&per_page=100" \
                --paginate --jq '.workflow_runs[] | "\(.id)\t\(.created_at)"' &&
              api "repos/$REPO/actions/workflows/deploy.yml/runs?status=queued&per_page=100" \
                --paginate --jq ".workflow_runs[] | select(.created_at > \"$queued_cutoff\") | \"\(.id)\t\(.created_at)\""
            ); then
              echo "⏳ GitHub API unavailable while listing runs — waiting…"
              sleep 180
              continue
            fi
            # fd 9 keeps the run list out of stdin — a tool inside the loop
            # reading stdin must not be able to swallow the remaining runs.
            while IFS=$'\t' read -r -u 9 id created; do
              [ -z "$id" ] && continue
              [ "$id" = "$RUN_ID" ] && continue
              if ! jobs=$(api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                --jq '[.jobs[] | {name, status, conclusion, started_at, completed_at}]'); then
                busy="run $id could not be inspected (GitHub API error)"
                break
              fi

              # Store scoping: a run's target store rides in its queue-job
              # name. A run queued for a DIFFERENT store cannot contend with
              # ours — skip every ownership rule for it. Keep the bare legacy
              # name in scope so a passed queue or running shards still claim
              # dev-pro. A legacy queue that is only waiting must yield: its
              # old script cannot recognize our suffixed name, so making both
              # wait would deadlock the two workflow generations.
              their_queue=$(jq -r --arg p "$QUEUE_PREFIX" \
                '[.[] | select(.name | startswith($p))][0].name // ""' <<< "$jobs")
              if [ -n "$their_queue" ] && [ "$their_queue" != "$QUEUE_PREFIX" ] && [ "$their_queue" != "$QUEUE_JOB" ]; then
                continue
              fi

              # Zombie fence, applied to every ownership rule below: runner
              # death leaves a job "in_progress" forever with no logs (observed
              # 3× on 2026-08-12; run 31587156153's shard held the store ~50
              # min and stalled every waiter repo-wide). Anything claiming the
              # store longer than the 60-minute shard timeout plus slack can
              # only be a zombie — GitHub would have killed a live job.
              ownership_cutoff=$(date -u -d '90 minutes ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                || date -u -v-90M '+%Y-%m-%dT%H:%M:%SZ')

              # A shard actively running → the store is in use. (Only
              # in_progress counts: check runs for not-yet-eligible jobs can
              # already sit "queued", and counting those would deadlock two
              # waiters against each other. The started_at fence keeps a
              # zombie shard — the exact incident above — from blocking here
              # before the ownership rule's fence is ever consulted.)
              running=$(jq --arg p "$SHARD_PREFIX" --arg cutoff "$ownership_cutoff" \
                '[.[] | select((.name | startswith($p)) and .status == "in_progress")
                      | select(.started_at > $cutoff)] | length' <<< "$jobs")
              if [ "$running" != "0" ]; then
                busy="run $id is executing $running E2E shard(s)"
                break
              fi

              # Runs created before this queue existed (or before it carried
              # the store in its name) have no matching queue job. Hold the
              # store until those rollout-era runs finish, including ones
              # still queued in the former shared concurrency group.
              #
              # Created-at fence (2026-08-17 starvation incident): a FRESHLY
              # created run also shows no queue job for its entire build
              # phase (~8 min) — the job only renders once its deploy
              # finishes. Counting those as rollout-era holders froze every
              # waiter for ~8 min after every push anywhere; an agent's push
              # cadence turned that into an evening-long starvation of
              # dev-pro. A young run cannot actually own the store — its
              # shards need its own queue job to pass first, and that job
              # will FIFO behind us once it renders — so only runs old
              # enough that a live queue job must have rendered already
              # (30 min covers build plus runner-queue slack) block here.
              if [ -z "$their_queue" ]; then
                build_cutoff=$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                  || date -u -v-30M '+%Y-%m-%dT%H:%M:%SZ')
                if [ -n "$created" ] && [[ "$created" > "$build_cutoff" ]]; then
                  continue
                fi
                busy="run $id uses the previous workflow and has not finished"
                break
              fi

              # Their queue already passed but their shards haven't all
              # finished → they own the store (covers the gap where shards
              # exist only as queued check runs, or none are listed yet). The
              # completed_at fence expires claims a zombie can't release —
              # completed_at is in the projection above precisely for this.
              queue_passed=$(jq --arg q "$their_queue" --arg cutoff "$ownership_cutoff" \
                '[.[] | select(.name == $q and .status == "completed" and .conclusion == "success")
                      | select(.completed_at > $cutoff)] | length' <<< "$jobs")
              if [ "$queue_passed" != "0" ]; then
                shards_done=$(jq --arg p "$SHARD_PREFIX" \
                  '([.[] | select(.name | startswith($p))] | length > 0) and ([.[] | select((.name | startswith($p)) and .status != "completed")] | length == 0)' <<< "$jobs")
                if [ "$shards_done" != "true" ]; then
                  busy="run $id passed the queue and its shards have not finished"
                  break
                fi
              fi

              # An earlier waiter goes first — unless its queue job has sat
              # "in_progress" past its own 150-minute timeout, which only a
              # zombie can do (GitHub would have killed a live one).
              waiter_cutoff=$(date -u -d '150 minutes ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                || date -u -v-150M '+%Y-%m-%dT%H:%M:%SZ')
              older=$(jq --arg q "$QUEUE_JOB" --arg mine "$my_started" --arg cutoff "$waiter_cutoff" --argjson me "$RUN_ID" --argjson other "$id" \
                '[.[] | select(.name == $q and .status == "in_progress")
                      | select(.started_at > $cutoff)
                      | select(.started_at < $mine or (.started_at == $mine and $other < $me))] | length' <<< "$jobs")
              if [ "$older" != "0" ]; then
                busy="run $id entered the queue before us"
                break
              fi
            done 9<<< "$active_runs"

            if [ -z "$busy" ]; then
              echo "✅ Store is free — releasing the E2E shards"
              exit 0
            fi
            echo "⏳ $busy — waiting…"
            # Keep several simultaneous waiters below GITHUB_TOKEN's shared
            # 1,000-requests-per-hour repository limit.
            sleep 180
          done

  e2e:
    name: 🎭 E2E Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: [deploy, queue]
    if: needs.deploy.outputs.deployment_url != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true') && (github.event.pull_request.draft == false || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 4, not 6. Each shard carries ~170s of fixed overhead (checkout,
        # install, browsers, health check, auth bootstrap), so shards are not
        # free: measured on run 31429108622 the six shards spent ~17 of their
        # ~25 runner-minutes before running a test. Four duration-balanced shards
        # finish sooner in wall-clock than six COUNT-balanced ones did, for a
        # quarter less runner time. Change this number alone — the shard plan
        # rebalances itself.
        #
        # Lane-aware concurrency (2026-08-17, first dev-pro-gated run): the
        # realism store runs the same 5 php-fpm workers as dev-next but each
        # request costs several times more (ATUM hooks every product query,
        # full plugin roster, WC 10.9). Four concurrent shards push it past
        # the queuing knee — search idles at 0.4s and starves past 120s under
        # storm. Two shards keep dev-pro under the knee; dev-next keeps four.
        shardIndex: ${{ fromJSON((github.base_ref == 'next' || github.ref_name == 'next') && '[1, 2, 3, 4]' || '[1, 2]') }}
        shardTotal: ${{ fromJSON((github.base_ref == 'next' || github.ref_name == 'next') && '[4]' || '[2]') }}
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🎭 Install Playwright browsers
        run: cd apps/main && npx playwright install --with-deps chromium

      - name: 🏥 Health check deployment
        run: |
          URL="${{ needs.deploy.outputs.deployment_url }}"
          echo "Checking deployment at: $URL"

          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              # Verify the response contains expected app content
              BODY=$(curl -s "$URL")
              if echo "$BODY" | grep -q "WooCommerce POS\|wcpos\|expo"; then
                echo "✅ Deployment is healthy and serving the app"
                exit 0
              else
                echo "⚠️ Got 200 but content doesn't look like the app, retrying..."
              fi
            fi

            sleep 10
          done

          echo "❌ Deployment health check failed after 30 attempts"
          exit 1

      - name: 🧪 Run E2E tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: e2e-tests
        # Not `--shard`: that splits by TEST COUNT, which on run 31429108622 gave
        # every shard exactly 26 tests and workloads of 64s .. 473s — the gate
        # waits for the 473s one. e2e-shard-plan bin-packs whole spec files by
        # measured duration instead. It reads the file list from disk, so a new
        # spec always runs (at the median weight) rather than being skipped, and
        # it fails loudly if the plan is not a clean partition.
        run: |
          cd apps/main
          SPECS=$(node scripts/e2e-shard-plan.js "${{ matrix.shardIndex }}" "${{ matrix.shardTotal }}")
          echo "Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} running: $SPECS"
          # QUOTED: this is one alternation regex, not a word list. Unquoted, the
          # shell would split it and Playwright ANDs multiple filters — matching
          # nothing, and a shard that runs zero tests still exits 0.
          npx playwright test "$SPECS"
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
          CI: true
          # The shard index no longer reaches Playwright via --shard, but the
          # cashier-slot isolation is keyed on it. Without this every shard would
          # normalize to slot 0 and share one cashier.
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          E2E_CASHIER_PASS: ${{ secrets.E2E_CASHIER_PASS }}
          E2E_PRODUCT_WRITER_USER: ${{ secrets.E2E_PRODUCT_WRITER_USER }}
          E2E_PRODUCT_WRITER_PASS: ${{ secrets.E2E_PRODUCT_WRITER_PASS }}
          # Lane→store map (owner ruling 2026-08-17): `next`-lane work tests
          # against dev-next; everything else tests against dev-pro, the
          # released-profile store. Keep in step with the queue job's name and
          # its STORE env — the queue serializes runs per store, so this URL
          # and that name must agree or two runs could share a store unqueued.
          E2E_STORE_URL_PRO: ${{ (github.base_ref == 'next' || github.ref_name == 'next') && 'https://dev-next.wcpos.com' || 'https://dev-pro.wcpos.com' }}

      - name: 📊 Upload blob report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/main/blob-report/
          retention-days: 7

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.shardIndex }}-${{ github.sha }}
          path: apps/main/test-results/
          retention-days: 7

  # Aggregator check consumed by merge-gate.yml as "🎭 E2E Tests".
  #
  # A skipped shard matrix used to count as a pass unconditionally, which meant
  # a deploy that succeeded but published an EMPTY URL silently disabled the
  # whole E2E suite and still reported green. Skipping is only legitimate when
  # nothing was deployed in the first place (draft PR, dependabot, no
  # app-affecting paths) or when a manual dispatch explicitly opted out.
  e2e-gate:
    name: 🎭 E2E Tests
    needs: [changes, deploy, queue, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
          QUEUE_RESULT: ${{ needs.queue.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_E2E_INPUT: ${{ github.event.inputs.skip_e2e }}
        run: |
          set -uo pipefail

          if [ -n "$DEPLOY_URL" ]; then url_state="present"; else url_state="EMPTY"; fi
          echo "changes=$CHANGES_RESULT deploy=$DEPLOY_RESULT deployment_url=$url_state e2e=$E2E_RESULT event=$EVENT_NAME"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection did not succeed (result: $CHANGES_RESULT). Refusing to treat downstream skips as legitimate."
            exit 1
          fi

          if [ "$E2E_RESULT" = "success" ]; then
            echo "✅ All E2E shards passed"
            exit 0
          fi

          if [ "$E2E_RESULT" != "skipped" ]; then
            echo "::error::E2E shards did not pass (result: $E2E_RESULT)"
            exit 1
          fi

          # ---- E2E was skipped: was that legitimate? ----

          # Nothing was deployed, so there was nothing to test. Covers draft
          # PRs, dependabot, and PRs that touch no app-affecting paths.
          if [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "⏭️ Deploy was skipped (draft PR / dependabot / no app-affecting changes) — no E2E expected"
            exit 0
          fi

          # Explicit opt-out on a manual run.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SKIP_E2E_INPUT" = "true" ]; then
            echo "⏭️ E2E skipped by the explicit skip_e2e workflow_dispatch input"
            exit 0
          fi

          # The shared-store queue timed out or errored, so the shards never
          # ran. That is a real no-answer, not a pass — re-run the workflow.
          if [ "${QUEUE_RESULT:-}" = "failure" ] || [ "${QUEUE_RESULT:-}" = "cancelled" ]; then
            echo "::error::The shared-store queue did not succeed (result: ${QUEUE_RESULT:-}), so the E2E shards never ran. Re-run this workflow once the store frees up."
            exit 1
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Deploy did not succeed (result: $DEPLOY_RESULT), so the E2E shards never ran. A broken deploy is not a passing E2E run."
            exit 1
          fi

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Deploy reported success but published an EMPTY deployment URL, so every E2E shard was skipped. Refusing to count a silent no-deploy as a passing E2E run — check the '🚀 Deploy preview' step's EAS output."
            exit 1
          fi

          echo "::error::A deployment URL was published ($DEPLOY_URL) but the E2E shards were skipped. Failing the gate."
          exit 1

  e2e-report:
    name: 📊 Merge E2E Reports
    needs: [deploy, e2e]
    if: always() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      result: ${{ needs.e2e.result }}
    steps:
      - name: 🏗 Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20.x

      - name: 📥 Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: 🔎 Check blob reports
        id: check-blob-reports
        run: |
          if [ -d all-blob-reports ] && [ -n "$(find all-blob-reports -type f -print -quit)" ]; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No blob report artifacts found. Skipping report merge."
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📊 Merge reports
        if: steps.check-blob-reports.outputs.has_reports == 'true'
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json

      - name: 📊 Generate test summary
        if: always()
        run: |
          echo "## 🎭 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "test-results.json" ]; then
            total=$(jq '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' test-results.json)
            passed=$(jq '.stats.expected' test-results.json)
            failed=$(jq '.stats.unexpected' test-results.json)
            skipped=$(jq '.stats.skipped' test-results.json)
            duration=$(jq '.stats.duration / 1000 | floor' test-results.json)

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $failed |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${duration}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$failed" -gt 0 ]; then
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              jq -r '.suites[].suites[]?.specs[]? | select(.ok == false) | "❌ " + .title + "\n   " + (.tests[0].results[0].error.message // "No error message" | split("\n")[0])' test-results.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not parse failures"
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 [View full HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Upload merged report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results.json
          retention-days: 30

  comment:
    name: 💬 PR Comment
    needs: [deploy, e2e, e2e-report]
    # `needs.deploy.result != 'skipped'` keeps the workflow quiet on PRs that
    # touch no app-affecting paths — without it the workflow now runs on every
    # PR and would post a misleading "❌ Failed to deploy" summary.
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: 🏗 Checkout (for gh CLI)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📥 Download test results
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: playwright-report-${{ github.sha }}
          path: test-artifacts

      - name: 📥 Download all screenshot artifacts
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: playwright-screenshots-*
          path: all-screenshots
          merge-multiple: true

      - name: 📤 Upload screenshots for embedding
        id: upload-screenshots
        if: needs.e2e.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find screenshot files
          if [ ! -d "all-screenshots" ]; then
            echo "screenshot_data=" >> $GITHUB_OUTPUT
            exit 0
          fi

          SCREENSHOTS=$(find all-screenshots -name "*.png" -type f | head -6)
          if [ -z "$SCREENSHOTS" ]; then
            echo "screenshot_data=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create a tag for this PR's screenshots
          TAG="e2e-screenshots-pr${{ github.event.pull_request.number }}-${{ github.sha }}"

          # Delete existing release if it exists (from previous runs)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          # Create a new release
          gh release create "$TAG" \
            --title "E2E Screenshots - PR #${{ github.event.pull_request.number }}" \
            --notes "Automated screenshots from E2E test failures. This release will be cleaned up automatically." \
            --prerelease

          # Upload screenshots and collect URLs with test context
          DATA=""
          INDEX=1
          for FILE in $SCREENSHOTS; do
            # Get the parent directory name which contains test info
            PARENT_DIR=$(basename "$(dirname "$FILE")")
            BASENAME=$(basename "$FILE")

            # Extract test name from parent dir (format: testfile-TestSuite-testname-project)
            # Convert dashes and underscores to spaces for readability
            TEST_NAME=$(echo "$PARENT_DIR" | sed 's/-retry[0-9]*$//' | sed 's/---/ - /g' | sed 's/-/ /g' | sed 's/_/ /g')

            # Create unique filename with index and copy file (gh release upload uses original filename)
            SAFE_NAME="screenshot-${INDEX}.png"
            cp "$FILE" "/tmp/$SAFE_NAME"

            gh release upload "$TAG" "/tmp/$SAFE_NAME" --clobber

            # Construct the download URL
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SAFE_NAME}"

            # Store both URL and test name (pipe-separated)
            DATA="${DATA}${TEST_NAME}|${URL}\n"

            echo "Uploaded: $SAFE_NAME ($TEST_NAME)"
            INDEX=$((INDEX + 1))
          done

          # Output data for use in comment
          echo "screenshot_data<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: 💬 Comment on PR
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const deployUrl = '${{ needs.deploy.outputs.deployment_url }}';
            const isProduction = '${{ needs.deploy.outputs.is_production }}' === 'true';
            const e2eResult = '${{ needs.e2e.result }}';
            const sha = '${{ github.sha }}'.substring(0, 7);
            const runId = '${{ github.run_id }}';

            let e2eStatus = '⏳ Pending';
            let e2eDetails = '';

            if (e2eResult === 'success') {
              e2eStatus = '✅ Passed';
            } else if (e2eResult === 'failure') {
              e2eStatus = '❌ Failed';

              // Try to parse test results for failure details
              try {
                const resultsPath = 'test-artifacts/test-results.json';
                if (fs.existsSync(resultsPath)) {
                  const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                  const failures = [];

                  // Recursively find all failed specs
                  function findFailures(suites, filePath = '') {
                    for (const suite of suites || []) {
                      const currentPath = filePath || suite.file || '';

                      // Check specs in this suite
                      for (const spec of suite.specs || []) {
                        if (!spec.ok) {
                          const test = spec.tests?.[0];
                          const result = test?.results?.[0];
                          const error = result?.error;

                          // Get the project name (free/pro, authenticated/unauthenticated)
                          const projectName = test?.projectName || 'unknown';

                          // Extract meaningful error info
                          let errorSummary = 'Unknown error';
                          if (error?.message) {
                            // Get the assertion failure line
                            const lines = error.message.split('\n');
                            const assertionLine = lines.find(l =>
                              l.includes('expect(') ||
                              l.includes('Expected:') ||
                              l.includes('Received:') ||
                              l.includes('Locator:') ||
                              l.includes('Timeout')
                            ) || lines[0];
                            errorSummary = assertionLine.trim().substring(0, 150);
                          }

                          // Get the file name without full path
                          const fileName = currentPath.split('/').pop() || 'unknown';

                          failures.push({
                            title: spec.title,
                            file: fileName,
                            project: projectName,
                            error: errorSummary,
                            fullError: error?.message?.substring(0, 500) || ''
                          });
                        }
                      }

                      // Recurse into nested suites
                      if (suite.suites) {
                        findFailures(suite.suites, currentPath);
                      }
                    }
                  }

                  findFailures(results.suites);

                  if (failures.length > 0) {
                    // Group failures by file
                    const byFile = {};
                    for (const f of failures) {
                      if (!byFile[f.file]) byFile[f.file] = [];
                      byFile[f.file].push(f);
                    }

                    e2eDetails = `\n\n### ❌ Failed Tests (${failures.length} total)\n\n`;

                    // Show first 8 failures with details
                    let shown = 0;
                    for (const [file, fileFailures] of Object.entries(byFile)) {
                      if (shown >= 8) break;

                      e2eDetails += `**${file}**\n`;
                      for (const f of fileFailures.slice(0, 3)) {
                        if (shown >= 8) break;
                        e2eDetails += `- \`[${f.project}]\` ${f.title}\n`;
                        e2eDetails += `  > ${f.error}\n`;
                        shown++;
                      }
                      if (fileFailures.length > 3) {
                        e2eDetails += `  _...and ${fileFailures.length - 3} more in this file_\n`;
                      }
                      e2eDetails += '\n';
                    }

                    if (failures.length > 8) {
                      e2eDetails += `\n_...and ${failures.length - 8} more failures_\n`;
                    }

                    // Add a collapsible section with full error details
                    e2eDetails += `\n<details>\n<summary>📋 Full error details (first 5)</summary>\n\n`;
                    for (const f of failures.slice(0, 5)) {
                      e2eDetails += `#### ${f.file} - ${f.title}\n`;
                      e2eDetails += `**Project:** \`${f.project}\`\n\n`;
                      e2eDetails += '```\n' + (f.fullError || 'No error details') + '\n```\n\n';
                    }
                    e2eDetails += `</details>\n`;
                  }
                }
              } catch (e) {
                console.log('Could not parse test results:', e.message);
                e2eDetails += `\n\n_Could not parse test results: ${e.message}_\n`;
              }

              // Embed uploaded screenshots with test context
              const screenshotData = `${{ steps.upload-screenshots.outputs.screenshot_data }}`.trim().split('\n').filter(s => s && s.includes('|'));

              if (screenshotData.length > 0) {
                e2eDetails += `\n### 📸 Failure Screenshots\n\n`;
                for (const line of screenshotData) {
                  const [testName, url] = line.split('|');
                  if (testName && url) {
                    // Truncate long test names but show the key parts
                    const displayName = testName.length > 80 ? testName.substring(0, 77) + '...' : testName;
                    e2eDetails += `<details>\n<summary>📷 ${displayName}</summary>\n\n`;
                    e2eDetails += `![${displayName}](${url})\n\n`;
                    e2eDetails += `</details>\n\n`;
                  }
                }
              }

              // List additional screenshots if there are more
              try {
                if (fs.existsSync('all-screenshots')) {
                  const allScreenshots = [];
                  function findScreenshots(dir) {
                    const items = fs.readdirSync(dir);
                    for (const item of items) {
                      const fullPath = path.join(dir, item);
                      if (fs.statSync(fullPath).isDirectory()) {
                        findScreenshots(fullPath);
                      } else if (item.endsWith('.png')) {
                        allScreenshots.push(fullPath);
                      }
                    }
                  }
                  findScreenshots('all-screenshots');

                  if (allScreenshots.length > screenshotUrls.length) {
                    e2eDetails += `<details>\n<summary>📁 All screenshot files (${allScreenshots.length} total)</summary>\n\n`;
                    for (const s of allScreenshots.slice(0, 30)) {
                      const name = s.replace('all-screenshots/', '');
                      e2eDetails += `- \`${name}\`\n`;
                    }
                    if (allScreenshots.length > 30) {
                      e2eDetails += `- _...and ${allScreenshots.length - 30} more_\n`;
                    }
                    e2eDetails += `\n[Download all from artifacts](https://github.com/${{ github.repository }}/actions/runs/${runId}#artifacts)\n`;
                    e2eDetails += `</details>\n`;
                  }
                }
              } catch (e) {
                console.log('Could not list screenshots:', e.message);
              }

              e2eDetails += `\n### 🔗 Debug Links\n`;
              e2eDetails += `- 📊 [View HTML test report](https://github.com/${{ github.repository }}/actions/runs/${runId}) (download \`playwright-report-*\` artifact)\n`;
              e2eDetails += `- 📸 [Download screenshots](https://github.com/${{ github.repository }}/actions/runs/${runId}#artifacts)\n`;
              e2eDetails += `- 🎬 Videos are included in screenshot artifacts for failed tests\n`;
            } else if (e2eResult === 'skipped') {
              e2eStatus = '⏭️ Skipped';
            } else if (e2eResult === 'cancelled') {
              e2eStatus = '🚫 Cancelled';
            }

            const tableRows = [
              '| Item | Status |',
              '|------|--------|',
              `| **Preview URL** | ${deployUrl ? '[' + deployUrl + '](' + deployUrl + ')' : '❌ Failed to deploy'} |`,
              `| **E2E Tests** | ${e2eStatus} |`,
              `| **Commit** | \`${sha}\` |`
            ].join('\n');

            let quickLinks = '';
            if (deployUrl) {
              quickLinks = `\n\n### 🔗 Quick Links\n- [Preview App](${deployUrl})\n- [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${runId})`;
            }

            const body = `## 🚀 Deployment Summary\n\n${tableRows}${quickLinks}${e2eDetails}\n\n---\n<sub>🤖 Updated by GitHub Actions</sub>`;

            // Find and update existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Deployment Summary')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
