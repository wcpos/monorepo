name: Release react-native-resizable-panels

on:
  workflow_dispatch:
    inputs:
      tag:
        description: NPM distribution tag
        type: choice
        required: true
        default: latest
        options:
          - latest
          - beta
          - next
      dry-run:
        description: Validate the publish without uploading to npm
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # id-token: npm Trusted Publishing — the registry trusts this repo + workflow file via
    # GitHub OIDC, so there is no NPM_TOKEN; provenance attestations come from the same identity.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # workflow_dispatch can be pointed at any ref. Only commits that are already on a
      # release trunk may reach the publish step with NPM_TOKEN; `--no-git-checks` below
      # deliberately disables pnpm's own branch check, so this is the gate.
      - name: 🛡 Require a merged trunk commit
        run: |
          git fetch --no-tags origin main next 2>/dev/null || git fetch --no-tags origin main
          for trunk in main next; do
            if git merge-base --is-ancestor HEAD "origin/$trunk" 2>/dev/null; then
              echo "HEAD is on $trunk"
              exit 0
            fi
          done
          echo "::error::Refusing to release: HEAD is not contained in origin/main or origin/next. Dispatch this workflow from a trunk branch."
          exit 1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          rxdb-license-key: ${{ secrets.RXDB_LICENSE_KEY }}


      - name: 🔍 Typecheck
        run: pnpm --filter react-native-resizable-panels typecheck

      - name: 🧹 Lint
        run: pnpm --filter react-native-resizable-panels lint

      - name: 🧪 Test
        run: pnpm --filter react-native-resizable-panels test --maxWorkers=2

      - name: 📦 Check publish tarball
        run: pnpm --filter react-native-resizable-panels check:publish

      # The committed version is what gets published; bumps happen in ordinary PRs.
      # An already-published version is not an error: it is the recovery path for a
      # re-run after the publish succeeded but the tag/release step failed, so upload is
      # skipped and the remaining release metadata is completed idempotently.
      - name: 🏷 Read committed version
        id: version
        working-directory: packages/resizable-panels
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "react-native-resizable-panels@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::react-native-resizable-panels@$VERSION is already on npm; skipping upload and completing tag/release only."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to npm (dry run)
        if: ${{ inputs.dry-run && steps.version.outputs.published == 'false' }}
        working-directory: packages/resizable-panels
        run: pnpm publish --access public --tag "${{ inputs.tag }}" --no-git-checks --provenance --dry-run

      - name: 🚀 Publish to npm
        if: ${{ !inputs.dry-run && steps.version.outputs.published == 'false' }}
        working-directory: packages/resizable-panels
        run: pnpm publish --access public --tag "${{ inputs.tag }}" --no-git-checks --provenance

      # Only stable releases receive a matching repository tag and GitHub release.
      # Both steps are idempotent so a re-run can finish what a transient failure left undone.
      - name: 🔖 Create git tag
        if: ${{ !inputs.dry-run && inputs.tag == 'latest' }}
        env:
          RELEASE_TAG: react-native-resizable-panels@${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: 📝 Create GitHub release
        if: ${{ !inputs.dry-run && inputs.tag == 'latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: react-native-resizable-panels@${{ steps.version.outputs.value }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
