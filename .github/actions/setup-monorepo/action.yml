name: Setup Monorepo
description: Prepare and install everything for the monorepo

inputs:
  node-version:
    description: Version of Node to use
    default: "22.22.2"
  eas-version:
    description: Version of EAS CLI to use
    default: "latest"
  expo-token:
    description: Expo token to authenticate with
    required: false
  rxdb-license-key:
    description: RXDB License Key
    required: false
  skip-install-scripts:
    description: Skip package lifecycle scripts during pnpm install
    default: "false"

runs:
  using: "composite"
  steps:
    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v4

    - name: 🏗 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ inputs.eas-version }}
        token: ${{ inputs.expo-token }}

    # No apt step: `jq` is preinstalled on GitHub's Ubuntu runners and
    # libsecret-1-dev is only needed by the EAS Android pre-install hook,
    # which runs on EAS build servers, never here. The `apt-get update`
    # this used to run hung a shard for 36 minutes on a flaky mirror
    # (2026-08-18) while installing nothing this job uses.
    - name: 🏗 Add RXDB_LICENSE_KEY to package.json
      env:
        RXDB_LICENSE_KEY: ${{ inputs.rxdb-license-key }}
      run: |
        jq --arg license "$RXDB_LICENSE_KEY" '.accessTokens["rxdb-premium"] = $license' package.json > tmp.json && mv tmp.json package.json
      shell: bash

    # - name: 🏗️ Init and update rn-primitives submodule
    #   run: |
    #     git submodule init packages/rn-primitives
    #     git submodule update packages/rn-primitives
    #   shell: bash

    # --frozen-lockfile: the lockfile is the contract. --no-frozen-lockfile
    # (unexplained since 2025-05) re-resolved on every runner and left
    # node_modules ~100 packages away from the lockfile, so the first
    # `pnpm run` of every turbo-driven step re-installed to prune them
    # ("Packages: -103", 7 s) — and on 2026-09-02 three of those run-time
    # installs never handed over to turbo (runs 33664427747, 33687923179,
    # 33684523571: silence for 20–75 min until the Merge Gate's budget
    # failed the PR). A stale lockfile now fails HERE, loudly, in seconds.
    - name: 📦 Install dependencies
      run: |
        if [ "${{ inputs.skip-install-scripts }}" = "true" ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash

    - name: ♻️ Restore cache
      uses: actions/cache@v4
      with:
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}
        # Turbo v2 stores its local cache in .turbo/cache — the old
        # node_modules/.cache/turbo path had been persisting an EMPTY directory
        # since the v2 upgrade, so every deploy rebuilt from scratch.
        # node_modules/.cache carries Metro's content-addressed transform
        # cache, which makes `expo export` incremental even when the turbo
        # task itself misses (any apps/main source change).
        path: |
          .turbo/cache
          node_modules/.cache
          apps/*/.turbo
          packages/*/.turbo
