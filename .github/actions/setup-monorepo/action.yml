name: Setup Monorepo
description: Prepare and install everything for the monorepo

inputs:
  node-version:
    description: Version of Node to use
    default: '22.22.2'
  eas-version:
    description: Version of EAS CLI to use
    default: 'latest'
  expo-token:
    description: Expo token to authenticate with
    required: false
  rxdb-license-key:
    description: RXDB License Key
    required: false
  skip-install-scripts:
    description: Skip package lifecycle scripts during pnpm install
    default: 'false'
  cache-save:
    description: >-
      Save the turbo cache at job end (true only for a main-branch job that
      runs the full turbo graph; everything else restores read-only)
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v4

    - name: 🏗 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ inputs.eas-version }}
        token: ${{ inputs.expo-token }}

    # No apt step: `jq` is preinstalled on GitHub's Ubuntu runners and
    # libsecret-1-dev is only needed by the EAS Android pre-install hook,
    # which runs on EAS build servers, never here. The `apt-get update`
    # this used to run hung a shard for 36 minutes on a flaky mirror
    # (2026-08-18) while installing nothing this job uses.
    - name: 🏗 Add RXDB_LICENSE_KEY to package.json
      env:
        RXDB_LICENSE_KEY: ${{ inputs.rxdb-license-key }}
      run: |
        jq --arg license "$RXDB_LICENSE_KEY" '.accessTokens["rxdb-premium"] = $license' package.json > tmp.json && mv tmp.json package.json
      shell: bash

    # - name: 🏗️ Init and update rn-primitives submodule
    #   run: |
    #     git submodule init packages/rn-primitives
    #     git submodule update packages/rn-primitives
    #   shell: bash

    # apps/web is a git submodule AND a pnpm workspace member (`apps/*`). The
    # root `preinstall` script initialises it *during* `pnpm install`, so the
    # project set pnpm installed for differs from the tree it leaves behind —
    # every later `pnpm run`/`pnpm exec` then warns "Your node_modules are out
    # of sync with your lockfile. The workspace structure has changed since
    # last install" (and, before #1799, re-installed: "Packages: -103"). Put
    # the submodule in place first so the install sees the final workspace.
    - name: 🏗 Init the apps/web workspace submodule
      run: git submodule update --init apps/web
      shell: bash

    # --frozen-lockfile: the lockfile is the contract. --no-frozen-lockfile
    # (unexplained since 2025-05) re-resolved on every runner and left
    # node_modules ~100 packages away from the lockfile, so the first
    # `pnpm run` of every turbo-driven step re-installed to prune them
    # ("Packages: -103", 7 s) — and on 2026-09-02 three of those run-time
    # installs never handed over to turbo (runs 33664427747, 33687923179,
    # 33684523571: silence for 20–75 min until the Merge Gate's budget
    # failed the PR). A stale lockfile now fails HERE, loudly, in seconds.
    # And this is the ONLY install: pnpm-workspace.yaml's
    # `verifyDepsBeforeRun: warn` stops pnpm 11 from re-installing before
    # every `pnpm run` / `pnpm exec` (its default is `install`; the same
    # silent hand-over hang recurred on 2026-09-03 with the frozen lockfile in
    # place — runs 33734477552 and 33734477584).
    - name: 📦 Install dependencies
      run: |
        if [ "${{ inputs.skip-install-scripts }}" = "true" ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash

    # One turbo cache entry per OS per UTC day, saved by main, not one per
    # commit. A per-commit key saved a fresh 360-380 MB entry for every PR
    # head and every merge on both runner OSes; the repo's 10 GB cache quota
    # filled within hours and its LRU evicted the entries read least often —
    # the native E2E dev client, read once per main run and worth $3 to
    # rebuild (2026-09-03: 23 entries at 8.3 GB, the dev client gone within
    # 40 minutes of a hit).
    #
    # Caches are scoped by branch, so a PR that saved would mint its own
    # daily entry; PRs (and any job that runs no turbo task) therefore
    # restore read-only through actions/cache/restore, and only a main job
    # that runs the full turbo graph passes cache-save=true. An exact-key hit
    # never re-saves, so the day's entry is the first such main job's output
    # and later commits restore it via restore-keys and rebuild only what
    # changed; turbo hashes inputs, so correctness does not depend on the
    # entry being current.
    - name: 🗓 Cache day
      id: cache-day
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: ♻️ Restore cache
      if: inputs.cache-save != 'true'
      uses: actions/cache/restore@v4
      with:
        key: turbo-${{ runner.os }}-${{ steps.cache-day.outputs.day }}
        restore-keys: |
          turbo-${{ runner.os }}
        path: |
          .turbo/cache
          node_modules/.cache
          apps/*/.turbo
          packages/*/.turbo

    - name: ♻️ Restore cache (saved at job end)
      if: inputs.cache-save == 'true'
      uses: actions/cache@v4
      with:
        key: turbo-${{ runner.os }}-${{ steps.cache-day.outputs.day }}
        restore-keys: |
          turbo-${{ runner.os }}
        # Turbo v2 stores its local cache in .turbo/cache — the old
        # node_modules/.cache/turbo path had been persisting an EMPTY directory
        # since the v2 upgrade, so every deploy rebuilt from scratch.
        # node_modules/.cache carries Metro's content-addressed transform
        # cache, which makes `expo export` incremental even when the turbo
        # task itself misses (any apps/main source change).
        path: |
          .turbo/cache
          node_modules/.cache
          apps/*/.turbo
          packages/*/.turbo
