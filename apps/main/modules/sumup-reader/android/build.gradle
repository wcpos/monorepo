apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.sumupreader'
version = '0.1.0'

repositories {
	maven { url 'https://maven.sumup.com/releases' }
}
android {
	namespace 'expo.modules.sumupreader'
	defaultConfig {
		minSdkVersion 26
		versionCode 1
		versionName '0.1.0'
	}
}
dependencies {
	implementation 'com.sumup:merchant-sdk:7.1.0'
}
