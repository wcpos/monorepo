<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Desktop (Electron) only. The shell hides the native title bar, so the top strip of the
      page — the height Chromium reports for its Window Controls Overlay, which the app
      reserves as top inset (components/desktop-window-chrome.electron.tsx) — is the handle
      for moving the window. Chromium builds the drag region geometrically: the union of
      `drag` boxes minus every `no-drag` box, whatever is painted on top. So anything that can
      be tapped is opted out, or a sheet's close button, a toast or a list scrolled up into
      the strip would move the window instead. Inert in a browser tab: `titlebar-area-height`
      is undefined there (0px strip) and `app-region` only has meaning under a Window
      Controls Overlay.
    -->
    <style id="desktop-window-drag-region">
      #window-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(titlebar-area-height, 0px);
        pointer-events: none;
        -webkit-app-region: drag;
        app-region: drag;
      }
      /* Everything tappable — except what cannot take a pointer: a closed drawer's
         full-window scrim stays laid out with an inline `pointer-events: none`, and a
         no-drag box that size would carve the strip away. (`app-region: none` does not
         undo an earlier `no-drag` in Chromium, so the exclusion has to be in the selector.) */
      :is(button, a[href], input, select, textarea, [tabindex],
          [role="dialog"], [role="menu"], [role="listbox"], [data-sonner-toaster]):not([style*="pointer-events: none"]) {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
    </style>
    <script>
      // only define opfsWorker when _not_ running under Electron
      if (!navigator.userAgent.includes('Electron')) {
        window.opfsWorker = '/sqlite.worker.js';
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- Desktop window drag handle; see the style block in <head>. -->
    <div id="window-drag-region"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
