appId: com.wcpos.main.dev
---
# P0-5: drawer navigation smoke — visit main areas, return to POS.
#
# One subflow per visit: it opens a phone drawer (closing one left open first)
# and, on a large screen's permanent rail, only confirms the items are there.
- runFlow:
    file: ../subflows/ensure-pos-ready.yml
- runFlow:
    file: ../subflows/open-drawer.yml
- tapOn:
    id: "drawer-item-products"
- extendedWaitUntil:
    visible:
      id: "screen-products"
    timeout: 60000
- runFlow:
    file: ../subflows/open-drawer.yml
- tapOn:
    id: "drawer-item-orders"
- extendedWaitUntil:
    visible:
      id: "screen-orders"
    timeout: 60000
- runFlow:
    file: ../subflows/open-drawer.yml
- tapOn:
    id: "drawer-item-customers"
- extendedWaitUntil:
    visible:
      id: "screen-customers"
    timeout: 60000
- runFlow:
    file: ../subflows/open-drawer.yml
- takeScreenshot: 05-before-pos-tap
- tapOn:
    id: "drawer-item-pos"
- takeScreenshot: 05-after-pos-tap
# search-products is visible BESIDE an open phone drawer, so it cannot prove
# the drawer closed. The router closes the drawer when the focused index
# changes; require it gone (runs 33645848904, 33666934729 left it open).
# Not on a permanent rail: it never closes, and the POS screen is the proof.
- runFlow:
    when:
      notVisible:
        id: "drawer-panel-permanent"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "drawer-item-pos"
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
