appId: com.wcpos.main.dev
---
# P0-5: drawer navigation smoke — visit main areas, return to POS.
- runFlow:
    file: ../subflows/ensure-pos-ready.yml
# Small screens hide the rail behind a drawer button; large screens show it.
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
    commands:
      - tapOn:
          id: "drawer-open-button"
- tapOn:
    id: "drawer-item-products"
- extendedWaitUntil:
    visible:
      id: "screen-products"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
    commands:
      - tapOn:
          id: "drawer-open-button"
- tapOn:
    id: "drawer-item-orders"
- extendedWaitUntil:
    visible:
      id: "screen-orders"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
    commands:
      - tapOn:
          id: "drawer-open-button"
- tapOn:
    id: "drawer-item-customers"
- extendedWaitUntil:
    visible:
      id: "screen-customers"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
    commands:
      - tapOn:
          id: "drawer-open-button"
- tapOn:
    id: "drawer-item-pos"
# search-products is visible BESIDE an open phone drawer, so it cannot prove
# the drawer closed. Tapping the focused item dispatches closeDrawer; require
# the drawer gone (run 33645848904: a lost tap left it open into flow 06).
- extendedWaitUntil:
    notVisible:
      id: "drawer-item-pos"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
