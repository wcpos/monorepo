appId: com.wcpos.main.dev
---
# P0-5: drawer navigation smoke — visit main areas, return to POS.
- runFlow:
    file: ../subflows/ensure-pos-ready.yml
# Small screens hide the rail behind a drawer button; large screens show it.
# A drawer left open swallows the header tap: the hamburger sits under the
# drawer's first item, so "open" becomes "tap POS" and the route sequence
# silently changes (run 33666934729 ended with the drawer open over POS).
# Require it closed first; close through the scrim if it is not, and log it.
- runFlow:
    when:
      visible:
        id: "drawer-item-pos"
    commands:
      - evalScript: "${console.log('WCPOS_E2E drawer already open before the header tap, closing through the scrim')}"
      - tapOn:
          point: "85%,50%"
      - extendedWaitUntil:
          notVisible:
            id: "drawer-item-pos"
          timeout: 10000
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
    commands:
      - tapOn:
          id: "drawer-open-button"
- extendedWaitUntil:
    visible:
      id: "drawer-item-pos"
    timeout: 10000
- tapOn:
    id: "drawer-item-products"
- extendedWaitUntil:
    visible:
      id: "screen-products"
    timeout: 60000
