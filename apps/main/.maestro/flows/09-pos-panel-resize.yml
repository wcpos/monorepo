appId: com.wcpos.main.dev
---
# P0-9: the tablet POS split resizes by drag and the user-chosen width survives a relaunch.
# Session comes from 02-auth-setup; do NOT clear state. Phones render the tabbed layout
# without a resize handle and skip the guarded block.
#
# State is read from the handle's accessibility label ("Resize handle, NN%"), which the
# library keeps live for VoiceOver/TalkBack. NN is a ROUNDED percentage, so the flow
# asserts BANDS, never an exact number: the products panel starts around the
# initial-settings width of 60 (55..75) and a LEFT swipe shrinks it out of that band
# and into 25..54 (clamped to minSize 25). The bands are disjoint on purpose — a
# handle that never moved cannot satisfy the post-swipe assertion.
# Split stop/launch + a screenshot-based settle: a combined `launchApp:
# {stopApp: true}` can race the XCTest driver's first hierarchy query and be
# reported as "App crashed" — see flow 08's relaunch for the evidence.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Android: a cold `launchApp` can land on the dev launcher's HOME screen
# instead of reloading the last project (PR #1690 run 33279550244 attempt 2,
# phone, flow 05: "Development servers … Recently opened" with the app never
# loaded, so the first assertion timed out on the launcher). Reload through
# the same deep link flows 01/02 use; inert when the app came up normally.
- runFlow:
    when:
      platform: Android
      visible: "(?i)fetch development servers"
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      - waitForAnimationToEnd:
          timeout: 5000
# Run 33513307174 (Android phone, flow 05): the login Custom Tab from flow
# 02's retype recovery lives in the app task's back stack and can resurface
# over the app on ANY relaunch, not only flow 03's. Same gated dismissal as
# flow 03: fires only when the login form itself is visible, so it can never
# background a loading app; login-page text, not testID (third-party browser
# content — the selector-policy exemption flow 02 documents).
# Run 33527914510 (Android phone, flow 06): the tab resurfaces
# ASYNCHRONOUSLY — a one-shot check right after launch raced it and lost
# (guard SKIPPED, tab then took the screen for the whole readiness wait).
# Re-evaluate the dismissal at each retry leg; 3 legs × 40s keep the old
# 120s readiness budget (maxRetries counts RETRIES: executions = 3).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: Android
            visible: "Username or Email Address|Nombre de usuario o correo electrónico"
          commands:
            - evalScript: "${console.log('WCPOS_E2E lingering login tab over the relaunched app, pressing back once')}"
            - back
            - waitForAnimationToEnd:
                timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "screen-pos"
          timeout: 40000
# On a DECLARED tablet the handle is REQUIRED, so a regression that routes tablets
# to the phone layout fails here instead of quietly skipping the guarded block below.
#
# There is deliberately NO `env: DEVICE_CLASS` default in this flow: under Maestro
# 2.6.1 a flow-level env block is a second `Define variables` command that runs
# AFTER the CLI's `-e` vars and SHADOWS them, which made this guard inert. Run
# 33297473431 (iOS tablet) logged all three lines:
#   DefineVariablesCommand(env={VARIABLE_PRODUCT_ID=107940, DEVICE_CLASS=tablet, ...})
#   DefineVariablesCommand(env={DEVICE_CLASS=auto})
#   Run flow when ${DEVICE_CLASS == 'tablet'} is true SKIPPED
# DEVICE_CLASS therefore comes from the CLI only: e2e-native.yml passes
# `-e DEVICE_CLASS=<matrix.device.name>` (phone|tablet) on both platforms, and
# scripts/e2e-native-local.sh passes `-e DEVICE_CLASS="$DEVICE_CLASS"` (--device,
# default phone). A bare `maestro test apps/main/.maestro` leaves it undefined; the
# typeof guard reads that as "no declared class" rather than erroring, and the
# handle-visibility block below still runs.
- runFlow:
    when:
      true: "${typeof DEVICE_CLASS !== 'undefined' && DEVICE_CLASS === 'tablet'}"
    commands:
      - assertVisible:
          id: "pos-resize-handle"
- runFlow:
    when:
      visible:
        id: "pos-resize-handle"
    commands:
      # Regression check for #1620: tablet launch must render the full cart column,
      # not the pre-layout 60:1 sliver. The referent is the cart column's HEADER,
      # not the totals: this flow runs after 08 voided the current order, so the
      # relaunch lands on a fresh EMPTY order (CurrentOrderProvider falls back to
      # `newOrder` when the remembered uuid is gone) and an empty cart has no
      # subtotal row — run 33285279390's iOS tablet passed 01–08 and died here
      # on `cart-subtotal`. The customer chip is rendered for every order.
      - assertVisible:
          id: "cart-customer-name"
      # 55..75, not an exact 60: the label is `Math.round(layout[products])` of a
      # width that need not print as the initial-settings 60 — a previous session's
      # drag persists a fractional width (onLayoutChanged → patchUI writes the raw
      # percentage), and rounding on a given device width can land a point either
      # side. #1620 is not a rounding error: the pre-layout 60:1 flexGrow fallback
      # renders the cart as a ~1.5% sliver, i.e. a products panel in the high 90s,
      # so ANY value in the sane band disproves it while an exact 60 only adds
      # flake (iOS tablet, PR #1704 run 33297473431). 75 is the ceiling the cart's
      # minSize 25 allows.
      - assertVisible:
          id: "pos-resize-handle"
          text: "Resize handle, (5[5-9]|6[0-9]|7[0-5])%"
      - swipe:
          from:
            id: "pos-resize-handle"
          direction: LEFT
          duration: 600
      # 25..54: shrunk out of the pre-swipe band (>= 55) but never below minSize 25,
      # so the assertion cannot pass on an unmoved handle — the two bands do not
      # overlap. The shrunk band is the wider of the two because the swipe distance,
      # not the starting width, is the uncertain quantity here.
      - extendedWaitUntil:
          visible:
            id: "pos-resize-handle"
            text: "Resize handle, (2[5-9]|[34][0-9]|5[0-4])%"
          timeout: 10000
      # A stopped relaunch reads the width persisted by onLayoutChanged → patchUI.
      # Split stop/launch + a screenshot-based settle: a combined `launchApp:
      # {stopApp: true}` can race the XCTest driver's first hierarchy query and be
      # reported as "App crashed" — see flow 08's relaunch for the evidence.
      - stopApp
      - launchApp
      - waitForAnimationToEnd:
          timeout: 5000
      # Same class-6 guard as this flow's first relaunch (codex review, #1750):
      # the orphaned login tab can resurface on ANY relaunch, including this
      # nested persistence-check one.
      # Run 33527914510 (Android phone, flow 06): the tab resurfaces
      # ASYNCHRONOUSLY — a one-shot check right after launch raced it and lost
      # (guard SKIPPED, tab then took the screen for the whole readiness wait).
      # Re-evaluate the dismissal at each retry leg; 3 legs × 40s keep the old
      # 120s readiness budget (maxRetries counts RETRIES: executions = 3).
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  platform: Android
                  visible: "Username or Email Address|Nombre de usuario o correo electrónico"
                commands:
                  - evalScript: "${console.log('WCPOS_E2E lingering login tab over the relaunched app, pressing back once')}"
                  - back
                  - waitForAnimationToEnd:
                      timeout: 5000
            - extendedWaitUntil:
                visible:
                  id: "screen-pos"
                timeout: 40000
      - assertVisible:
          id: "pos-resize-handle"
          text: "Resize handle, (2[5-9]|[34][0-9]|5[0-4])%"
      # ...and did NOT snap back to anywhere in the default band.
      - assertNotVisible:
          id: "pos-resize-handle"
          text: "Resize handle, (5[5-9]|6[0-9]|7[0-5])%"
