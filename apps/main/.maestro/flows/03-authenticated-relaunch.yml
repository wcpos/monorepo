appId: com.wcpos.main.dev
---
# P0-3: authenticated relaunch — the session hydrates from native SQLite and
# the POS appears WITHOUT reconnecting. This behavior is also the mechanism
# every later flow relies on (auth decision #698: OAuth once, reuse session).
# Split stop/launch + a screenshot-based settle: a combined `launchApp:
# {stopApp: true}` can race the XCTest driver's first hierarchy query and be
# reported as "App crashed" — see flow 08's relaunch for the evidence.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Android: a cold `launchApp` can land on the dev launcher's HOME screen
# instead of reloading the last project (PR #1690 run 33279550244 attempt 2,
# phone, flow 05: "Development servers … Recently opened" with the app never
# loaded, so the first assertion timed out on the launcher). Reload through
# the same deep link flows 01/02 use; inert when the app came up normally.
- runFlow:
    when:
      platform: Android
      visible: "(?i)fetch development servers"
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      - waitForAnimationToEnd:
          timeout: 5000
# The launcher can answer a launch with its own manifest-timeout error
# screen instead of the app — tap Reload rather than letting the wait
# below spend its whole budget staring at it. Inert on a healthy launch;
# evidence, the 10s timeout and the text-selector exemption are in the
# subflow.
- runFlow:
    file: ../subflows/recover-dev-launcher.yml
    env:
      APP_READY_TESTID: search-products
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
- assertNotVisible:
    id: "store-url-input"
