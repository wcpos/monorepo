appId: com.wcpos.main.dev
env:
  STORE_URL: https://dev-pro.wcpos.com
---
# P0-1: clean launch → connect screen renders; invalid URL does not connect.
- launchApp:
    clearState: true
# clearState wipes app data INCLUDING the dev launcher's most-recent-project
# memory, so a plain relaunch would land on the launcher UI, not the app.
# Deep-link the launcher straight into the Metro-served bundle (CI runs
# `expo start --no-dev --minify` on the runner; Android reaches it via
# `adb reverse`; local runs are identical). Flows without clearState don't
# need this: the dev client's default launchMode ("most-recent") reconnects
# to the last-opened bundle on its own.
# LITERAL url, not an env reference: Maestro 2.6.1 does not substitute
# ${VARS} inside openLink — run 33147024766 opened the literal string
# "${DEV_CLIENT_URL}", the step reported COMPLETED, and the launcher sat on
# its home screen. Keep this in step with flow 02.
- openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
- extendedWaitUntil:
    visible:
      id: "store-url-input"
    timeout: 60000
- assertVisible:
    id: "connect-store-button"
- assertVisible:
    id: "enter-demo-store-button"
# Invalid URL must not produce a connected site.
- tapOn:
    id: "store-url-input"
- inputText: "https://not-a-real-store.invalid"
- hideKeyboard
- tapOn:
    id: "connect-store-button"
# The button disables while the discovery request is in flight; waiting for it
# to be enabled again proves the request settled (there is no "Loading" text).
- extendedWaitUntil:
    visible:
      id: "connect-store-button"
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: "logged-in-users-label"
- assertVisible:
    id: "store-url-input"
