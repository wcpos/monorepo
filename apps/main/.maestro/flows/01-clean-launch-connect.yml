appId: com.wcpos.main.dev
env:
  STORE_URL: https://dev-pro.wcpos.com
  INVALID_URL: https://not-a-real-store.invalid
---
# P0-1: clean launch → connect screen renders; invalid URL does not connect.
#
# clearState WITHOUT launching, then let openLink itself cold-start the app,
# so the dev launcher receives the URL as its LAUNCH intent and loads the
# Metro-served bundle (CI runs `expo start --no-dev --minify` on the runner;
# Android reaches it via `adb reverse`; local runs are identical).
#
# Hard-won ordering — three live failures shaped these two commands:
# - clearState wipes the launcher's most-recent-project memory with the app
#   data, so SOME link is required here; flows without clearState need none
#   (launchMode "most-recent" reconnects on its own).
# - `launchApp` first + openLink after RACES the cold start on Android: run
#   33158377084's logcat shows the VIEW intent delivered while the process
#   was still spawning — dropped, launcher home screen. Do not "launch then
#   link".
# - LITERAL url: Maestro 2.6.1 does not substitute ${VARS} inside openLink
#   (run 33147024766 opened the literal string, step still COMPLETED).
# Keep in step with flow 02.
- clearState
# One retry re-issuing the link. Two live shapes on starved CI runners, both
# right after clearState's uninstall+reinstall (27-50 s there vs 0.4 s
# locally), neither reproducible on a healthy machine:
# - run 33312573162 (iOS tablet): openLink COMPLETED in 5 s but the link was
#   silently DROPPED - home screen, no scheme prompt, no splash, for 5.5 min.
# - run 33348495405 (iOS tablet, flow 02): openLink itself THREW - simctl
#   answered NSPOSIXErrorDomain code=60 (operation timed out) and the flow
#   died on the spot with the home screen in the failure frame.
# The retry covers both: the required store-url-input wait at the end of the
# block is deliberately the retry gate, and a re-run re-issues the link.
# Android never showed the class; the wrapper is platform-neutral because a
# re-issued link is idempotent there (same VIEW intent the launcher expects).
- retry:
    maxRetries: 1
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      # Launch blockers. The dev client's own overlays (floating dev-menu button,
      # menu-at-launch, onboarding card) are switched OFF by default in the
      # development build — apps/main/plugins/with-quiet-dev-menu.js — so the only
      # surfaces between openLink and the app are system-owned:
      #   Android: a queued ANR dialog ("Wait"), when the workflow enabled
      #            hide_error_dialogs too late.
      #   iOS:     SpringBoard's "Open in “WCPOS”?" scheme confirmation. clearState
      #            on iOS is uninstall+reinstall, and a simulator that has not yet
      #            trusted the scheme asks first. CI creates a fresh simulator every
      #            run (deterministic there; runs 33217891131 and 33218641226 sat
      #            behind it); a reused local simulator never shows it, so the wait
      #            is optional. The prompt can arrive >30s after openLink (run
      #            33220523217), so it is checked AGAIN after the cold-start wait —
      #            two surfaces on independent clocks must be handled in both
      #            orders, never one.
      # If the dev menu ever comes back, the required store-url-input wait below
      # fails visibly at a self-describing step; nothing here races it.
      # Menu/prompt text, not testID: third-party native UI — the app's selector
      # policy cannot apply.
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: "Wait"
                optional: true
      - runFlow:
          when:
            platform: iOS
          commands:
            - extendedWaitUntil:
                visible:
                  text: "Open in .*WCPOS.*"
                timeout: 45000
                optional: true
            - runFlow:
                when:
                  visible:
                    text: "Open in .*WCPOS.*"
                commands:
                  - tapOn:
                      text: "Open"
                  # The app is mid-launch after "Open"; a hierarchy query during the
                  # scene transition can answer kAXErrorInvalidUIElement, which
                  # Maestro 2.6.1 raises as an UNCAUGHT exception (run 33262053590
                  # iOS phone: flow 01 died there and the JVM then hung for 53 min).
                  # Screenshot-based settle first, same as every relaunch.
                  - waitForAnimationToEnd:
                      timeout: 5000
            # Cold start: first fetch of the ~29 MB Metro bundle plus Hermes parse.
            # 60s expired on CI with the app still on its splash (run 33219707312);
            # the suite budgets 120-240s elsewhere. Optional only so a LATE scheme
            # prompt sitting in front of it can still be cleared next.
            - extendedWaitUntil:
                visible:
                  id: "store-url-input"
                timeout: 60000
                optional: true
            - runFlow:
                when:
                  visible:
                    text: "Open in .*WCPOS.*"
                commands:
                  - tapOn:
                      text: "Open"
                  # Same settle as the early-prompt tap above: the required wait
                  # below is the next hierarchy query, and the app is mid-launch.
                  - waitForAnimationToEnd:
                      timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "store-url-input"
          timeout: 180000
- assertVisible:
    id: "connect-store-button"
- assertVisible:
    id: "enter-demo-store-button"
# Invalid URL must not produce a connected site.
# Run 33348495405 (Android tablet): the driver's single inputText gRPC call
# for this whole string hit its 120 s deadline on a starved emulator with
# only "https://not-" typed (DEADLINE_EXCEEDED, flow dead on the spot). One
# printable key per Maestro command makes every keystroke its own driver
# call - the pattern flows 04/06/07 already use for search - and the retry
# erases the partial text before retyping. Keep in step with flow 02.
- retry:
    maxRetries: 2
    commands:
      # The field may already hold text: flow 02 starts on flow 01's connect
      # screen (the invalid URL is still in the box), and a retry leg starts on
      # the previous leg's text. A tap lands the caret wherever the finger falls
      # and eraseText only erases BEFORE the caret, so on Android the retype was
      # spliced into the leftover — "https://dev-pro.wcpos.comalid", three legs
      # in a row (run 33631408939, Android phone, flow 02). Clear through the
      # field's own × first; it renders only while the field has text.
      - runFlow:
          when:
            visible:
              id: "store-url-clear"
          commands:
            - tapOn:
                id: "store-url-clear"
      - tapOn:
          id: "store-url-input"
      - eraseText
      - evalScript: ${output.urlCharIndex = 0}
      - repeat:
          while:
            true: ${output.urlCharIndex < INVALID_URL.length}
          commands:
            - inputText: ${INVALID_URL.charAt(output.urlCharIndex)}
            - evalScript: ${output.urlCharIndex++}
      # Class 7 (run 33513307174, iOS phone, flow 02's twin loop): a lost press
      # does not FAIL inputText — the loop can complete with a truncated URL
      # and the flow then probes a half-typed host. Assert the full URL landed;
      # a mismatch fails this attempt so the retry erases and retypes. The
      # asserted text IS the referent (the exact string this loop just typed),
      # not localized UI copy — the selector policy's composite-string carve-out.
      - assertVisible:
          text: '${INVALID_URL.replace(/\./g, "\\.")}'
# optional: hideKeyboard is unreliable on iOS (this file already says so at
# the two Android-gated uses below, but this one was left ungated and failed
# a local iOS suite run 2026-08-29 at exactly this step, having passed the
# same step minutes earlier). Dismissing the keyboard is housekeeping — if it
# genuinely covers the next target, THAT tap fails and names the real problem.
# Failing here instead just reports "Hide Keyboard" and hides which element
# was blocked.
- hideKeyboard:
    optional: true
- tapOn:
    id: "connect-store-button"
# The button disables while the discovery request is in flight; waiting for it
# to be enabled again proves the request settled (there is no "Loading" text).
- extendedWaitUntil:
    visible:
      id: "connect-store-button"
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: "logged-in-users-label"
- assertVisible:
    id: "store-url-input"
