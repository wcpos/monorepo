appId: com.wcpos.main.dev
env:
  STORE_URL: https://dev-pro.wcpos.com
  E2E_USERNAME: demo
  E2E_PASSWORD: demo
---
# P0-2: controlled authentication — the ONE real-OAuth flow (doubles as suite
# setup; later flows reuse the session it persists). Auth decision: #698.
# clearState without launching, then openLink cold-starts the app with the
# URL as its launch intent, then dismiss the dev menu that auto-opens over
# the app after any data clear — see flow 01 for the four live failures
# behind this exact sequence; keep the two flows in step.
- clearState
- openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
# Launch blockers. The dev client's own overlays (floating dev-menu button,
# menu-at-launch, onboarding card) are switched OFF by default in the
# development build — apps/main/plugins/with-quiet-dev-menu.js — so the only
# surfaces between openLink and the app are system-owned:
#   Android: a queued ANR dialog ("Wait"), when the workflow enabled
#            hide_error_dialogs too late.
#   iOS:     SpringBoard's "Open in “WCPOS”?" scheme confirmation. clearState
#            on iOS is uninstall+reinstall, and a simulator that has not yet
#            trusted the scheme asks first. CI creates a fresh simulator every
#            run (deterministic there; runs 33217891131 and 33218641226 sat
#            behind it); a reused local simulator never shows it, so the wait
#            is optional. The prompt can arrive >30s after openLink (run
#            33220523217), so it is checked AGAIN after the cold-start wait —
#            two surfaces on independent clocks must be handled in both
#            orders, never one.
# If the dev menu ever comes back, the required store-url-input wait below
# fails visibly at a self-describing step; nothing here races it.
# Menu/prompt text, not testID: third-party native UI — the app's selector
# policy cannot apply.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Wait"
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Open in .*WCPOS.*"
          timeout: 45000
          optional: true
      - runFlow:
          when:
            visible:
              text: "Open in .*WCPOS.*"
          commands:
            - tapOn:
                text: "Open"
            # The app is mid-launch after "Open"; a hierarchy query during the
            # scene transition can answer kAXErrorInvalidUIElement, which
            # Maestro 2.6.1 raises as an UNCAUGHT exception (run 33262053590
            # iOS phone: flow 01 died there and the JVM then hung for 53 min).
            # Screenshot-based settle first, same as every relaunch.
            - waitForAnimationToEnd:
                timeout: 5000
      # Cold start: first fetch of the ~29 MB Metro bundle plus Hermes parse.
      # 60s expired on CI with the app still on its splash (run 33219707312);
      # the suite budgets 120-240s elsewhere. Optional only so a LATE scheme
      # prompt sitting in front of it can still be cleared next.
      - extendedWaitUntil:
          visible:
            id: "store-url-input"
          timeout: 180000
          optional: true
      - runFlow:
          when:
            visible:
              text: "Open in .*WCPOS.*"
          commands:
            - tapOn:
                text: "Open"
            # Same settle as the early-prompt tap above: the required wait
            # below is the next hierarchy query, and the app is mid-launch.
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      id: "store-url-input"
    timeout: 180000
- tapOn:
    id: "store-url-input"
- inputText: ${STORE_URL}
# See flow 01: iOS hideKeyboard can clear this input. It is housekeeping here,
# so only Android needs it before tapping the button.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard:
          optional: true
- tapOn:
    id: "connect-store-button"
- extendedWaitUntil:
    visible:
      id: "add-user-button"
    timeout: 60000
- tapOn:
    id: "add-user-button"
# iOS shows the ASWebAuthenticationSession consent alert ("WCPOS" Wants to
# Use "wcpos.com" to Sign In); Android goes straight to the Custom Tab (spike
# #696 / check on #698). The alert is NOT immediate: on the CI simulator it
# surfaced more than 10 s after the tap (main run 33268389943, iOS phone) —
# Maestro's one-shot `when: visible` had already given up, and the flow then
# spent its whole 60 s login-page wait looking at the alert. Wait for EITHER
# surface first; the tap stays conditional, so Android and an already-
# consented simulator skip it.
- extendedWaitUntil:
    visible: "Continue|Use without an account|Username or Email Address|Nombre de usuario o correo electrónico"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# Fresh CI emulators open the Custom Tab into Chrome's FIRST-RUN experience
# ("Welcome to Chrome") — the login page sits behind it, which is where every
# Android nightly died (verified from run 33066217397's failure screenshot).
# Wait for either surface, then dismiss whichever FRE screens appear; each
# tap is conditional, so this is inert on iOS and once Chrome skips its FRE.
- extendedWaitUntil:
    visible: "Use without an account|Username or Email Address|Nombre de usuario o correo electrónico"
    timeout: 60000
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- runFlow:
    when:
      visible: "No thanks|No, thanks|Not now|Got it"
    commands:
      - tapOn: "No thanks|No, thanks|Not now|Got it"
# The WP login form arrives EMPTY on dev-pro, and the page may render
# localized (observed: Spanish). Match EN|ES labels until the store's login
# locale is pinned (spec §3c).
- extendedWaitUntil:
    visible: "Username or Email Address|Nombre de usuario o correo electrónico"
    timeout: 60000
- tapOn: "Username or Email Address|Nombre de usuario o correo electrónico"
- inputText: ${E2E_USERNAME}
# Android: the soft keyboard covers the password field — ENTER advances focus.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- tapOn: "Password|Contraseña"
- inputText: ${E2E_PASSWORD}
# Android: the soft keyboard covers the submit button — dismiss it, then tap.
# iOS: tapping the web form's submit button killed the XCUITest runner on
# BOTH simulators ("Failed to connect" at exactly this tap; run 33074068139,
# iOS 26.2), while inputText into the same web view worked throughout — so
# submit with the keyboard's return key, which activates the form's default
# submit button without the crashing element tap.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn: "Log In|Acceder"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "\n"
# Redirect returns through the wcpos:// deep link.
- extendedWaitUntil:
    visible:
      id: "logged-in-users-label"
    timeout: 120000
# Returning from the auth browser re-focuses the store-URL input and reopens
# the soft keyboard over the store list / Open POS button — both Android jobs
# in run 33074068139 logged in fine and then failed exactly there. Dismiss it
# before asserting the stores. Android-scoped because hideKeyboard is broken
# on iOS (see above) — if iOS shows the same overlay, its artifacts will say so.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# Select the first store and open the POS (store rows tagged in PR #730).
- extendedWaitUntil:
    visible:
      id: "store-option-.*"
    timeout: 120000
- tapOn:
    id: "store-option-.*"
# StoreSelect keeps the button disabled while cashier validation is in flight;
# tapping a disabled native button no-ops silently. Validation itself is one
# fast round-trip (~1.5s even on CI emulators — the store rows this flow just
# tapped only render after it succeeds). The 60s/180s timeouts of runs
# 33074068139/33081118544/33088418779 were NOT slow validation: the Button
# component dropped its `disabled` prop (undefined) when it enabled, and RN
# Android never re-enables a view whose accessibilityState vanishes, so the
# node stayed enabled=false for Maestro/TalkBack while visually active
# (monorepo#1614 defect 1; fixed in @wcpos/components Button). This wait now
# doubles as the regression gate for that accessibility latch. A genuinely
# failed validation keeps the button disabled and still fails here.
- extendedWaitUntil:
    visible:
      id: "open-pos-button"
      enabled: true
    timeout: 180000
- tapOn:
    id: "open-pos-button"
# Initial RxDB product sync on a cold database (240s budget was never
# approached in the spike, but keep the headroom).
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 240000
# The demo catalog defaults to an In-Stock filter that can hide products.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
