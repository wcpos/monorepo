# TEMPORARY (#3678 proof, desk ruling 2026-11-19): drop before READY.
# Replays flow 04 seven more times on the Android phone only, to show the
# native checkout panel no longer strands at opacity 0 on a starved emulator.
appId: com.wcpos.main.dev
---
- runFlow:
    when:
      platform: Android
      true: "${typeof DEVICE_CLASS !== 'undefined' && DEVICE_CLASS === 'phone'}"
    commands:
      - repeat:
          times: 7
          commands:
            - runFlow:
                file: 04-cash-sale.yml
