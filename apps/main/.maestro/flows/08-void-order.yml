appId: com.wcpos.main.dev
---
# P0-8: void ONE identified order and prove relaunch does not resurrect it.
#
# Identity without an id. Tabs are keyed `open-order-tab-<uuid>` and Maestro
# cannot read a testID's suffix, but every tab already renders its order's
# total ("Cart $43,718.19" — `CartTabTitle`). This flow makes the total
# unique, so the total IS the order's handle: create-and-find (store-agnostic
# policy), no hidden markers, no product change.
#
# Why not "no open-order tab may exist": a store with many open orders is a
# valid state (owner ruling, 2026-08-29 — dev-pro holds ~2,400 pos-open orders
# in the E2E cashier's scope), and the old tab loop tapped index 0, the OLDEST
# open order, i.e. it voided the store's fixture orders one by one.
#
# The void itself: the cashier role cannot DELETE (`woocommerce_rest_cannot_delete`),
# so the app converts the void to `status: pending` (buttons/void.tsx). Open
# tabs are filtered to `pos-open`, so the converted order must not return.
- runFlow:
    file: ../subflows/ensure-pos-ready.yml
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
# iOS lost-press (class seen in flows 04/06/07, #1719/#1726/#1727): the tab tap
# above was delivered and swallowed on run 33417438187 (flow failed on
# add-cart-item-menu while the screenshot showed Products still active, zero
# recoveries). Same remedy: bounded settle, then one logged re-tap.
# add-cart-item-menu is the cart screen's tell — present even on an empty cart
# (this flow taps it on exactly that state below).
- extendedWaitUntil:
    visible:
      id: "add-cart-item-menu"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "add-cart-item-menu"
    commands:
      - evalScript: "${console.log('WCPOS_E2E cart screen not shown after the tab tap, re-tapping once')}"
      - runFlow:
          when:
            visible:
              id: "pos-tab-cart"
          commands:
            - tapOn:
                id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "add-cart-item-menu"
    timeout: 15000
# A relaunch opens a FRESH current order, so the cart is empty and has no tab
# of its own yet — it gets one on the first write below.
- assertNotVisible:
    id: "cart-quantity-input"
# Mint a run-unique amount: 5-digit dollars + 2-digit cents, a 9M-value space
# (P(collision) with ~2,400 open orders ≈ 0.03%). ES5 only — Maestro's JS
# engine has no padStart. Typed in two bursts below because a single
# `inputText` of ≥8 keys is a barcode scan to the wedge heuristic (#1680).
- evalScript: ${output.dollars = String(10000 + Math.floor(Math.random() * 90000))}
- evalScript: ${output.cents = String(Math.floor(Math.random() * 100)); if (output.cents.length < 2) { output.cents = '0' + output.cents }}
# The referent is the AMOUNT the flow itself injected, not localized copy:
# `.` stands in for the store's separators, `.?` for the thousands one, so the
# pattern is currency-format-agnostic (10,000.00 / 10000,00 / 10 000.00).
- evalScript: ${output.amountRe = '.*' + output.dollars.slice(0, 2) + '.?' + output.dollars.slice(2) + '.' + output.cents + '.*'}
# Add a fee for exactly that amount. `prices_include_tax` defaults ON, so the
# order total equals the typed amount whatever the store's tax setup is.
- tapOn:
    id: "add-cart-item-menu"
# Lost-press guard: settle briefly, and only if the dropdown never opened
# re-tap once (a re-tap on an OPEN menu would close it, so the check matters).
- extendedWaitUntil:
    visible:
      id: "menu-add-fee"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "menu-add-fee"
    commands:
      - evalScript: "${console.log('WCPOS_E2E add-item menu did not open, re-tapping once')}"
      - tapOn:
          id: "add-cart-item-menu"
- tapOn:
    id: "menu-add-fee"
- extendedWaitUntil:
    visible:
      id: "add-fee-dialog"
    timeout: 30000
- tapOn:
    id: "fee-amount-input"
- eraseText
- inputText: ${output.dollars}
- inputText: ".${output.cents}"
- assertVisible:
    text: "${output.dollars}.${output.cents}"
# The submit button sits UNDER the numeric keyboard on a phone (y≈543 vs a
# keyboard top of ≈516 on an iPhone 16 Pro) and iOS `hideKeyboard` failed
# here (run 2026-08-29 16:27, "Hide Keyboard... WARNED"), so the tap landed
# on the keypad and the dialog never closed. Return in the optional name field
# blurs a single-line TextInput on both platforms, which takes the keyboard
# down deterministically; `hideKeyboard` stays as optional housekeeping.
- tapOn:
    id: "fee-name-input"
- inputText: "\n"
- hideKeyboard:
    optional: true
- tapOn:
    id: "add-to-cart-submit"
- extendedWaitUntil:
    notVisible:
      id: "add-fee-dialog"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "cart-subtotal"
    timeout: 30000
# The order now has a tab, and the tab carries our amount. This positive
# assertion is what makes the negative ones below meaningful.
- extendedWaitUntil:
    visible:
      text: "${output.amountRe}"
    timeout: 30000
- tapOn:
    id: "void-button"
# The voided order leaves the tab strip and the cart falls back to a fresh
# empty order. Do not retry this destructive tap: while the server delete is
# in flight the amount can remain visible, so visibility cannot distinguish a
# swallowed press from an accepted mutation.
- extendedWaitUntil:
    notVisible:
      text: "${output.amountRe}"
    timeout: 30000
- assertNotVisible:
    id: "cart-quantity-input"
# Relaunch: the voided order must not come back. Tabs sort date_created ASC
# (use-open-orders-resource.ts), so a resurrected order would sit at the END
# of the strip beside the "+" tab; the strip auto-scrolls to the selected
# "new" tab on mount. Requiring the "+" tab on screen first means the
# negative assertion is looking exactly where a ghost would appear.
#
# stopApp and launchApp are SEPARATE here, with a settle before the first
# hierarchy query. A combined `launchApp: {stopApp: true}` straight after the
# void raced the XCTest driver: the new process existed (syslog 16:36:08.97)
# but its scene activated at 16:36:09.41, and the driver's hierarchy request
# at 16:36:09.20 answered "Application … is not running", which Maestro
# reports as an app crash (local iOS 18.6, 2026-08-29, three runs in a row —
# no crash report, process alive 25s later, manual terminate+launch 3/3).
# `waitForAnimationToEnd` is screenshot-based, so it does not query the
# app's hierarchy while the scene is still coming up.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Android: a cold `launchApp` can land on the dev launcher's HOME screen
# instead of reloading the last project (PR #1690 run 33279550244 attempt 2,
# phone, flow 05: "Development servers … Recently opened" with the app never
# loaded, so the first assertion timed out on the launcher). Reload through
# the same deep link flows 01/02 use; inert when the app came up normally.
- runFlow:
    when:
      platform: Android
      visible: "(?i)fetch development servers"
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      - waitForAnimationToEnd:
          timeout: 5000
# Run 33513307174 (Android phone, flow 05): the login Custom Tab from flow
# 02's retype recovery lives in the app task's back stack and can resurface
# over the app on ANY relaunch, not only flow 03's. Same gated dismissal as
# flow 03: fires only when the login form itself is visible, so it can never
# background a loading app; login-page text, not testID (third-party browser
# content — the selector-policy exemption flow 02 documents).
# Run 33527914510 (Android phone, flow 06): the tab resurfaces
# ASYNCHRONOUSLY — a one-shot check right after launch raced it and lost
# (guard SKIPPED, tab then took the screen for the whole readiness wait).
# Re-evaluate the dismissal at each retry leg; 3 legs × 40s keep the old
# 120s readiness budget (maxRetries counts RETRIES: executions = 3).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: Android
            visible: "Username or Email Address|Nombre de usuario o correo electrónico"
          commands:
            - evalScript: "${console.log('WCPOS_E2E lingering login tab over the relaunched app, force-stopping Chrome')}"
            # NOT `back`: the tab keeps web history (authorize → login form) and back
            # navigates it instead of closing the tab — run 33574072528 flow 07.
            - stopApp: com.android.chrome
            - waitForAnimationToEnd:
                timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "search-products"
          timeout: 40000
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
# Same lost-press guard as the first cart navigation above. Without it, a
# swallowed tab tap leaves Products on screen, where the empty-cart negative
# assert below would pass VACUOUSLY and the ghost check would look at the
# wrong screen entirely.
- extendedWaitUntil:
    visible:
      id: "add-cart-item-menu"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "add-cart-item-menu"
    commands:
      - evalScript: "${console.log('WCPOS_E2E cart screen not shown after the relaunch tab tap, re-tapping once')}"
      - runFlow:
          when:
            visible:
              id: "pos-tab-cart"
          commands:
            - tapOn:
                id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "add-cart-item-menu"
    timeout: 15000
- assertNotVisible:
    id: "cart-quantity-input"
- extendedWaitUntil:
    visible:
      id: "new-order-tab"
    timeout: 30000
- assertNotVisible:
    text: "${output.amountRe}"
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
