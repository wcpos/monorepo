appId: com.wcpos.main.dev
---
# P0-8: void the open orders and prove relaunch does not resurrect them.
# Every relaunch since 04 opened a FRESH current order, stranding each prior
# flow's cart in its own open-order tab (06's and 07's both survive to here —
# see run 33137492733's flow-07 screenshot). Voiding only "the current order"
# would void a fresh EMPTY one and pass vacuously, so: void every populated
# open-order tab in a loop, then relaunch and assert none came back.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "open-order-tab-.*"
    timeout: 30000
- repeat:
    while:
      visible:
        id: "open-order-tab-.*"
    commands:
      - tapOn:
          id: "open-order-tab-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "void-button"
          timeout: 30000
      - tapOn:
          id: "void-button"
      # Confirm if a confirmation dialog appears.
      - runFlow:
          when:
            visible: "Void|Confirm"
          commands:
            - tapOn: "Void|Confirm"
      # The voided order's tab must disappear before the next iteration reads
      # the tab list again, or the loop re-taps a ghost.
      - extendedWaitUntil:
          notVisible:
            id: "cart-quantity-input"
          timeout: 30000
- assertNotVisible:
    id: "cart-quantity-input"
# Relaunch: no voided order may come back.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- assertNotVisible:
    id: "cart-quantity-input"
- assertNotVisible:
    id: "open-order-tab-.*"
