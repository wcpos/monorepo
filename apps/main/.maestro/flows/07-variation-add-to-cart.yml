appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product, so the
  # flow never depends on a store's remembered catalogue. Keep these three in
  # step with the seed script's VARIABLE_* constants.
  VARIABLE_PRODUCT_SEARCH: WCPOS E2E Variable
  VARIATION_OPTION: Small
  # CI overrides this with the seeded product's remote id (the seed exports it
  # and the workflow passes `maestro test -e VARIABLE_PRODUCT_ID=…`), pinning
  # the tap to that product's id-bearing testID even if another catalogue
  # record matches the search. Locally the default matches any variable tile
  # left visible by the search filter.
  VARIABLE_PRODUCT_ID: ".*"
---
# P0-7 (added 2026-08-27): variable-product popover → pick a variation → cart.
# The original 7-flow suite never touched variations, which is how the
# native-only variation-popover crash (#1574 era) shipped unseen — the popover
# is a native portal surface, so merely opening it is half the regression test.
# Session comes from 02; the cart already holds 06's line — do NOT clear state.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
# The In-Stock filter resets on every relaunch — clear it before searching.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
# Typing retried, search speed NOT — see flow 04 for the ruling and both
# mechanisms. This flow's phone failure in run 33176268259 was the
# demand-path case (query typed CLEAN, "Mostrando 0 de 205", spinner still
# turning at 60s while iOS answered the same store in seconds) — exactly
# what the single un-retried wait below must go on reporting.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "search-products"
      - eraseText
      # Type the query in CHUNKS, because one `inputText` types like a
      # BARCODE SCANNER and the app is right to treat it as one.
      #
      # The wedge heuristic dispatches a scan for an unbroken run of at least
      # `barcode_scanning_min_chars` (8) keys averaging under
      # `barcode_scanning_avg_time_input_threshold` (24ms) — about 480 WPM, so
      # no cashier, but every scanner and every `inputText`. The app then puts
      # the unresolved code in the search box, which is INTENDED behaviour
      # (owner ruling), and the code it writes is the detector's reconstruction
      # rather than what was typed: run 33244082123's device logs carry
      # `"barcode":"CPOS E2E Simple"`, `"OS E2E Variable"` and `"Variable"` as
      # dispatched scans. That is what left this box holding a mangled query.
      #
      # NB this corrects the note above: the dropped leading characters are not
      # an Android IME race. They are the same on iOS, they appear in the logs
      # as barcode scans, and `foldWedgeKey` restarts its buffer whenever an
      # inter-key gap exceeds the threshold — which the tap-to-first-key gap
      # always does.
      #
      # A burst ends after WEDGE_END_OF_SCAN_MS (150ms) of silence and separate
      # Maestro commands are far slower than that, so each chunk is its own
      # burst; at 6 characters each is under the 8-key minimum and is filtered
      # before the product lookup (use-barcode-detection.ts). Nothing is
      # dispatched, and typing at human speed is exactly what this flow means
      # to simulate.
      #
      # Three chunks of 6 cover terms up to 18 characters, which both seeded
      # fixtures are. A longer term would put >= 8 characters in the final
      # chunk and reintroduce the scan — the assertVisible below is the
      # backstop, and it fails loudly rather than silently.
      #
      # Verified on device: two runs, query intact, ZERO scans dispatched,
      # 6 too-short bursts logged and filtered (3 chunks x 2 runs).
      - evalScript: ${output.q1 = VARIABLE_PRODUCT_SEARCH.slice(0, 6)}
      - evalScript: ${output.q2 = VARIABLE_PRODUCT_SEARCH.slice(6, 12)}
      - evalScript: ${output.q3 = VARIABLE_PRODUCT_SEARCH.slice(12)}
      - inputText: ${output.q1}
      - inputText: ${output.q2}
      - inputText: ${output.q3}
      - assertVisible:
          text: ${VARIABLE_PRODUCT_SEARCH}
- extendedWaitUntil:
    visible:
      id: "variable-product-tile-${VARIABLE_PRODUCT_ID}"
    timeout: 60000
# Dismiss the keyboard BEFORE opening the popover — hideKeyboard afterwards
# could dismiss the popover overlay instead.
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "variable-product-tile-${VARIABLE_PRODUCT_ID}"
    index: 0
# The popover portal mounts and renders option buttons immediately (they come
# from the parent's attributes), but they stay DISABLED until the popover's
# lazy variation sync materializes locally — a tap during that window is a
# silent no-op (the web spec documents the same race). Retry the tap until the
# resolved-variation footer appears; re-tapping an already-selected option is
# a no-op by design, so the retry can never deselect.
- extendedWaitUntil:
    visible:
      id: "variation-option-${VARIATION_OPTION}"
    timeout: 60000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "variation-option-${VARIATION_OPTION}"
      # One seeded attribute → one option resolves a single variation.
      - extendedWaitUntil:
          visible:
            id: "variation-popover-add-to-cart"
          timeout: 20000
- tapOn:
    id: "variation-popover-add-to-cart"
# Adding closes the popover. Phone layout: switch to the cart tab.
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-quantity-input"
    timeout: 30000
# Do NOT assume 06's line shares this cart: relaunching the app opens a FRESH
# current order, so 06's cart survives as a separate open-order tab and the
# variation lands alone in the new one (run 33137492733's failure screenshot:
# one line "Size: Small", with "Carrito 18,00" as a second tab). Assert the
# variation line in the CURRENT cart instead: a quantity cell exists and the
# line carries the seeded attribute. "Size"/"Small" are suite-owned fixture
# data (e2e-native-seed.mjs), not localized UI text, so a text assertion is
# store-agnostic here.
- assertVisible:
    id: "cart-quantity-input"
# The meta row renders key and value as SEPARATE Text nodes ("Size: " +
# "Small"), so a "Size: Small" text assert full-matches neither (run
# 33142398763). Assert the value NODE: the testID and the option text sit
# on the same element.
- assertVisible:
    id: "cart-line-meta-Size"
    text: "${VARIATION_OPTION}"
- assertVisible:
    id: "cart-subtotal"
- assertVisible:
    id: "checkout-button"
