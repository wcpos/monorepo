appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product
  # (store-agnostic policy; keep in step with the seed's SIMPLE_PRODUCT).
  PRODUCT_SEARCH: WCPOS E2E Simple
---
# P0-4: core cash sale — Products → Cart → checkout → back to a fresh order.
# Session comes from 02-auth-setup; do NOT clear state.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
# The In-Stock filter resets on every relaunch (POSProducts remounts with
# showOutOfStock=false) — clear it here, not just in 02-auth-setup.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
# Phone layout splits Products/Cart into tabs; tablet shows both columns.
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
# Typing is retried; SEARCH SPEED IS NOT (owner ruling 2026-08-28: "if it
# takes 60 seconds to return a search, that is a bug or a mis-configured
# test"). Two separate concerns:
# - Android inputText can race the IME and drop LEADING keystrokes (run
#   33176268259's tablet screenshot shows "OS E2E Simple" — "WCP"
#   swallowed). The retry block types and then ASSERTS the exact query text;
#   a mangled entry fails fast, gets erased, and is retyped. Harness repair.
# - The tile wait is a SINGLE 60s, deliberately outside the retry: search
#   rides the server demand plane (require-plane `search` kind), and a
#   correct query that cannot produce a tile in 60s is an app-side
#   demand-path failure the suite must REPORT, never absorb.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "search-products"
      - eraseText
      # Type the query in CHUNKS, because one `inputText` types like a
      # BARCODE SCANNER and the app is right to treat it as one.
      #
      # The wedge heuristic dispatches a scan for an unbroken run of at least
      # `barcode_scanning_min_chars` (8) keys averaging under
      # `barcode_scanning_avg_time_input_threshold` (24ms) — about 480 WPM, so
      # no cashier, but every scanner and every `inputText`. The app then puts
      # the unresolved code in the search box, which is INTENDED behaviour
      # (owner ruling), and the code it writes is the detector's reconstruction
      # rather than what was typed: run 33244082123's device logs carry
      # `"barcode":"CPOS E2E Simple"`, `"OS E2E Variable"` and `"Variable"` as
      # dispatched scans. That is what left this box holding a mangled query.
      #
      # NB this corrects the note above: the dropped leading characters are not
      # an Android IME race. They are the same on iOS, they appear in the logs
      # as barcode scans, and `foldWedgeKey` restarts its buffer whenever an
      # inter-key gap exceeds the threshold — which the tap-to-first-key gap
      # always does.
      #
      # A burst ends after WEDGE_END_OF_SCAN_MS (150ms) of silence and separate
      # Maestro commands are far slower than that, so each chunk is its own
      # burst; at 6 characters each is under the 8-key minimum and is filtered
      # before the product lookup (use-barcode-detection.ts). Nothing is
      # dispatched, and typing at human speed is exactly what this flow means
      # to simulate.
      #
      # Three chunks of 6 cover terms up to 18 characters, which both seeded
      # fixtures are. A longer term would put >= 8 characters in the final
      # chunk and reintroduce the scan — the assertVisible below is the
      # backstop, and it fails loudly rather than silently.
      #
      # Verified on device: two runs, query intact, ZERO scans dispatched,
      # 6 too-short bursts logged and filtered (3 chunks x 2 runs).
      - evalScript: ${output.q1 = PRODUCT_SEARCH.slice(0, 6)}
      - evalScript: ${output.q2 = PRODUCT_SEARCH.slice(6, 12)}
      - evalScript: ${output.q3 = PRODUCT_SEARCH.slice(12)}
      - inputText: ${output.q1}
      - inputText: ${output.q2}
      - inputText: ${output.q3}
      - assertVisible:
          text: ${PRODUCT_SEARCH}
- extendedWaitUntil:
    visible:
      id: "product-tile"
    timeout: 60000
# Dismiss the keyboard BEFORE tapping the tile — with it up, the tile's
# center sits under the overlay and the tap silently no-ops (empty cart in
# run 33088418779; monorepo#1614 defect 2). Flow 07 already taps in this order.
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "product-tile"
    index: 0
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-subtotal"
    timeout: 30000
- assertVisible:
    id: "checkout-button"
- tapOn:
    id: "checkout-button"
- extendedWaitUntil:
    visible:
      id: "checkout-dialog"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "process-payment-button"
    timeout: 60000
- tapOn:
    id: "process-payment-button"
# Receipt appears once the (cash) payment completes.
- extendedWaitUntil:
    visible:
      id: "receipt-close-button"
    timeout: 120000
- tapOn:
    id: "receipt-close-button"
# Back on the POS with a fresh order. Closing the receipt returns to the CART
# route, so the small-screen layout lands on the Cart tab where the products
# search is display:none — navigate back to the Products tab first (run
# 33110203691: both Android-phone failures were exactly this wait). Inert in
# two-column mode, where pos-tab-products does not exist.
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
