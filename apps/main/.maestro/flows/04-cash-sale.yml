appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product
  # (store-agnostic policy; keep in step with the seed's SIMPLE_PRODUCT).
  PRODUCT_SEARCH: WCPOS E2E Simple
---
# P0-4: core cash sale — Products → Cart → checkout → back to a fresh order.
# Session comes from 02-auth-setup; do NOT clear state.
# Split stop/launch + a screenshot-based settle: a combined `launchApp:
# {stopApp: true}` can race the XCTest driver's first hierarchy query and be
# reported as "App crashed" — see flow 08's relaunch for the evidence.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Android: a cold `launchApp` can land on the dev launcher's HOME screen
# instead of reloading the last project (PR #1690 run 33279550244 attempt 2,
# phone, flow 05: "Development servers … Recently opened" with the app never
# loaded, so the first assertion timed out on the launcher). Reload through
# the same deep link flows 01/02 use; inert when the app came up normally.
- runFlow:
    when:
      platform: Android
      visible: "(?i)fetch development servers"
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      - waitForAnimationToEnd:
          timeout: 5000
# The launcher can answer a launch with its own manifest-timeout error
# screen instead of the app — tap Reload rather than letting the wait
# below spend its whole budget staring at it. Inert on a healthy launch;
# evidence, the 10s timeout and the text-selector exemption are in the
# subflow.
- runFlow:
    file: ../subflows/recover-dev-launcher.yml
    env:
      APP_READY_TESTID: search-products
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
# The In-Stock filter resets on every relaunch (POSProducts remounts with
# showOutOfStock=false) — clear it here, not just in 02-auth-setup.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
# Phone layout splits Products/Cart into tabs; tablet shows both columns.
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
# Typing is retried; SEARCH SPEED IS NOT (owner ruling 2026-08-28: "if it
# takes 60 seconds to return a search, that is a bug or a mis-configured
# test"). Two separate concerns:
# - A whole inputText is scanner-fast, so the wedge detector can consume it
#   and reconstruct a query with leading keys missing. The retry block types
#   at human speed and then ASSERTS the exact query text; a mangled entry fails
#   fast, gets erased, and is retyped. Harness repair.
# - The tile wait is a SINGLE 60s, deliberately outside the retry: search
#   rides the server demand plane (require-plane `search` kind), and a
#   correct query that cannot produce a tile in 60s is an app-side
#   demand-path failure the suite must REPORT, never absorb.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "search-products"
      - eraseText
      # One `inputText` is scanner-fast. Device runs prove separate Maestro
      # commands form separate bursts; one printable key cannot latch
      # `foldWedgeKey`, regardless of the store's configured minimum length.
      - evalScript: ${output.searchCharIndex = 0}
      - repeat:
          while:
            true: ${output.searchCharIndex < PRODUCT_SEARCH.length}
          commands:
            - inputText: ${PRODUCT_SEARCH.charAt(output.searchCharIndex)}
            - evalScript: ${output.searchCharIndex++}
      - assertVisible:
          text: ${PRODUCT_SEARCH}
- extendedWaitUntil:
    visible:
      id: "product-tile"
    timeout: 60000
# Dismiss the keyboard BEFORE tapping the tile — with it up, the tile's
# center sits under the overlay and the tap silently no-ops (empty cart in
# run 33088418779; monorepo#1614 defect 2). Flow 07 already taps in this order.
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "product-tile"
    index: 0
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-subtotal"
    timeout: 30000
- assertVisible:
    id: "checkout-button"
- tapOn:
    id: "checkout-button"
- extendedWaitUntil:
    visible:
      id: "checkout-dialog"
    timeout: 60000
# `enabled`, not merely visible: the button renders DISABLED until the
# payment frame reports its load event (#1024 gate in checkout.tsx), and a
# tap on the disabled button is a silent no-op — Maestro still reports
# COMPLETED. Order #117904 (local run 2026-08-29 17:09) sat `pos-open` with no
# payment method for the whole 120s receipt wait because of exactly that.
- extendedWaitUntil:
    visible:
      id: "process-payment-button"
      enabled: true
    timeout: 60000
- tapOn:
    id: "process-payment-button"
# Receipt appears once the (cash) payment completes.
- extendedWaitUntil:
    visible:
      id: "receipt-close-button"
    timeout: 120000
- tapOn:
    id: "receipt-close-button"
# Back on the POS with a fresh order. Closing the receipt returns to the CART
# route, so the small-screen layout lands on the Cart tab where the products
# search is display:none — navigate back to the Products tab first (run
# 33110203691: both Android-phone failures were exactly this wait). Inert in
# two-column mode, where pos-tab-products does not exist.
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
