appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product
  # (store-agnostic policy; keep in step with the seed's SIMPLE_PRODUCT).
  PRODUCT_SEARCH: WCPOS E2E Simple
---
# P0-6: cart quantity editing with the native soft keyboard (the web numpad
# does not exist on native — number-input.tsx is a plain TextInput).
# Split stop/launch + a screenshot-based settle: a combined `launchApp:
# {stopApp: true}` can race the XCTest driver's first hierarchy query and be
# reported as "App crashed" — see flow 08's relaunch for the evidence.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Android: a cold `launchApp` can land on the dev launcher's HOME screen
# instead of reloading the last project (PR #1690 run 33279550244 attempt 2,
# phone, flow 05: "Development servers … Recently opened" with the app never
# loaded, so the first assertion timed out on the launcher). Reload through
# the same deep link flows 01/02 use; inert when the app came up normally.
- runFlow:
    when:
      platform: Android
      visible: "(?i)fetch development servers"
    commands:
      - openLink: "wcpos://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
      - waitForAnimationToEnd:
          timeout: 5000
# The launcher can answer a launch with its own manifest-timeout error
# screen instead of the app — tap Reload rather than letting the wait
# below spend its whole budget staring at it. Inert on a healthy launch;
# evidence, the 10s timeout and the text-selector exemption are in the
# subflow.
- runFlow:
    file: ../subflows/recover-dev-launcher.yml
    env:
      APP_READY_TESTID: search-products
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
# The In-Stock filter resets on every relaunch — clear it before searching.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
# Typing retried, search speed NOT — see flow 04 for the ruling and both
# mechanisms. The single 60s tile wait reports a slow demand path as a
# failure instead of absorbing it.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "search-products"
      - eraseText
      # See flow 04: one printable key per Maestro command cannot latch the
      # wedge detector, regardless of the store's configured minimum length.
      - evalScript: ${output.searchCharIndex = 0}
      - repeat:
          while:
            true: ${output.searchCharIndex < PRODUCT_SEARCH.length}
          commands:
            - inputText: ${PRODUCT_SEARCH.charAt(output.searchCharIndex)}
            - evalScript: ${output.searchCharIndex++}
      - assertVisible:
          text: ${PRODUCT_SEARCH}
- extendedWaitUntil:
    visible:
      id: "product-tile"
    timeout: 60000
# Keyboard down BEFORE the tile tap — same overlay no-op as flow 04
# (monorepo#1614 defect 2); flow 07 set the pattern.
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "product-tile"
    index: 0
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-quantity-input"
    timeout: 30000
- tapOn:
    id: "cart-quantity-input"
- eraseText
- inputText: "3"
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
# Totals recalculate; subtotal stays visible and the cart is intact.
- assertVisible:
    id: "cart-subtotal"
- assertVisible:
    id: "checkout-button"
