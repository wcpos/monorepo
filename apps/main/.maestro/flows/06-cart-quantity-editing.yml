appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product
  # (store-agnostic policy; keep in step with the seed's SIMPLE_PRODUCT).
  PRODUCT_SEARCH: WCPOS E2E Simple
---
# P0-6: cart quantity editing with the native soft keyboard (the web numpad
# does not exist on native — number-input.tsx is a plain TextInput).
- runFlow:
    file: ../subflows/ensure-pos-ready.yml
# Typing retried, search speed NOT — see flow 04 for the ruling and both
# mechanisms. The single 60s tile wait reports a slow demand path as a
# failure instead of absorbing it.
- retry:
    maxRetries: 2
    commands:
      # A retry leg starts on the previous leg's text; a tap lands the caret
      # mid-field and eraseText erases only before it (the URL-field splice,
      # run 33631408939). Clear through the box's own × first.
      - runFlow:
          when:
            visible:
              id: "search-products-clear"
          commands:
            - tapOn:
                id: "search-products-clear"
      - tapOn:
          id: "search-products"
      - eraseText
      # See flow 04: one printable key per Maestro command cannot latch the
      # wedge detector, regardless of the store's configured minimum length.
      - evalScript: ${output.searchCharIndex = 0}
      - repeat:
          while:
            true: ${output.searchCharIndex < PRODUCT_SEARCH.length}
          commands:
            - inputText: ${PRODUCT_SEARCH.charAt(output.searchCharIndex)}
            - evalScript: ${output.searchCharIndex++}
      - assertVisible:
          text: ${PRODUCT_SEARCH}
- extendedWaitUntil:
    visible:
      id: "product-tile"
    timeout: 60000
# Keyboard down BEFORE the tile tap — same overlay no-op as flow 04
# (monorepo#1614 defect 2); flow 07 set the pattern.
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "product-tile"
    index: 0
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
# One logged re-add when the cart shows no line — the same recovery flow 04
# carries, same class: run 33337147851 (Android tablet, two-column layout, no
# tab switch involved) found the product, tapped the tile, and the cart column
# stayed empty; `cart-quantity-input` never appeared in 30 s. The #1614
# defect-2 keyboard no-op and the lost-press family both land here. The log
# line makes every occurrence greppable (count evalScriptCommand COMPLETED in
# the commands JSON — bare maestro.log greps over-count command metadata). A
# re-add on a cart that already has the line still passes the quantity edit
# below (it edits the FIRST quantity cell); the suite voids its orders.
- runFlow:
    when:
      notVisible:
        id: "cart-quantity-input"
    commands:
      - extendedWaitUntil:
          visible:
            id: "cart-quantity-input"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "cart-quantity-input"
          commands:
            - evalScript: "${console.log('WCPOS_E2E cart has no line after the tile tap, re-adding once')}"
            - runFlow:
                when:
                  visible:
                    id: "pos-tab-products"
                commands:
                  - tapOn:
                      id: "pos-tab-products"
            - hideKeyboard:
                optional: true
            - tapOn:
                id: "product-tile"
                index: 0
            - runFlow:
                when:
                  visible:
                    id: "pos-tab-cart"
                commands:
                  - tapOn:
                      id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-quantity-input"
    timeout: 30000
- tapOn:
    id: "cart-quantity-input"
- eraseText
- inputText: "3"
# optional — see flow 01: hideKeyboard is flaky on iOS and this is
# housekeeping; a genuinely covered target fails at its own tap.
- hideKeyboard:
    optional: true
# Totals recalculate; subtotal stays visible and the cart is intact.
- assertVisible:
    id: "cart-subtotal"
- assertVisible:
    id: "checkout-button"
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 60000
