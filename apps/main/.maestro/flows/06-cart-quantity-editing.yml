appId: com.wcpos.main.dev
env:
  # Seeded by scripts/e2e-native-seed.mjs — the suite owns this product
  # (store-agnostic policy; keep in step with the seed's SIMPLE_PRODUCT).
  PRODUCT_SEARCH: WCPOS E2E Simple
---
# P0-6: cart quantity editing with the native soft keyboard (the web numpad
# does not exist on native — number-input.tsx is a plain TextInput).
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "search-products"
    timeout: 120000
# The In-Stock filter resets on every relaunch — clear it before searching.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
# Self-healing search — see flow 04: Android inputText can drop leading
# keystrokes racing the IME; retry re-taps, erases, retypes.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "search-products"
      - eraseText
      - inputText: ${PRODUCT_SEARCH}
      - extendedWaitUntil:
          visible:
            id: "product-tile"
          timeout: 60000
# Keyboard down BEFORE the tile tap — same overlay no-op as flow 04
# (monorepo#1614 defect 2); flow 07 set the pattern.
- hideKeyboard
- tapOn:
    id: "product-tile"
    index: 0
- runFlow:
    when:
      visible:
        id: "pos-tab-cart"
    commands:
      - tapOn:
          id: "pos-tab-cart"
- extendedWaitUntil:
    visible:
      id: "cart-quantity-input"
    timeout: 30000
- tapOn:
    id: "cart-quantity-input"
- eraseText
- inputText: "3"
- hideKeyboard
# Totals recalculate; subtotal stays visible and the cart is intact.
- assertVisible:
    id: "cart-subtotal"
- assertVisible:
    id: "checkout-button"
