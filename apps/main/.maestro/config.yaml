# Maestro workspace for the WCPOS native E2E suite (P0).
# Spec: wayfinder map wcpos/monorepo#688 handoff spec.
# CI entry point: `.github/workflows/e2e-native.yml`, which checks out `main`
# (the shipping lane) and runs the flows nightly against dev-pro.wcpos.com.
# Locally: `maestro test apps/main/.maestro`.
# The suite is deliberately stateful: 02 authenticates once (real OAuth
# against the dev-pro store) and every later flow reuses the SQLite-persisted
# session, so execution order is pinned explicitly — Maestro's default flow
# order is non-deterministic.
# Shared recovery lives in subflows/; healthy flow boundaries never relaunch.
# DIAGNOSTIC BRANCH (diag/android-sync-profile, 2026-11-10): connect, log in,
# then sample tap-to-cart during and after the initial sync. Nothing else.
flows:
  - flows/01-clean-launch-connect.yml
  - flows/02-auth-setup.yml
  - flows/90-diag-cart-timing.yml
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 01-clean-launch-connect
    - 02-auth-setup
    - 90-diag-cart-timing
