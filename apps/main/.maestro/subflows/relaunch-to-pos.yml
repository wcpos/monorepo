appId: com.wcpos.main.dev
# Maestro requires the config section in every flow file, subflows included:
# without it batch mode aborts before the first flow with "Config Section
# Required" (run 33627088324, Android phone, 99 s in, no verdict).
---
# Split stop/launch + a screenshot-based settle: a combined `launchApp:
# {stopApp: true}` can race the XCTest driver's first hierarchy query and be
# reported as "App crashed" — see flow 08's relaunch for the evidence.
- runFlow:
    file: ../subflows/relaunch-app.yml
# The In-Stock filter resets on every relaunch (POSProducts remounts with
# showOutOfStock=false) — clear it here, not just in 02-auth-setup.
- runFlow:
    when:
      visible:
        id: "filter-pill-remove-stock_status"
    commands:
      - tapOn:
          id: "filter-pill-remove-stock_status"
# Phone layout splits Products/Cart into tabs; tablet shows both columns.
- runFlow:
    when:
      visible:
        id: "pos-tab-products"
    commands:
      - tapOn:
          id: "pos-tab-products"
