appId: com.wcpos.main.dev
# Maestro requires the config section in every flow file, subflows included
# (see ensure-pos-ready.yml).
---
# Bring the navigation items on screen.
#
# Small screens hide the rail behind a drawer button. A drawer left open
# swallows the header tap: the hamburger sits under the drawer's first item,
# so "open" becomes "tap POS" and the route sequence silently changes (run
# 33666934729 ended with the drawer open over POS). Require it closed first;
# close through the scrim if it is not, and log it.
#
# Large screens show a permanent rail: the items are always there, there is no
# scrim, and "wait for the items to vanish" can never pass (run 33783980686,
# Android tablet, flow 05 at 34 s). The panel says which kind it is
# (drawer-panel-permanent, drawer-content/index.tsx); on a rail this subflow
# only confirms the items are on screen.
- runFlow:
    when:
      visible:
        id: "drawer-item-pos"
      notVisible:
        id: "drawer-panel-permanent"
    commands:
      - evalScript: "${console.log('WCPOS_E2E drawer already open before the header tap, closing through the scrim')}"
      - tapOn:
          point: "85%,50%"
      - extendedWaitUntil:
          notVisible:
            id: "drawer-item-pos"
          timeout: 10000
# Which button opens the drawer depends on the screen and the lane. `main`
# has one header hamburger (drawer-open-button) on every screen. `next` hides
# that header (drawer `_layout.tsx`, headerShown: false) and gives each screen
# its own: the POS register bar's pos-drawer-open-button, and the page bar's
# `<bar>-menu` on Products, Orders and Customers (page-bar/index.tsx builds
# it from the bar's testID, so the ids are written `<bar>(-menu)`: Maestro
# full-matches the regex and the testID lint checks the bar). Run 36898140001,
# iOS phone, flow 05: the header tap was skipped and the drawer never opened.
# At most one is on screen; once the drawer is open, drawer-item-pos stops
# the rest.
- runFlow:
    when:
      visible:
        id: "drawer-open-button"
      notVisible:
        id: "drawer-item-pos"
    commands:
      - tapOn:
          id: "drawer-open-button"
- runFlow:
    when:
      visible:
        id: "pos-drawer-open-button"
      notVisible:
        id: "drawer-item-pos"
    commands:
      - tapOn:
          id: "pos-drawer-open-button"
- runFlow:
    when:
      visible:
        id: "products-bar(-menu)"
      notVisible:
        id: "drawer-item-pos"
    commands:
      - tapOn:
          id: "products-bar(-menu)"
- runFlow:
    when:
      visible:
        id: "orders-bar(-menu)"
      notVisible:
        id: "drawer-item-pos"
    commands:
      - tapOn:
          id: "orders-bar(-menu)"
- runFlow:
    when:
      visible:
        id: "customers-bar(-menu)"
      notVisible:
        id: "drawer-item-pos"
    commands:
      - tapOn:
          id: "customers-bar(-menu)"
- extendedWaitUntil:
    visible:
      id: "drawer-item-pos"
    timeout: 10000
